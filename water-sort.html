<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Water Sort</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* ================= Основа: деревянный стол из дощечек ================= */
:root{
  --tw:clamp(40px,10.4vw,58px);        /* ширина пробирки  */
  --th:clamp(170px,31vh,236px);        /* высота пробирки  */
  --font:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:var(--font);user-select:none;-webkit-user-select:none;background:#6b3515}
body,.bg-wood{
  background:
    radial-gradient(ellipse 80% 45% at 50% 22%,rgba(255,225,170,.38),transparent 70%),                  /* мягкий свет сверху */
    radial-gradient(ellipse 120% 90% at 50% 50%,transparent 55%,rgba(20,6,0,.65)),                      /* виньетка */
    repeating-linear-gradient(90deg,transparent 0 89px,rgba(0,0,0,.5) 89px 91px,rgba(255,205,150,.16) 91px 92px), /* щели между досками */
    repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 92px,rgba(0,0,0,.08) 92px 184px),           /* разный тон досок */
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='368' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.045 .0035' numOctaves='5' seed='7'/><feColorMatrix values='0 0 0 0 .20 0 0 0 0 .07 0 0 0 0 .02 2.8 0 0 0 -1.05'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"), /* прожилки дерева */
    linear-gradient(#b36a33,#8e4a22);
}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(68px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.screen.on{display:flex}
h1,h2{font-family:var(--font);font-weight:800;margin:0;text-align:center;color:#fff;letter-spacing:1px;text-shadow:0 3px 0 rgba(60,25,0,.55),0 0 14px rgba(0,0,0,.35)}

/* ================= Объёмные кнопки ================= */
.b3{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;min-width:54px;height:52px;padding:0 12px;border:0;border-radius:14px;color:#fff;
  font:800 22px var(--font);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3);
  background:linear-gradient(#6db0ff,#2f74ee);box-shadow:0 5px 0 #1a3f9c,0 9px 12px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.55);transition:transform .08s,box-shadow .08s}
.b3:active{transform:translateY(4px);box-shadow:0 1px 0 #1a3f9c,0 3px 6px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.55)}
.b3.green{background:linear-gradient(#7bf07a,#25b83a);box-shadow:0 5px 0 #0f7a22,0 9px 12px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.b3.green:active{box-shadow:0 1px 0 #0f7a22,0 3px 6px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.b3.red{background:linear-gradient(#ff8a8a,#e03535);box-shadow:0 5px 0 #8c1414,0 9px 12px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.55)}
.b3:disabled{filter:grayscale(.85) brightness(.8);pointer-events:none}
.b3 b{font-weight:800}

/* ================= Экран выбора уровня ================= */
#sLevels::before,#sShop::before{content:"";position:absolute;inset:0;background:rgba(18,10,6,.66);z-index:-1}
.head{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.head h1{font-size:44px}
.chip{display:flex;align-items:center;gap:6px;padding:0 14px;height:44px;border-radius:99px;background:rgba(0,0,0,.45);font:800 20px var(--font);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.chip svg{width:22px;height:22px;fill:#ffd24a;stroke:none;filter:drop-shadow(0 0 4px #ffb300)}
#cont{margin:14px 0 6px;min-width:230px;height:58px;font-size:26px}
#lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 10px;width:100%;max-width:460px;overflow-y:auto;padding:12px 4px 24px;margin-top:6px}
.lv{aspect-ratio:1;border:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;
  font:800 24px var(--font);color:#5a3414;background:linear-gradient(#f6d6b0,#dca877);box-shadow:0 4px 0 #a5744a,0 7px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.7)}
.lv:active{transform:translateY(3px)}
.lv.cur{box-shadow:0 0 0 4px #2fe05b,0 0 18px #2fe05b,0 4px 0 #a5744a;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #2fe05b,0 0 6px #2fe05b,0 4px 0 #a5744a}}
.lv.lock{color:rgba(255,255,255,.5);background:linear-gradient(#8f7864,#6c5848);box-shadow:0 4px 0 #473a2e,0 7px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.18);pointer-events:none}
.lv.lock svg{width:24px;height:24px}
.stars{display:flex;gap:1px;height:12px}.stars svg{width:12px;height:12px}
svg.st{fill:rgba(90,52,20,.28);stroke:none;filter:none}svg.st.on{fill:#ffb81c;filter:drop-shadow(0 1px 0 #a86a00)}

/* ================= Игровой экран ================= */
.bar{width:100%;max-width:520px;display:flex;gap:8px;align-items:center}.sp{flex:1}
.bar .b3 svg{width:28px;height:28px}
#undo b,#add b{font-size:22px}
.trow{position:relative;width:100%;max-width:520px;margin-top:14px;display:flex;justify-content:center}
.trow h2{font-size:46px}
.trow .snd{position:absolute;right:0;top:4px;min-width:44px;height:42px;padding:0}
#mp{margin:6px auto 0;padding:3px 16px;border-radius:99px;background:rgba(0,0,0,.38);font:600 15px var(--font);box-shadow:inset 0 2px 5px rgba(0,0,0,.4)}
#mp b{font-family:var(--font);font-weight:800;color:#ffe27a}#mp.warn b{color:#ff7a7a}
main{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#board{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:42px 16px;max-width:540px;padding-top:20px}

/* Стеклянная пробирка: корпус, ободок-эллипс сверху, блики и тень на столе */
.tube{position:relative;width:var(--tw);height:var(--th);cursor:pointer;
  filter:drop-shadow(0 12px 7px rgba(30,10,0,.45));transition:transform .38s cubic-bezier(.3,1.4,.5,1)}
.glass{position:absolute;inset:0;overflow:hidden;border:2px solid rgba(255,255,255,.6);border-top:0;
  border-radius:0 0 calc(var(--tw)/2) calc(var(--tw)/2);
  background:linear-gradient(90deg,rgba(255,255,255,.34),rgba(255,255,255,.07) 28%,rgba(255,255,255,.05) 66%,rgba(255,255,255,.26));
  box-shadow:inset 0 0 12px rgba(255,255,255,.35)}
.glass::after{content:"";position:absolute;left:12%;top:5%;bottom:13%;width:13%;border-radius:9px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.08));z-index:4;pointer-events:none}
.tube::before{content:"";position:absolute;left:-3px;right:-3px;top:-7px;height:15px;border-radius:50%;z-index:3;
  border:2px solid rgba(255,255,255,.85);background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.1));pointer-events:none}
.tube.sel{transform:translateY(-24px);filter:drop-shadow(0 22px 10px rgba(30,10,0,.4)) drop-shadow(0 0 10px rgba(255,235,150,.9))}
.tube.pour{z-index:8;filter:drop-shadow(0 10px 8px rgba(30,10,0,.4))}
.tube.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* Пробка-крышка появляется, когда пробирка собрана */
.tube::after{content:"";position:absolute;left:-4px;right:-4px;top:-10px;height:20px;border-radius:50%;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse at 35% 30%,rgba(255,255,255,.85),transparent 55%),var(--cc,#fff);
  box-shadow:0 3px 5px rgba(0,0,0,.45),inset 0 -3px 4px rgba(0,0,0,.25);opacity:0;transform:translateY(-18px) scale(.7)}
.tube.done::after{opacity:1;transform:none}
.tube.cheer::after{animation:lid .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes lid{from{opacity:0;transform:translateY(-30px) scale(.6)}}

/* Жидкость: высота слоя плавно меняется (transition) */
.liq{position:absolute;left:0;right:0;bottom:0;height:80%;display:flex;flex-direction:column-reverse}
.seg{position:relative;flex:none;width:100%;height:0;transition:height .55s ease-in-out;
  background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(255,255,255,0) 32%,rgba(0,0,0,.20) 92%),var(--c);
  box-shadow:inset 0 3px 3px rgba(255,255,255,.2)}
.seg::before{content:"";position:absolute;left:0;right:0;top:-4px;height:8px;border-radius:50%;z-index:2;background:rgba(255,255,255,.16)}
.seg.top::before{top:-6px;height:12px;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.7),rgba(255,255,255,.2) 70%);animation:wave 2s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleX(.75)}to{transform:scaleX(1)}}
.stream{position:absolute;width:8px;border-radius:4px;z-index:7;pointer-events:none;transform-origin:top center;
  background:linear-gradient(90deg,rgba(255,255,255,.55),var(--c) 40%,var(--c));box-shadow:0 0 6px var(--c);animation:flow .62s ease-in-out forwards}
@keyframes flow{0%{clip-path:inset(0 0 100% 0)}30%{clip-path:inset(0)}80%{clip-path:inset(0);opacity:1}100%{opacity:0}}

/* ================= Окна победы и поражения ================= */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,6,0,.72);z-index:30;padding:20px}
.ov.on{display:flex}
.card{position:relative;width:100%;max-width:340px;padding:46px 20px 22px;text-align:center;border-radius:24px;
  background:linear-gradient(#a8622f,#7a3d18);border:4px solid #e8b27a;box-shadow:0 10px 0 #4a2208,0 22px 40px rgba(0,0,0,.6),inset 0 3px 0 rgba(255,255,255,.35);animation:rise .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:scale(.7);opacity:0}}
.ribbon{position:absolute;left:50%;top:-26px;transform:translateX(-50%);padding:6px 26px;border-radius:14px;white-space:nowrap;font:800 26px var(--font);
  background:linear-gradient(#ffd85a,#f0a020);box-shadow:0 4px 0 #9c5d00,0 8px 12px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(120,60,0,.6)}
#lose .ribbon{background:linear-gradient(#ff8a8a,#e03535);box-shadow:0 4px 0 #8c1414,0 8px 12px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(100,0,0,.6)}
#wstars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
#wstars svg{width:64px;height:64px;transform:scale(0);animation:pop .55s forwards;fill:rgba(0,0,0,.3);stroke:none}
#wstars svg.on{fill:#ffc21a;filter:drop-shadow(0 3px 0 #a86a00) drop-shadow(0 0 10px #ffb300)}
@keyframes pop{60%{transform:scale(1.3)}100%{transform:scale(1)}}
.card p{margin:6px 0 16px;font-size:17px;font-weight:600;opacity:.95}
.card .row{display:flex;gap:12px;justify-content:center}.card .b3{font-size:20px;flex:1;max-width:140px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#cont,.head{flex:none}#lvls{flex:1;min-height:0;align-content:start}

/* ================= Магазин ================= */
.b3.gold{background:linear-gradient(#ffd85a,#f0a020);box-shadow:0 5px 0 #9c5d00,0 9px 12px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6);color:#5a3200;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.b3.gold:active{box-shadow:0 1px 0 #9c5d00,0 3px 6px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.b3.gold.no{filter:grayscale(.65) brightness(.8)}
svg.coin{width:22px;height:22px;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
svg.coin circle{stroke:none}svg.coin circle:first-child{fill:#ffc21a;stroke:#b87400;stroke-width:2}svg.coin circle+circle{fill:none;stroke:#e59a00;stroke-width:2}
.shoprow{display:flex;align-items:center;gap:10px;margin-top:12px;flex:none}.shoprow .chip{cursor:pointer}.shoprow .b3{height:44px;font-size:20px}.shoprow .b3 svg{width:24px;height:24px}
#gift{margin:12px 0 0;min-width:230px;flex:none;font-size:20px;height:46px}
#tabs{display:flex;gap:6px;width:100%;max-width:460px;margin-top:14px;flex:none}#tabs .b3{flex:1;min-width:0;height:40px;padding:0 4px;font-size:15px;border-radius:12px}
#items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:460px;flex:1;min-height:0;overflow-y:auto;align-content:start;padding:12px 4px 24px}
.it{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:rgba(0,0,0,.38);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.it .nm{font:800 17px var(--font);text-align:center;line-height:1}.it .sub{font:600 13px var(--font);text-align:center;opacity:.8;margin-top:-3px}
.it .b3{height:38px;font-size:17px;border-radius:11px;width:100%}.it .b3.on{pointer-events:none}
.pv{height:84px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;padding:8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),inset 0 3px 8px rgba(0,0,0,.35);overflow:hidden}
.pv i{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 2px 2px rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.4)}
.pv .tube{--tw:26px;--th:68px;filter:none;pointer-events:none}.pv .tube::before{height:10px;top:-5px}.pv .seg{height:25%}
.pv svg.i{width:46px;height:46px}
.gain{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font:800 24px var(--font);color:#ffe27a;text-shadow:0 2px 0 rgba(60,25,0,.6)}.gain svg{width:26px;height:26px}
/* фоны */
.bg-night{background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),linear-gradient(#0f1b4d,#2a1f66 60%,#4a2a7a);background-size:200px 200px,130px 130px,170px 170px,110px 110px,100% 100%}
.bg-sunset{background:radial-gradient(circle at 50% 100%,rgba(255,230,150,.55),transparent 55%),linear-gradient(#ff9a5a,#e0518a 55%,#5a3a92)}
.bg-mint{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.28),transparent 40%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.14),transparent 35%),linear-gradient(#27b58c,#127a6a)}
.bg-ocean{background:repeating-radial-gradient(circle at 50% 120%,rgba(255,255,255,.09) 0 20px,transparent 20px 44px),linear-gradient(#1aa3e8,#0a4f9c 70%,#06295e)}
.bg-space{background:radial-gradient(1.5px 1.5px at 25% 25%,#fff,transparent),radial-gradient(1px 1px at 75% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 50% 85%,#fff,transparent),radial-gradient(ellipse at 70% 30%,rgba(150,60,210,.55),transparent 55%),linear-gradient(#07021a,#1b0b3d);background-size:180px 180px,120px 120px,150px 150px,100% 100%,100% 100%}
.bg-candy{background:repeating-linear-gradient(45deg,rgba(255,255,255,.15) 0 22px,transparent 22px 44px),linear-gradient(#ff7eb6,#b44fd6)}
.chip.bad{animation:shake .3s}
/* стили пробирок */
.tb-ice .glass{border-color:#bff0ff;box-shadow:inset 0 0 14px rgba(150,230,255,.75);background:linear-gradient(90deg,rgba(180,235,255,.45),rgba(180,235,255,.1) 30%,rgba(180,235,255,.08) 66%,rgba(180,235,255,.4))}.tb-ice .tube::before{border-color:#d8f6ff}
.tb-gold .glass{border-color:#ffd24a;box-shadow:inset 0 0 12px rgba(255,200,60,.6)}.tb-gold .tube::before{border-color:#ffd24a;background:linear-gradient(rgba(255,220,100,.55),rgba(255,200,60,.15))}
.tb-neon .glass{border-color:#3dfcff;box-shadow:inset 0 0 12px rgba(61,252,255,.55),0 0 10px #3dfcff}.tb-neon .tube::before{border-color:#3dfcff;box-shadow:0 0 8px #3dfcff}

#hint{position:relative}#hint::after{content:"20";position:absolute;right:-5px;bottom:-7px;padding:0 7px;border-radius:99px;background:#ffc21a;color:#5a3200;font:800 13px/18px var(--font);box-shadow:0 2px 0 #9c5d00;text-shadow:none}
.tube.hint{animation:hint .7s ease-in-out 3;z-index:6}
@keyframes hint{50%{transform:translateY(-16px);filter:drop-shadow(0 22px 10px rgba(30,10,0,.35)) drop-shadow(0 0 14px #5dff8a)}}
.spk{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:9;background:#ffe27a;box-shadow:0 0 8px #ffd24a;animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
</style>
</head>
<body>

<!-- Экран выбора уровня -->
<section class="screen on" id="sLevels">
  <div class="head"><div class="chip" id="tstars"></div><h1>LEVEL</h1><button class="b3 snd" id="snd1" aria-label="Звук" style="min-width:48px;padding:0"></button></div>
  <div class="shoprow"><div class="chip" id="coins"></div><button class="b3" id="shopBtn"><svg class="i" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></svg>Магазин</button></div>
  <button class="b3 green" id="cont">Играть</button>
  <div id="lvls"></div>
</section>

<!-- Игровой экран -->
<section class="screen" id="sGame">
  <div class="bar">
    <button class="b3" id="menu" aria-label="Уровни"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="b3" id="restart" aria-label="Заново"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
    <button class="b3" id="hint" aria-label="Подсказка"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg></button>
    <div class="sp"></div>
    <button class="b3" id="undo" aria-label="Отмена"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12H9"/></svg><b id="uc">5</b></button>
    <button class="b3" id="add" aria-label="Пробирка"><svg class="i" viewBox="0 0 24 24"><path d="M12 3h5v14a3.5 3.5 0 01-7 0V3z" transform="translate(-2 0)"/><path d="M19 4v6M16 7h6"/></svg><b>1</b></button>
  </div>
  <div class="trow"><h2 id="title">LEVEL 1</h2><button class="b3 snd" id="snd2" aria-label="Звук"></button></div>
  <div id="mp">Ходы <b id="moves">0/0</b></div>
  <main><div id="board"></div></main>
</section>

<!-- Магазин -->
<section class="screen" id="sShop">
  <div class="head"><button class="b3" id="shopBack" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>SHOP</h1><div class="chip" id="coins2"></div></div>
  <button class="b3 gold" id="gift">Подарок</button>
  <div id="tabs"></div>
  <div id="items"></div>
</section>

<div class="ov" id="win"><div class="card"><div class="ribbon">ПОБЕДА!</div><div id="wstars"></div><p id="wtext"></p>
  <div class="row"><button class="b3" id="wlist">Уровни</button><button class="b3 green" id="wnext">Дальше</button></div></div></div>
<div class="ov" id="lose"><div class="card"><div class="ribbon">НЕ ВЫШЛО</div><p id="ltext" style="margin-top:14px"></p>
  <div class="row"><button class="b3" id="llist">Уровни</button><button class="b3 red" id="lretry">Заново</button></div><button class="b3 gold" id="lmore" style="margin:14px auto 0;min-width:210px"></button></div></div>

const SND = { pour: new Audio(AUD.pour), win: new Audio(AUD.win), fail: new Audio(AUD.fail) };

const key = T => T.map(t => t.join('')).sort().join('|');
const heur = T => T.reduce((s, t) => { let r = 0; t.forEach((x, k) => { if(!k || x !== t[k - 1]) r++; }); return s + r; }, 0);
/* Лучевой поиск решения: возвращает число ходов или -1. Найдено решение → уровень проходим по построению. */
function solve(start, W = 90){
  let layer = [start], seen = new Set([key(start)]);
  for(let d = 0; d < 110; d++){
    const next = [];
    for(const T of layer) for(let i = 0; i < T.length; i++) for(let j = 0; j < T.length; j++){
      if(!useful(T, i, j)) continue;
      const N = T.map(t => t.slice()); doPour(N, i, j);
      if(isWon(N)) return d + 1;
      const k = key(N); if(!seen.has(k)){ seen.add(k); next.push(N); }
    }
    if(!next.length) return -1;
    layer = next.sort((a, b) => heur(a) - heur(b)).slice(0, W);
  }
  return -1;
}
function makeLevel(lv){
  const n = tubeCount(lv), colors = n - 2, steps = Math.min(50 + lv * 3, 240);
  for(let at = 0; at < 40; at++){
    const r = rng(lv * 7919 + at * 104729), T = [];
    for(let c = 0; c < colors; c++) T.push(Array(CAP).fill(c));        // 1) решённое состояние
    T.push([], []);                                                     // 2) две пустые пробирки
    for(let s = 0; s < steps; s++){                                     // 3) перемешивание
      const i = Math.floor(r() * n), j = Math.floor(r() * n);
      if(i !== j && T[i].length && T[j].length < CAP) T[j].push(T[i].pop());
    }
    if(isWon(T)) continue;
    const p = solve(T);                                                 // 4) проверка: решение существует
    if(p > 0) return { T, par: p };
  }
  const T = []; for(let c = 0; c < colors; c++) T.push(Array(CAP).fill(c)); T.push([], []);
  T[0].push(T[1].pop()); T[1].push(T[0].shift()); return { T, par: 3 };
}

/* ---------- ОТРИСОВКА ---------- */
function seg(c, units){ const s = document.createElement('div'); s.className = 'seg'; s.style.setProperty('--c', COLORS[c]); s.style.height = (units / CAP * 100) + '%'; return s; }
function renderTube(i){
  const el = board.children[i], liq = el.querySelector('.liq'), t = tubes[i]; liq.innerHTML = '';
  for(let k = 0; k < t.length;){ let r = 1; while(k + r < t.length && t[k + r] === t[k]) r++; liq.append(seg(t[k], r)); k += r; }
  if(liq.lastElementChild) liq.lastElementChild.classList.add('top');
  const full = t.length === CAP && t.every(x => x === t[0]);
  el.classList.toggle('done', full); if(full) el.style.setProperty('--cc', COLORS[t[0]]);
}
function buildBoard(){
  board.innerHTML = ''; fit();
  tubes.forEach((_, i) => { const el = document.createElement('div'); el.className = 'tube'; el.innerHTML = '<div class="glass"><div class="liq"></div></div>'; el.onclick = () => onTube(i); board.append(el); renderTube(i); });
}
function hud(){
  $('#title').textContent = 'LEVEL ' + level; $('#moves').textContent = moves + ' / ' + limit;
  $('#mp').classList.toggle('warn', moves >= limit * .85);
  const ul = undoLeft + save.inv.undo; $('#uc').textContent = ul; $('#undo').disabled = !ul || !hist.length; $('#add').disabled = addUsed && !save.inv.tube; $('#add b').textContent = addUsed ? save.inv.tube : 1; $('#hint').disabled = save.coins < HINT;
}
const markSel = () => [...board.children].forEach((e, i) => e.classList.toggle('sel', i === sel));

/* ---------- УПРАВЛЕНИЕ: тап по пробирке-источнику, затем по приёмнику ---------- */
function onTube(i){
  if(busy || over) return;
  if(sel < 0){ if(!tubes[i].length){ sndBad(); return; } sel = i; sndClick(); markSel(); }
  else if(sel === i){ sel = -1; markSel(); }
  else if(canPour(tubes, sel, i)) animatePour(sel, i);
  else { const el = board.children[i]; el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); sndBad(); sel = tubes[i].length ? i : -1; markSel(); }
}
/* Анимация: источник подлетает к приёмнику, наклоняется, течёт струя, слои плавно растут и убывают */
function animatePour(from, to){
  busy = true; hist.push(JSON.stringify({ t: tubes, m: moves, a: addUsed }));
  const a = tubes[from], b = tubes[to], c = topOf(a), runA = topRun(a), runB = (b.length && topOf(b) === c) ? topRun(b) : 0, k = Math.min(runA, CAP - b.length);
  const ea = board.children[from], eb = board.children[to];
  sel = -1; ea.classList.remove('sel');
  const w = ea.offsetWidth, dir = eb.offsetLeft >= ea.offsetLeft ? 1 : -1, ang = 62, rad = ang * Math.PI / 180;
  const cx = eb.offsetLeft + eb.offsetWidth / 2;                                        // центр приёмника
  const px = cx - dir * (w / 2) * Math.cos(rad), py = eb.offsetTop - 24 - (w / 2) * Math.sin(rad);   // точка вращения (горлышко) источника
  ea.style.transformOrigin = '50% 0';
  ea.style.transform = `translate(${px - (ea.offsetLeft + w / 2)}px,${py - ea.offsetTop}px) rotate(${dir * ang}deg)`;
  ea.classList.add('pour');                                                             // 1) подлёт и наклон
  setTimeout(() => {                                                                    // 2) перелив
    const unit = ea.querySelector('.liq').offsetHeight / CAP, lipY = py + (w / 2) * Math.sin(rad);
    const fillY = eb.offsetTop + eb.offsetHeight - (b.length + k) * unit;
    const st = document.createElement('div'); st.className = 'stream';
    st.style.cssText = `--c:${COLORS[c]};left:${cx - 4}px;top:${lipY}px;height:${Math.max(8, fillY - lipY)}px`; board.append(st);
    const la = ea.querySelector('.liq'); la.lastElementChild.classList.remove('top'); la.lastElementChild.style.height = ((runA - k) / CAP * 100) + '%';
    const lb = eb.querySelector('.liq');
    if(runB){ lb.lastElementChild.style.height = ((runB + k) / CAP * 100) + '%'; }
    else { const s = seg(c, 0); lb.append(s); void s.offsetHeight; s.style.height = (k / CAP * 100) + '%'; }
    play('pour', 800);
    setTimeout(() => {                                                                  // 3) фиксация хода
      doPour(tubes, from, to); moves++; st.remove();
      ea.classList.remove('pour'); ea.style.transform = ''; ea.style.transformOrigin = '';
      renderTube(from); renderTube(to);
      if(eb.classList.contains('done')){ eb.classList.add('cheer'); tone(880, .25, 'sine', .1, 1320); burst(eb); vib(30); }
      hud(); busy = false;
      if(isWon(tubes)) win(); else if(moves >= limit) lose('Лимит ходов исчерпан', true); else if(!hasMove(tubes)) lose('Больше нет ходов');
    }, 650);
  }, 400);
}

/* ---------- УРОВНИ, ПОБЕДА, ПОРАЖЕНИЕ ---------- */
const STAR = on => `<svg class="st${on ? ' on' : ''}" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>`;
const LOCK = '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>';
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
function drawLevels(){
  const w = $('#lvls'); w.innerHTML = ''; let total = 0;
  for(let lv = 1; lv <= TOTAL; lv++){
    const st = save.stars[lv] || 0, lock = lv > save.unlocked; total += st;
    const b = document.createElement('button');
    b.className = 'lv' + (lock ? ' lock' : '') + (lv === save.unlocked ? ' cur' : '');
    b.innerHTML = lock ? LOCK : lv + '<div class="stars">' + STAR(st > 0) + STAR(st > 1) + STAR(st > 2) + '</div>';
    b.onclick = () => startLevel(lv); w.append(b);
  }
  $('#cont').textContent = 'Играть ' + save.unlocked; $('#coins').innerHTML = COIN + save.coins; $('#tstars').innerHTML = STAR(true) + total;
}
function resetRound(){ moves = 0; hist = []; addUsed = false; undoLeft = UNDOS; }
function loadState(T){ tubes = T.map(t => t.slice()); sel = -1; busy = false; over = false; buildBoard(); hud(); }
function startLevel(lv){
  sndStart(); level = lv; resetRound();
  const g = makeLevel(lv); initial = g.T; par = g.par; limit = Math.ceil(par * (lv <= 5 ? 1.4 : lv <= 15 ? 1.3 : 1.2)) + 2;   // лимит ходов: чем дальше уровень, тем строже
  $('#win').classList.remove('on'); $('#lose').classList.remove('on'); show('sGame'); loadState(initial);
}
function confetti(){
  const c = $('#fx'), g = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: Math.random() * 2 - 1, vy: 2.5 + Math.random() * 4, r: 3 + Math.random() * 5, a: Math.random() * 6, va: Math.random() * .3 - .15, c: COLORS[Math.floor(Math.random() * COLORS.length)] }));
  let f = 0; (function an(){ g.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += p.va; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); }); if(++f < 210) requestAnimationFrame(an); else g.clearRect(0, 0, c.width, c.height); })();
}
function win(){
  over = true; play('win'); vib([40, 60, 40]);
  const stars = moves <= par * 1.15 + 1 ? 3 : moves <= par * 1.5 + 3 ? 2 : 1;
  const gain = 10 + stars * 5 + (save.stars[level] ? 0 : 20); save.coins += gain;
  save.stars[level] = Math.max(save.stars[level] || 0, stars); save.unlocked = Math.max(save.unlocked, Math.min(TOTAL, level + 1)); persist();
  $('#wstars').innerHTML = [0, 1, 2].map(k => STAR(k < stars).replace('<svg', `<svg style="animation-delay:${.35 + k * .25}s"`)).join('');
  $('#wtext').innerHTML = 'Ходов: ' + moves + ' · лучший результат ≈ ' + par + '<br><span class="gain">+' + gain + ' ' + COIN + '</span>';
  $('#wnext').style.display = level >= TOTAL ? 'none' : '';
  setTimeout(() => { $('#win').classList.add('on'); confetti(); }, 450);
}
function lose(msg, more){ over = true; play('fail'); $('#ltext').textContent = msg; const m = $('#lmore'); m.style.display = more ? '' : 'none'; m.innerHTML = '+5 ходов · ' + COIN + MORE; m.classList.toggle('no', save.coins < MORE); setTimeout(() => $('#lose').classList.add('on'), 400); }

/* ---------- КНОПКИ ---------- */
const retry = () => { if(busy) return; $('#lose').classList.remove('on'); resetRound(); loadState(initial); };
$('#restart').onclick = retry; $('#lretry').onclick = retry;
$('#undo').onclick = () => {
  if(busy || over || !hist.length || !(undoLeft + save.inv.undo)) return;
  const h = JSON.parse(hist.pop()); tubes = h.t; moves = h.m; addUsed = h.a; if(undoLeft) undoLeft--; else { save.inv.undo--; persist(); } sel = -1; buildBoard(); hud();
};
$('#add').onclick = () => {                       // дополнительная пустая пробирка (1 раз за уровень)
  if(busy || over || (addUsed && !save.inv.tube)) return; if(addUsed){ save.inv.tube--; persist(); }
  hist.push(JSON.stringify({ t: tubes, m: moves, a: addUsed })); addUsed = true; tubes.push([]); sel = -1; buildBoard(); hud();
};
const toLevels = () => { $('#win').classList.remove('on'); $('#lose').classList.remove('on'); drawLevels(); show('sLevels'); };
$('#menu').onclick = $('#wlist').onclick = $('#llist').onclick = toLevels;
$('#wnext').onclick = () => startLevel(level + 1);
$('#cont').onclick = () => startLevel(save.unlocked);

/* ---------- МАГАЗИН ---------- */
const COIN = '<svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6.5"/></svg>';
const PAL = { classic: COLORS.slice(),
  pastel: ['#ffa3b8','#8ee0ff','#a8eb92','#ffe58a','#ffc08a','#c9a8ff','#8fb4ff','#7fe0cc'],
  neon: ['#ff2e63','#08f7fe','#39ff14','#fffc00','#ff7b00','#bd00ff','#2d6bff','#00ffa3'],
  cb: ['#e69f00','#56b4e9','#009e73','#f0e442','#0072b2','#d55e00','#cc79a7','#9a9a9a'] };
const CAT = {
  bg: [['wood','Дерево',0],['night','Ночь',120],['sunset','Закат',150],['mint','Мята',150],['ocean','Океан',200],['space','Космос',250],['candy','Конфета',300]],
  pal: [['classic','Классика',0],['pastel','Пастель',150],['neon','Неон',250],['cb','Контраст',200]],
  tb: [['glass','Стекло',0],['ice','Лёд',150],['gold','Золото',250],['neon','Неон',300]],
  boost: [['undo','Отмена ×5',5,40],['tube','Пробирка ×3',3,60]] };
const TABS = [['bg','Фоны'],['pal','Цвета'],['tb','Пробирки'],['boost','Бонусы']], GIFT = 50;
const BICON = { undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12H9"/>', tube: '<path d="M12 3h5v14a3.5 3.5 0 01-7 0V3z" transform="translate(-2 0)"/><path d="M19 4v6M16 7h6"/>' };
let tab = 'bg';
const today = () => new Date().toDateString();
function applyLook(){
  document.body.className = 'bg-' + save.eq.bg + ' tb-' + save.eq.tb;
  COLORS.splice(0, COLORS.length, ...(PAL[save.eq.pal] || PAL.classic));
}
function preview(k, id){
  if(k === 'bg') return '<div class="pv bg-' + id + '"></div>';
  if(k === 'pal') return '<div class="pv" style="background:rgba(0,0,0,.25)">' + PAL[id].map(c => '<i style="background:' + c + '"></i>').join('') + '</div>';
  if(k === 'tb') return '<div class="pv tb-' + id + '" style="background:rgba(0,0,0,.25)"><div class="tube"><div class="glass"><div class="liq" style="height:100%"><div class="seg" style="--c:' + PAL[save.eq.pal][1] + '"></div><div class="seg" style="--c:' + PAL[save.eq.pal][0] + '"></div></div></div></div></div>';
  return '<div class="pv" style="background:rgba(0,0,0,.25)"><svg class="i" viewBox="0 0 24 24">' + BICON[id] + '</svg></div>';
}
function drawShop(){
  $('#coins2').innerHTML = COIN + save.coins;
  const t = $('#tabs'); t.innerHTML = '';
  TABS.forEach(([k, n]) => { const b = document.createElement('button'); b.className = 'b3' + (k === tab ? ' green' : ''); b.textContent = n; b.onclick = () => { tab = k; drawShop(); }; t.append(b); });
  const w = $('#items'); w.innerHTML = ''; w.scrollTop = 0;
  CAT[tab].forEach(it => {
    const boost = tab === 'boost', id = it[0], price = boost ? it[3] : it[2];
    const own = !boost && save.own[tab].includes(id), eqd = !boost && save.eq[tab] === id;
    const d = document.createElement('div'); d.className = 'it';
    d.innerHTML = preview(tab, id) + '<div class="nm">' + it[1] + '</div>' + (boost ? '<div class="sub">Есть: ' + save.inv[id] + '</div>' : '');
    const b = document.createElement('button');
    b.className = 'b3 ' + (eqd ? 'green on' : own ? '' : 'gold' + (save.coins < price ? ' no' : ''));
    b.innerHTML = eqd ? 'Выбрано' : own ? 'Выбрать' : COIN + price;
    b.onclick = () => {
      if(own){ save.eq[tab] = id; sndClick(); }
      else if(save.coins >= price){
        save.coins -= price; sndBuy();
        if(boost) save.inv[id] += it[2]; else { save.own[tab].push(id); save.eq[tab] = id; }
      } else { sndBad(); const c = $('#coins2'); c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad'); return; }
      persist(); applyLook(); drawShop();
    };
    d.append(b); w.append(d);
  });
  const g = $('#gift'), done = save.daily === today();
  g.disabled = done; g.innerHTML = done ? 'Подарок завтра' : 'Подарок дня +' + GIFT + ' ' + COIN;
}
$('#gift').onclick = () => { if(save.daily === today()) return; save.daily = today(); save.coins += GIFT; persist(); sndBuy(); drawShop(); };
const openShop = () => { drawShop(); show('sShop'); };
$('#shopBtn').onclick = openShop; $('#coins').onclick = openShop;
$('#shopBack').onclick = () => { drawLevels(); show('sLevels'); };

/* ---------- ПОДСКАЗКА, ЕЩЁ ХОДЫ, ЭФФЕКТЫ, РАЗМЕР ПОЛЯ ---------- */
const HINT = 20, MORE = 50;
const vib = ms => { try { if(!muted && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
document.addEventListener('click', e => { const b = e.target.closest('button'); if(b && !b.matches('#cont,.lv,#gift,#hint,#lmore,#wnext,.it .b3')) sndClick(); }, true);
function fit(){   // пробирки подгоняются по высоте так, чтобы все ряды помещались на экране
  const m = $('main'), tw = Math.min(58, Math.max(40, innerWidth * .104));
  const per = Math.max(1, Math.floor((Math.min(540, m.clientWidth) + 16) / (tw + 16))), rows = Math.ceil(tubes.length / per);
  board.style.setProperty('--th', Math.max(110, Math.min(236, (m.clientHeight - 56 - (rows - 1) * 42) / rows)) + 'px');
}
addEventListener('resize', () => { if($('#sGame').classList.contains('on')) fit(); });
function burst(el){
  const x = el.offsetLeft + el.offsetWidth / 2, y = el.offsetTop;
  for(let k = 0; k < 12; k++){
    const s = document.createElement('i'), a = k / 12 * 6.283, r = 38 + Math.random() * 26;
    s.className = 'spk'; s.style.cssText = `left:${x - 4}px;top:${y - 4}px;--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r - 10}px`;
    board.append(s); setTimeout(() => s.remove(), 750);
  }
}
$('#hint').onclick = () => {   // подсказка: ищем ход, после которого решение короче всего
  if(busy || over) return;
  if(save.coins < HINT){ sndBad(); return; }
  let best = null, bd = 1e9;
  for(let i = 0; i < tubes.length && bd > 1; i++) for(let j = 0; j < tubes.length; j++){
    if(!useful(tubes, i, j)) continue;
    const N = tubes.map(t => t.slice()); doPour(N, i, j);
    const d = isWon(N) ? 0 : solve(N, 30);
    if(d >= 0 && d < bd){ bd = d; best = [i, j]; if(!d) break; }
  }
  if(!best){ sndBad(); return; }
  save.coins -= HINT; persist(); sel = -1; markSel(); sndBuy(); hud();
  best.forEach(i => { const el = board.children[i]; el.classList.add('hint'); setTimeout(() => el.classList.remove('hint'), 2200); });
};
$('#lmore').onclick = () => {
  if(save.coins < MORE){ sndBad(); return; }
  save.coins -= MORE; persist(); limit += 5; over = false; sndBuy(); $('#lose').classList.remove('on'); hud();
};
applyLook();

setSnd(); drawLevels();
})();
</script>
