<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style id="splash-css">
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(70% 55% at 50% 42%,#2a0f63 0%,#170a3c 52%,#0a0620 100%);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  opacity:1;visibility:visible;transition:opacity .7s ease,visibility 0s linear .7s}
#splash::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(168,85,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,255,.10) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(60% 50% at 50% 45%,#000,transparent);mask-image:radial-gradient(60% 50% at 50% 45%,#000,transparent)}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.sp-duck{position:relative;width:min(44vw,190px);aspect-ratio:1;border-radius:26%;animation:sp-pulse 1.8s ease-in-out infinite}
.sp-duck img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:26%;display:block;background:#000;
  border:2px solid #a855ff}
.sp-duck::before,.sp-duck::after{content:"";position:absolute;inset:-10px;border-radius:30%;border:2px solid rgba(168,85,255,.55);
  animation:sp-ring 1.8s ease-out infinite}
.sp-duck::after{animation-delay:.9s;border-color:rgba(39,200,255,.5)}
.sp-text{position:relative;z-index:1;font-size:clamp(17px,4.6vw,22px);font-weight:600;color:#cfc8ff;letter-spacing:.02em;text-align:center}
.sp-text b{font-weight:800;background:linear-gradient(90deg,#a855ff,#27c8ff);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
.sp-dots span{display:inline-block;animation:sp-dot 1.2s ease-in-out infinite}
.sp-dots span:nth-child(2){animation-delay:.2s}.sp-dots span:nth-child(3){animation-delay:.4s}
.sp-bar{position:relative;z-index:1;width:min(52vw,220px);height:3px;border-radius:3px;background:rgba(168,85,255,.2);overflow:hidden}
.sp-bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:3px;
  background:linear-gradient(90deg,#a855ff,#27c8ff);box-shadow:0 0 12px #a855ff;animation:sp-run 1.3s ease-in-out infinite}
@keyframes sp-pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 16px rgba(168,85,255,.55))}
  50%{transform:scale(1.07);filter:drop-shadow(0 0 34px rgba(39,200,255,.75))}}
@keyframes sp-ring{0%{transform:scale(.96);opacity:.8}100%{transform:scale(1.35);opacity:0}}
@keyframes sp-dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes sp-run{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.sp-duck,.sp-duck::before,.sp-duck::after,.sp-dots span,.sp-bar::after{animation:none}}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07071a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nexus — игровой лаунчер</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#07071a; --bg2:#0d0d28; --panel:#11112f; --line:rgba(140,120,255,.18);
  --text:#e9e9ff; --muted:#8a8ab5;
  --violet:#a855ff; --blue:#27c8ff; --green:#2dffa8; --danger:#ff4d7d;
  --glow:0 0 18px rgba(168,85,255,.55);
  --side:270px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter','Roboto',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(168,85,255,.16),transparent 60%),
                   radial-gradient(700px 500px at -10% 110%,rgba(39,200,255,.12),transparent 60%);
  background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2a2a5a;border-radius:8px}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:rgba(10,10,32,.92);backdrop-filter:blur(14px);
  border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;z-index:50;
  transition:transform .3s ease;overflow-y:auto}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 18px}
.logo{font-weight:800;font-size:26px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.logo i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:18px;
  background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:var(--glow)}
.logo b{background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.side-close{display:none;font-size:22px;color:var(--muted)}
.side-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--muted);font-weight:600;
  font-size:15px;text-align:left;width:100%;transition:.2s;border:1px solid transparent}
.nav .ic{width:22px;text-align:center;font-size:18px}
.nav .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.07);padding:2px 9px;border-radius:99px}
.nav:hover{color:var(--text);background:rgba(168,85,255,.08)}
.nav.active{color:#fff;background:linear-gradient(90deg,rgba(168,85,255,.35),rgba(39,200,255,.15));
  border-color:rgba(168,85,255,.5);box-shadow:var(--glow)}
.side-spacer{flex:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s;z-index:40}

/* ---------- Layout ---------- */
.main{margin-left:var(--side);min-height:100%;padding-bottom:110px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 28px;
  background:rgba(7,7,26,.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.burger{display:none;width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:20px}
.top-logo{display:none;font-weight:800;font-size:20px}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:46px;padding:0 18px 0 46px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;outline:0;transition:.2s}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(39,200,255,.18)}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.6}
.profile{margin-left:auto;display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);transition:.2s}
.profile:hover{border-color:var(--violet);box-shadow:var(--glow)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,var(--violet),var(--blue))}
.profile b{font-size:14px}

.content{padding:26px 28px;max-width:1500px;margin:auto}

/* ---------- Hero ---------- */
.hero{position:relative;height:340px;border-radius:26px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(135deg,#1b0e4a,#0a2a4f);display:flex;align-items:flex-end;cursor:pointer;
  box-shadow:0 0 40px rgba(168,85,255,.2)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s}
.hero:hover .bg{transform:scale(1.04)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,7,26,.95) 5%,rgba(7,7,26,.25) 60%,transparent)}
.hero-info{position:relative;z-index:2;padding:32px;max-width:640px}
.badge{display:inline-block;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--green);border:1px solid var(--green);background:rgba(45,255,168,.1);
  box-shadow:0 0 14px rgba(45,255,168,.3)}
.hero h1{font-size:clamp(28px,5vw,50px);font-weight:800;margin:12px 0 6px;line-height:1.05}
.hero p{color:#c4c4ee;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:14px;font-weight:700;
  background:linear-gradient(90deg,var(--violet),var(--blue));color:#fff;box-shadow:var(--glow);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(39,200,255,.6)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);box-shadow:none;color:var(--muted)}

/* ---------- Grid ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 16px}
.sec-head h2{font-size:22px;font-weight:700}
.sec-head span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;animation:pop .4s both}
.card:hover{transform:scale(1.06) translateY(-4px);border-color:var(--violet);
  box-shadow:0 12px 36px rgba(0,0,0,.5),0 0 24px rgba(168,85,255,.45);z-index:2}
.cover{aspect-ratio:1/1;background-size:cover;background-position:center;display:grid;place-items:center;
  font-size:64px;font-weight:800;color:rgba(255,255,255,.85)}
.meta{padding:12px 14px 14px}
.meta h3{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:inline-block;margin-top:5px;font-size:12px;color:var(--blue)}
.del{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;background:rgba(7,7,26,.75);
  backdrop-filter:blur(6px);opacity:0;transition:.2s;font-size:14px}
.card:hover .del{opacity:1}.del:hover{background:var(--danger)}
@media(hover:none){.del{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:22px}
.empty div{font-size:48px;margin-bottom:10px}

/* ---------- FAB ---------- */
.fab{position:fixed;right:26px;bottom:26px;width:62px;height:62px;border-radius:20px;font-size:34px;line-height:1;
  background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;z-index:35;
  box-shadow:0 0 26px rgba(168,85,255,.7);transition:.25s;animation:pulse 2.6s infinite}
.fab:hover{transform:rotate(90deg) scale(1.08)}
@keyframes pulse{50%{box-shadow:0 0 42px rgba(39,200,255,.8)}}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(3,3,15,.8);backdrop-filter:blur(8px);display:none;
  align-items:center;justify-content:center;padding:16px;z-index:100}
.modal.open{display:flex}
.box{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--violet);
  border-radius:24px;padding:26px;box-shadow:0 0 50px rgba(168,85,255,.35);animation:pop .3s}
.box h2{font-size:22px;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input[type=text],.field select{width:100%;height:46px;padding:0 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;outline:0}
.field select option{background:var(--panel)}
.field input:focus,.field select:focus{border-color:var(--blue)}
.file{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);border:1px dashed var(--line);
  border-radius:12px;cursor:pointer;color:var(--muted);font-size:14px;transition:.2s}
.file:hover{border-color:var(--green);color:var(--text)}
.file.ok{border-color:var(--green);color:var(--green);border-style:solid}
.file input{display:none}.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:10px;margin-top:22px}.actions .btn{flex:1;justify-content:center}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px}

/* ---------- Player (fullscreen) ---------- */
.player{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#000;z-index:200;display:none}
.player.open{display:block}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.exit{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:6px;padding:7px 14px 7px 10px;border-radius:99px;font-size:13px;font-weight:600;color:#fff;
  background:rgba(17,17,47,.45);border:1px solid rgba(168,85,255,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:.38;transition:opacity .2s,box-shadow .2s}
.exit .i{width:16px;height:16px}
.exit:hover,.exit:focus-visible,.exit:active{opacity:1;box-shadow:var(--glow)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);opacity:0;padding:12px 22px;border-radius:14px;
  background:var(--bg2);border:1px solid var(--green);color:var(--green);z-index:300;transition:.3s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  body.menu .sidebar{transform:none}
  body.menu .scrim{opacity:1;pointer-events:auto}
  .side-close,.burger,.top-logo{display:block}
  .main{margin-left:0}
  .topbar{padding:12px 14px;gap:10px}
  .profile b{display:none}.profile{padding:5px}
  .content{padding:18px 14px}
  .hero{height:260px;border-radius:20px}.hero-info{padding:20px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .cover{font-size:48px}
  .fab{right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media(max-width:480px){.top-logo{display:none}}

/* ---------- SVG icons ---------- */
.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 3px currentColor)}
.nav.active .i{color:var(--blue)}
.search span{display:flex}.search .i{display:block}
.burger .i,.side-close .i{display:block;margin:auto;width:22px;height:22px}
.fab{display:grid;place-items:center}.fab .i{width:30px;height:30px;stroke-width:2.4;filter:none}
.del{display:grid;place-items:center}.del .i{width:16px;height:16px}
.sec-head h2::before{content:"//";margin-right:8px;color:var(--green);font-family:ui-monospace,Consolas,monospace;opacity:.85}

/* ---------- Duck hacker ---------- */
.logo i{width:42px;height:42px;padding:2px;background:#12082e;border:1px solid var(--violet);box-shadow:var(--glow)}
.logo i svg{width:100%;height:100%;display:block}
.flick{animation:flick 3.2s infinite}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}50%{opacity:.3}54%{opacity:1}}
.duck-hero{position:absolute;right:3%;bottom:-4%;height:108%;aspect-ratio:1;z-index:1;opacity:.5;pointer-events:none;
  filter:drop-shadow(0 0 22px rgba(168,85,255,.7))}
.hero.welcome .duck-hero{opacity:1}
.hero.welcome{background:linear-gradient(rgba(168,85,255,.1) 1px,transparent 1px) 0 0/34px 34px,
  linear-gradient(90deg,rgba(168,85,255,.1) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(135deg,#1b0e4a,#0a2a4f)}
.bg-duck{position:fixed;right:-60px;bottom:-40px;width:min(520px,80vw);opacity:.07;pointer-events:none;z-index:0}
.bg-duck svg{width:100%;height:auto;display:block}
.main{position:relative;z-index:1}
.empty .duck-sm{display:block;width:104px;height:104px;margin:0 auto 12px;filter:drop-shadow(0 0 14px rgba(168,85,255,.6))}
@media(max-width:900px){.duck-hero{opacity:.32;right:-6%}.hero.welcome .duck-hero{opacity:.8}}
@media(prefers-reduced-motion:reduce){.flick{animation:none}}

/* ---------- Custom category ---------- */
.custom-cat{display:none;margin-top:8px}
.custom-cat.show{display:block;animation:pop .3s}
.nav .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- v2: CRUD, избранное, доп. функции ---------- */
:root{--gold:#ffc928}
.logo i{width:46px;height:46px;padding:0;overflow:hidden;border-radius:12px;position:relative}
.logo i img{width:100%;height:100%;object-fit:cover;display:block}
.side-label.row{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 4px 12px}
.icon-btn{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:.2s;border:1px solid transparent}
.icon-btn:hover{color:#fff;background:rgba(168,85,255,.18);border-color:var(--violet)}
.icon-btn .i{width:18px;height:18px}
.icon-btn.danger:hover{background:var(--danger);border-color:var(--danger)}
.nav.fav-nav .i{color:var(--gold)}
.nav.fav-nav.active{border-color:rgba(255,201,40,.6);box-shadow:0 0 18px rgba(255,201,40,.35);background:linear-gradient(90deg,rgba(255,201,40,.25),rgba(168,85,255,.15))}
.topbtn{width:46px;height:46px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);transition:.2s;flex:none}
.topbtn:hover{border-color:var(--blue);box-shadow:0 0 16px rgba(39,200,255,.45)}
.topbtn .i{width:22px;height:22px}
.sec-tools{display:flex;align-items:center;gap:12px}
.sort{height:36px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;outline:0;font-size:13px;color:var(--muted)}
.sort:focus{border-color:var(--blue)}.sort option{background:var(--panel)}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cbtn{position:absolute;top:8px;width:34px;height:34px;border-radius:10px;background:rgba(7,7,26,.75);
  backdrop-filter:blur(6px);display:grid;place-items:center;transition:.2s;color:#d8d8ff;z-index:3;border:1px solid transparent}
.cbtn .i{width:17px;height:17px}
.cbtn.fav{left:8px}
.cbtn.fav:hover{color:var(--gold);border-color:rgba(255,201,40,.5)}
.cbtn.fav.on{color:var(--gold);border-color:rgba(255,201,40,.65);box-shadow:0 0 16px rgba(255,201,40,.75);animation:starpop .35s}
.cbtn.fav.on .i{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.cbtn.more{right:8px;opacity:0}
.card:hover .cbtn.more,.cbtn.more:focus-visible{opacity:1}
.cbtn.more:hover{background:var(--violet)}
@media(hover:none){.cbtn.more{opacity:1}}
@keyframes starpop{50%{transform:scale(1.35) rotate(18deg)}}
.plays{display:inline-flex;align-items:center;gap:4px;float:right;margin-top:5px;font-size:12px;color:var(--muted)}
.plays .i{width:10px;height:10px;fill:currentColor;stroke:none;filter:none}
.ctx{position:fixed;z-index:150;min-width:190px;padding:6px;background:var(--bg2);border:1px solid var(--violet);border-radius:14px;
  box-shadow:0 10px 40px rgba(0,0,0,.6),var(--glow);display:none}
.ctx.open{display:block;animation:pop .15s}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;font-weight:600;font-size:14px;text-align:left}
.ctx button:hover{background:rgba(168,85,255,.18)}
.ctx button.danger{color:var(--danger)}.ctx button.danger:hover{background:rgba(255,77,125,.16)}
.catlist{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:44vh;overflow-y:auto}
.catrow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--blue)}
.catrow .nm{flex:1;min-width:0;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow small{color:var(--muted);font-size:12px;margin-right:2px}
.catrow input{flex:1;min-width:0;height:34px;padding:0 10px;background:var(--bg);border:1px solid var(--blue);border-radius:8px;outline:0}
.addcat{display:flex;gap:8px}
.addcat input{flex:1;min-width:0;height:46px;padding:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;outline:0}
.addcat input:focus{border-color:var(--blue)}
.addcat .btn{padding:0 18px}
@media(max-width:900px){.sec-head{flex-wrap:wrap;gap:8px}}

.bg-duck{opacity:.3;mix-blend-mode:screen}
.bg-duck img{width:100%;height:auto;display:block;-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent 100%);mask-image:radial-gradient(closest-side,#000 55%,transparent 100%)}
.empty .duck-sm{object-fit:cover;border-radius:26px}
.avatar.big{width:72px;height:72px;font-size:30px;flex:none}
.prof-top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.prof-top p{color:var(--muted);font-size:14px;line-height:1.6}
.prof-top b{color:var(--green)}

/* ---------- Группировка: категории и буквы ---------- */
.group{margin-top:30px;scroll-margin-top:92px}
.group:first-child{margin-top:4px}
.group-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.group-head h3{font-size:20px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.group-head small{color:var(--muted);font-size:13px;flex:none}
.gh-ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--blue);
  background:rgba(39,200,255,.08);border:1px solid rgba(39,200,255,.35)}
.gh-ic .i{width:20px;height:20px}
.gh-letter{min-width:46px;height:46px;flex:none;padding:0 8px;border-radius:14px;display:grid;place-items:center;
  font-size:24px;font-weight:800;color:#fff;border:1px solid rgba(168,85,255,.6);box-shadow:var(--glow);
  background:linear-gradient(135deg,rgba(168,85,255,.45),rgba(39,200,255,.22))}
.group.cat .meta small{display:none}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.letters[hidden]{display:none}
.letters button{min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13px;transition:.2s}
.letters button:hover,.letters button:focus-visible{color:#fff;border-color:var(--violet);box-shadow:var(--glow);outline:0}
.brand-grad{background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(168,85,255,.45))}
</style>
</head>

})();

    <div class="letters" id="letters" hidden></div>
    <div id="grid"></div>
  </main>
</div>

<button class="fab" id="fab" title="Добавить игру"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>

<!-- Add game modal -->
<div class="modal" id="addModal">
  <div class="box">
    <h2 id="formTitle">Добавить игру</h2>
    <div class="field"><label>Название</label><input type="text" id="fTitle" maxlength="60" placeholder="Например, Fatal Car Ride"></div>
    <div class="field"><label>Категория</label><select id="fCat"></select>
      <input type="text" id="fCustom" class="custom-cat" maxlength="30" autocomplete="off" placeholder="Название своей категории"></div>
    <div class="field"><label>Файл игры (HTML)</label>
      <label class="file" id="gameLbl"><input type="file" id="fGame" accept=".html,.htm,text/html"><svg class="i" aria-hidden="true"><use href="#i-file"/></svg> <span>Выбрать .html файл</span></label></div>
    <div class="field"><label>Обложка (картинка)</label>
      <label class="file" id="coverLbl"><input type="file" id="fCover" accept="image/*"><svg class="i" aria-hidden="true"><use href="#i-image"/></svg> <span>Выбрать изображение</span></label></div>
    <div class="err" id="err"></div>
    <div class="actions"><button class="btn ghost" id="cancel">Отмена</button><button class="btn" id="save">Сохранить</button></div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal" id="setModal">
  <div class="box">
    <h2>Настройки</h2>
    <p style="color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:16px">
      Игр в библиотеке: <b id="setCount" style="color:var(--green)">0</b><br>Игрок: <b id="setName">Kartel</b></p>
    <div class="actions" style="flex-direction:column">
      <button class="btn ghost" id="clearAll" style="color:var(--danger)"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg> Удалить все игры</button>
      <button class="btn" id="setClose">Закрыть</button>
    </div>
  </div>
</div>

<!-- Profile modal -->
<div class="modal" id="profModal">
  <div class="box">
    <h2>Профиль</h2>
    <div class="prof-top"><div class="avatar big" id="avatarBig">K</div>
      <p id="profStats"></p></div>
    <div class="field"><label>Имя игрока</label><input type="text" id="pName" maxlength="20" autocomplete="off" placeholder="Ваше имя"></div>
    <div class="err" id="pErr"></div>
    <div class="actions"><button class="btn ghost" id="pCancel">Отмена</button><button class="btn" id="pSave">Сохранить</button></div>
  </div>
</div>

<!-- Category manager -->
<div class="modal" id="catModal">
  <div class="box">
    <h2>Управление категориями</h2>
    <div class="catlist" id="catList"></div>
    <div class="field"><label>Новая категория</label>
      <div class="addcat"><input type="text" id="newCat" maxlength="30" autocomplete="off" placeholder="Название"><button class="btn" id="addCatBtn" title="Добавить"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button></div></div>
    <div class="actions"><button class="btn" id="catClose">Готово</button></div>
  </div>
</div>

<!-- Card context menu -->
<div class="ctx" id="ctx" role="menu">
  <button data-act="edit" role="menuitem"><svg class="i" aria-hidden="true"><use href="#i-edit"/></svg> Редактировать</button>
  <button data-act="del" class="danger" role="menuitem"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg> Удалить</button>
</div>

<!-- Player: 100% экрана + полупрозрачная кнопка выхода -->
<div class="player" id="player">
  <iframe id="frame" allow="fullscreen; gamepad; autoplay; accelerometer; gyroscope"
    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups allow-modals"></iframe>
  <button class="exit" id="exit" aria-label="Выход"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg><span>Выход</span></button>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const CUSTOM = '__custom__', FAV = '__fav__', FALLBACK = 'Без категории';
  const BASE = [
    {name:'Аркады', ic:'joystick'},
    {name:'Головоломки', ic:'puzzle'},
    {name:'Гонки', ic:'car'},
    {name:'Экшн', ic:'target'},
    {name:'Утилиты', ic:'tool'},
  ];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ico = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
    const DUCK_SM = '<img class="duck-sm" src="mascot.jpg" alt="">';
  const norm = s => s.trim().replace(/\s+/g, ' ');
  const reserved = n => /^(all|все игры|избранное)$/i.test(n);

  /* ---------- Список категорий (localStorage) ---------- */
  const LS = 'nexus-cats-v2';
  let userCats = [];
  const loadCats = () => {
    try { const v = JSON.parse(localStorage.getItem(LS)); if (Array.isArray(v)) return v.filter(c => c && c.name); } catch {}
    return BASE.map(c => ({...c}));
  };
  const saveCats = () => { try { localStorage.setItem(LS, JSON.stringify(userCats)); } catch {} };
  // категории игр, которых нет в списке (старые данные), добавляются автоматически
  const syncCats = () => {
    let ch = false;
    games.forEach(g => {
      if (g.category && !userCats.some(c => c.name === g.category)) { userCats.push({name:g.category, ic:'tag'}); ch = true; }
    });
    if (ch) saveCats();
  };
  const cats = () => {
    const list = [];
    if (games.some(g => g.fav)) list.push({id:FAV, name:'Избранное', ic:'star'});
    list.push({id:'all', name:'Все игры', ic:'gamepad'});
    return list.concat(userCats.map(c => ({id:c.name, name:c.name, ic:c.ic || 'tag'})));
  };

  /* ---------- IndexedDB ---------- */
  let db;
  const openDB = () => new Promise((res, rej) => {
    const r = indexedDB.open('nexus-launcher', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('games', {keyPath:'id'});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('games', mode), s = t.objectStore('games'), q = fn(s);
    t.oncomplete = () => res(q && q.result);
    t.onerror = () => rej(t.error);
  });
  const dbAll = () => tx('readonly', s => s.getAll());
  const dbPut = g => tx('readwrite', s => s.put(g));
  const dbDel = id => tx('readwrite', s => s.delete(id));
  const dbClear = () => tx('readwrite', s => s.clear());

  /* ---------- State ---------- */
  let games = [], cat = 'all', query = '', sortBy = 'cat';
  userCats = loadCats();

  const hue = str => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const coverStyle = g => g.cover
    ? `background-image:url('${g.cover}')`
    : `background:linear-gradient(135deg,hsl(${hue(g.title)},80%,35%),hsl(${(hue(g.title)+60)%360},85%,22%))`;
  const coverInner = g => g.cover ? '' : esc(g.title.trim().charAt(0).toUpperCase() || '?');
  const sorters = {
    new: (a, b) => b.added - a.added,
    cat: (a, b) => b.added - a.added,
    az: (a, b) => a.title.localeCompare(b.title, 'ru'),
    plays: (a, b) => (b.plays || 0) - (a.plays || 0) || b.added - a.added,
  };

  /* ---------- Render ---------- */
  function renderNav() {
    const list = cats(); if (!list.some(c => c.id === cat)) cat = 'all';
    $('nav').innerHTML = list.map(c => {
      const n = c.id === 'all' ? games.length : c.id === FAV ? games.filter(g => g.fav).length : games.filter(g => g.category === c.id).length;
      return `<button class="nav ${c.id === FAV ? 'fav-nav' : ''} ${c.id === cat ? 'active' : ''}" data-cat="${esc(c.id)}">
        <span class="ic">${ico(c.ic)}</span><span class="nm">${esc(c.name)}</span><span class="cnt">${n}</span></button>`;
    }).join('');
  }

  function renderHero() {
    const h = $('hero');
    const last = [...games].sort((a, b) => b.added - a.added)[0];
    if (!last) {
      h.dataset.id = ''; h.classList.add('welcome');
      h.innerHTML = `<div class="hero-info"><span class="badge">Добро пожаловать</span>
        <h1><span class="brand-grad">Nexus</span></h1><p>Ваша библиотека пуста. Добавьте первую игру — нажмите «+».</p>
        <span class="btn" id="heroAdd">${ico('plus')} Добавить игру</span></div>`;
      return;
    }
    h.dataset.id = last.id; h.classList.remove('welcome');
    h.innerHTML = `<div class="bg" style="${coverStyle(last)}"></div>
      <div class="hero-info"><span class="badge">Новинка</span><h1>${esc(last.title)}</h1>
      <p>${esc(last.category)} · последняя добавленная игра</p><span class="btn">${ico('play')} Играть</span></div>`;
  }

  /* ---------- Группировка (как в Яндекс Играх) ---------- */
  const RU = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
  const letterOf = t => {
    const c = (String(t).trim().replace(/^[^\p{L}\p{N}]+/u, '').charAt(0) || '#').toUpperCase();
    return /[A-ZА-ЯЁ]/.test(c) ? c : '#';
  };
  const letterRank = c => c === '#' ? 0 : RU.includes(c) ? 1 : 2;
  const letterCmp = (a, b) => letterRank(a) - letterRank(b) ||
    (letterRank(a) === 1 ? RU.indexOf(a) - RU.indexOf(b) : a.localeCompare(b));

  const cardHTML = (g, i) => `
      <div class="card" data-id="${g.id}" style="animation-delay:${Math.min(i, 12) * 40}ms">
        <div class="cover" style="${coverStyle(g)}">${coverInner(g)}</div>
        <button class="cbtn fav ${g.fav ? 'on' : ''}" data-fav="${g.id}" title="${g.fav ? 'Убрать из избранного' : 'В избранное'}" aria-pressed="${!!g.fav}">${ico('star')}</button>
        <button class="cbtn more" data-more="${g.id}" title="Действия">${ico('dots')}</button>
        <div class="meta"><h3>${esc(g.title)}</h3><small>${esc(g.category)}</small>
          ${g.plays ? `<span class="plays" title="Запусков">${ico('play')}${g.plays}</span>` : ''}</div></div>`;
  const gridHTML = items => `<div class="grid">${items.map(cardHTML).join('')}</div>`;

  // Возвращает только непустые группы: буква без игр / категория без игр просто не появляется
  function buildGroups(list) {
    if (sortBy === 'az') {
      const m = new Map();
      list.forEach(g => { const k = letterOf(g.title); if (!m.has(k)) m.set(k, []); m.get(k).push(g); });
      return [...m.keys()].sort(letterCmp).map(k => ({type:'letter', name:k, items:m.get(k)}));
    }
    if (sortBy === 'cat' && (cat === 'all' || cat === FAV)) {
      const order = userCats.map(c => c.name), ic = {};
      userCats.forEach(c => ic[c.name] = c.ic || 'tag');
      const m = new Map();
      list.forEach(g => { const k = g.category || FALLBACK; if (!m.has(k)) m.set(k, []); m.get(k).push(g); });
      const pos = k => { const i = order.indexOf(k); return i < 0 ? 999 : i; };
      return [...m.keys()].sort((a, b) => pos(a) - pos(b)).map(k => ({type:'cat', name:k, ic:ic[k] || 'tag', items:m.get(k)}));
    }
    return null; // обычный плоский список
  }

  function renderGrid() {
    const q = query.trim().toLowerCase();
    const list = games.filter(g =>
      (cat === 'all' || (cat === FAV ? g.fav : g.category === cat)) &&
      (!q || g.title.toLowerCase().includes(q) || g.category.toLowerCase().includes(q)))
      .sort(sorters[sortBy]);
    $('gridTitle').textContent = cats().find(c => c.id === cat).name;
    $('gridCount').textContent = list.length ? `${list.length} шт.` : '';

    const groups = list.length ? buildGroups(list) : null;
    const showLetters = !!groups && sortBy === 'az' && groups.length > 1;
    $('letters').hidden = !showLetters;
    $('letters').innerHTML = showLetters
      ? groups.map((gr, i) => `<button type="button" data-jump="${i}" aria-label="Перейти к букве ${esc(gr.name)}">${esc(gr.name)}</button>`).join('')
      : '';

    if (!list.length) {
      $('grid').innerHTML = `<div class="empty">${DUCK_SM}${games.length ? (cat === FAV ? 'В избранном пока ничего нет' : 'Ничего не найдено') : 'Здесь пока пусто'}</div>`;
    } else if (groups) {
      $('grid').innerHTML = groups.map((gr, gi) => `
        <section class="group ${gr.type}" data-g="${gi}">
          <div class="group-head">
            ${gr.type === 'letter'
              ? `<span class="gh-letter">${esc(gr.name)}</span>`
              : `<span class="gh-ic">${ico(gr.ic)}</span><h3>${esc(gr.name)}</h3>`}
            <span class="rule"></span><small>${gr.items.length} шт.</small>
          </div>
          ${gridHTML(gr.items)}
        </section>`).join('');
    } else {
      $('grid').innerHTML = gridHTML(list);
    }
  }

  const renderAll = () => { renderNav(); renderHero(); renderGrid(); };

  /* ---------- Toast ---------- */
  let tt;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------- Sidebar ---------- */
  const menu = open => document.body.classList.toggle('menu', open);
  $('burger').onclick = () => menu(true);
  $('sideClose').onclick = $('scrim').onclick = () => menu(false);
  $('nav').onclick = e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    cat = b.dataset.cat; renderNav(); renderGrid(); menu(false);
  };
  $('search').oninput = e => { query = e.target.value; renderGrid(); };
  $('sort').onchange = e => { sortBy = e.target.value; renderGrid(); };
  $('letters').onclick = e => {
    const b = e.target.closest('[data-jump]'); if (!b) return;
    const s = document.querySelector(`.group[data-g="${b.dataset.jump}"]`);
    if (s) s.scrollIntoView({behavior:'smooth', block:'start'});
  };

  /* ---------- Add / edit game ---------- */
  let editId = null, gameText = null, coverData = null;

  const fillCats = sel => {
    $('fCat').innerHTML = userCats.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')
      + `<option value="${CUSTOM}">Своя категория...</option>`;
    if (sel && userCats.some(c => c.name === sel)) $('fCat').value = sel;
    $('fCat').onchange();
  };
  $('fCat').onchange = () => {
    const on = $('fCat').value === CUSTOM;
    $('fCustom').classList.toggle('show', on); if (on) $('fCustom').focus();
  };

  function openForm(g) {
    menu(false); closeCtx();
    editId = g ? g.id : null;
    $('formTitle').textContent = g ? 'Редактировать игру' : 'Добавить игру';
    fillCats(g && g.category);
    if (g) {
      $('fTitle').value = g.title;
      $('gameLbl').classList.add('ok'); $('gameLbl').querySelector('span').textContent = 'Текущий файл (можно заменить)';
      if (g.cover) { $('coverLbl').classList.add('ok'); $('coverLbl').querySelector('span').textContent = 'Текущая обложка (можно заменить)'; }
    }
    $('addModal').classList.add('open');
  }
  const closeAdd = () => {
    $('addModal').classList.remove('open');
    editId = null; gameText = coverData = null;
    $('fTitle').value = ''; $('fGame').value = ''; $('fCover').value = ''; $('err').textContent = '';
    $('fCustom').value = ''; $('fCustom').classList.remove('show');
    $('gameLbl').className = $('coverLbl').className = 'file';
    $('gameLbl').querySelector('span').textContent = 'Выбрать .html файл';
    $('coverLbl').querySelector('span').textContent = 'Выбрать изображение';
  };
  ['fab', 'addSide'].forEach(id => $(id).onclick = () => openForm(null));
  $('hero').onclick = e => {
    if (e.target.closest('#heroAdd')) return openForm(null);
    if ($('hero').dataset.id) play($('hero').dataset.id);
  };
  $('cancel').onclick = closeAdd;
  $('addModal').onclick = e => { if (e.target === $('addModal')) closeAdd(); };

  $('fGame').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    gameText = await f.text();
    $('gameLbl').classList.add('ok'); $('gameLbl').querySelector('span').textContent = f.name;
    if (!$('fTitle').value) $('fTitle').value = f.name.replace(/\.html?$/i, '');
  };

  // Resize cover to max 600px JPEG to keep DB light
  const readCover = file => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .85));
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
  $('fCover').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    coverData = await readCover(f);
    $('coverLbl').classList.add('ok'); $('coverLbl').querySelector('span').textContent = f.name;
  };

  $('save').onclick = async () => {
    const title = $('fTitle').value.trim();
    const old = editId ? games.find(x => x.id === editId) : null;
    if (!title) return $('err').textContent = 'Введите название игры';
    if (!gameText && !old) return $('err').textContent = 'Загрузите HTML-файл игры';
    let category = $('fCat').value;
    if (category === CUSTOM) {
      const name = norm($('fCustom').value);
      if (!name) return $('err').textContent = 'Введите название категории';
      if (reserved(name)) return $('err').textContent = 'Это название занято, выберите другое';
      const ex = userCats.find(c => c.name.toLowerCase() === name.toLowerCase());
      category = ex ? ex.name : name;
    }
    const g = old
      ? {...old, title, category, html: gameText || old.html, cover: coverData || old.cover}
      : {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
         title, category, html: gameText, cover: coverData, added: Date.now(), fav: false, plays: 0};
    try { await dbPut(g); } catch { return $('err').textContent = 'Не удалось сохранить (мало места?)'; }
    if (old) games[games.indexOf(old)] = g; else games.push(g);
    syncCats(); closeAdd(); renderAll(); toast(old ? 'Изменения сохранены' : 'Игра добавлена');
  };

  /* ---------- Delete / favorite ---------- */
  async function delGame(id) {
    const g = games.find(x => x.id === id); if (!g) return;
    if (!confirm(`Удалить «${g.title}»?`)) return;
    try { await dbDel(g.id); } catch { return toast('Не удалось удалить'); }
    games = games.filter(x => x.id !== g.id); renderAll(); toast('Игра удалена');
  }

  async function toggleFav(id) {
    const g = games.find(x => x.id === id); if (!g) return;
    try { await dbPut({...g, fav: !g.fav}); } catch { return toast('Не удалось сохранить'); }
    g.fav = !g.fav;
    const before = cat; renderNav();
    if (cat !== before || cat === FAV) renderGrid();
    else {
      const b = document.querySelector(`[data-fav="${id}"]`);
      if (b) { b.classList.toggle('on', g.fav); b.setAttribute('aria-pressed', g.fav); b.title = g.fav ? 'Убрать из избранного' : 'В избранное'; }
    }
    toast(g.fav ? 'Добавлено в избранное' : 'Убрано из избранного');
  }

  /* ---------- Контекстное меню карточки ---------- */
  const ctx = $('ctx'); let ctxId = null, lpTime = 0;
  function openCtx(id, x, y) {
    ctxId = id; ctx.classList.add('open');
    const w = ctx.offsetWidth, h = ctx.offsetHeight;
    ctx.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
    ctx.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
  }
  function closeCtx() { ctx.classList.remove('open'); ctxId = null; }
  ctx.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = ctxId, g = games.find(x => x.id === id); closeCtx();
    if (!g) return;
    if (b.dataset.act === 'edit') openForm(g); else delGame(id);
  };
  document.addEventListener('click', e => {
    if (Date.now() - lpTime < 600) return;
    if (!e.target.closest('#ctx') && !e.target.closest('[data-more]')) closeCtx();
  });
  addEventListener('scroll', closeCtx, {passive:true});
  addEventListener('resize', closeCtx);

  // долгое нажатие (touch) и правая кнопка мыши
  const grid = $('grid'); let lp = null, lpX = 0, lpY = 0;
  grid.addEventListener('touchstart', e => {
    const c = e.target.closest('.card'); if (!c || e.target.closest('.cbtn')) return;
    const t = e.touches[0]; lpX = t.clientX; lpY = t.clientY;
    lp = setTimeout(() => { lpTime = Date.now(); navigator.vibrate && navigator.vibrate(15); openCtx(c.dataset.id, lpX, lpY); }, 550);
  }, {passive:true});
  grid.addEventListener('touchmove', e => {
    const t = e.touches[0]; if (Math.hypot(t.clientX - lpX, t.clientY - lpY) > 10) clearTimeout(lp);
  }, {passive:true});
  ['touchend', 'touchcancel'].forEach(ev => grid.addEventListener(ev, () => clearTimeout(lp)));
  grid.addEventListener('contextmenu', e => {
    const c = e.target.closest('.card'); if (!c) return;
    e.preventDefault(); lpTime = Date.now(); openCtx(c.dataset.id, e.clientX, e.clientY);
  });

  grid.onclick = e => {
    if (Date.now() - lpTime < 600) return;
    const f = e.target.closest('[data-fav]');
    if (f) { e.stopPropagation(); return toggleFav(f.dataset.fav); }
    const m = e.target.closest('[data-more]');
    if (m) {
      e.stopPropagation();
      if (ctx.classList.contains('open') && ctxId === m.dataset.more) return closeCtx();
      const r = m.getBoundingClientRect(); return openCtx(m.dataset.more, r.right - 190, r.bottom + 6);
    }
    const c = e.target.closest('.card'); if (c) play(c.dataset.id);
  };

  /* ---------- Play ---------- */
  function play(id) {
    const g = games.find(x => x.id === id); if (!g) return;
    g.plays = (g.plays || 0) + 1; g.lastPlayed = Date.now();
    if (db) dbPut(g).catch(() => {});
    const p = $('player');
    $('frame').srcdoc = g.html;
    $('exit').title = 'Выход из «' + g.title + '»';
    p.classList.add('open');
    document.body.style.overflow = 'hidden';
    // настоящий fullscreen, где браузер его поддерживает (на iOS остаётся оверлей 100% экрана)
    const rf = p.requestFullscreen || p.webkitRequestFullscreen;
    try { const r = rf && rf.call(p); r && r.catch && r.catch(() => {}); } catch {}
  }
  function stop() {
    $('player').classList.remove('open');
    $('frame').srcdoc = '';
    document.body.style.overflow = '';
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex && (document.fullscreenElement || document.webkitFullscreenElement)) {
      try { const r = ex.call(document); r && r.catch && r.catch(() => {}); } catch {}
    }
    renderGrid();
  }
  $('exit').onclick = stop;

  // случайная игра
  $('randBtn').onclick = () => {
    if (!games.length) return toast('Библиотека пуста');
    play(games[Math.floor(Math.random() * games.length)].id);
  };

  /* ---------- Управление категориями ---------- */
  let renaming = null;
  function renderCatMgr() {
    $('catList').innerHTML = userCats.length ? userCats.map(c => {
      const n = games.filter(g => g.category === c.name).length;
      return renaming === c.name
        ? `<div class="catrow" data-name="${esc(c.name)}">${ico(c.ic || 'tag')}
            <input type="text" id="renInput" maxlength="30" value="${esc(c.name)}" autocomplete="off">
            <button class="icon-btn" data-ok title="Сохранить">${ico('check')}</button>
            <button class="icon-btn" data-cancel title="Отмена">${ico('x')}</button></div>`
        : `<div class="catrow" data-name="${esc(c.name)}">${ico(c.ic || 'tag')}
            <span class="nm">${esc(c.name)}</span><small>${n}</small>
            <button class="icon-btn" data-ren title="Переименовать">${ico('edit')}</button>
            <button class="icon-btn danger" data-rm title="Удалить">${ico('trash')}</button></div>`;
    }).join('') : '<div class="empty" style="padding:24px">Категорий нет</div>';
    if (renaming) { const i = $('renInput'); i.focus(); i.select(); }
  }

  async function doRename(old, raw) {
    const name = norm(raw);
    if (!name || name === old) { renaming = null; return renderCatMgr(); }
    if (reserved(name)) return toast('Это название занято');
    if (userCats.some(c => c.name !== old && c.name.toLowerCase() === name.toLowerCase())) return toast('Такая категория уже есть');
    const moved = games.filter(g => g.category === old).map(g => ({...g, category: name}));
    try { await Promise.all(moved.map(dbPut)); } catch { return toast('Не удалось сохранить'); }
    moved.forEach(m => { games[games.findIndex(g => g.id === m.id)] = m; });
    userCats.find(c => c.name === old).name = name;
    if (cat === old) cat = name;
    saveCats(); renaming = null; renderAll(); renderCatMgr(); toast('Категория переименована');
  }

  async function delCat(name) {
    const inCat = games.filter(g => g.category === name);
    if (name === FALLBACK && inCat.length) return toast('Сначала переместите игры из этой категории');
    const msg = inCat.length
      ? `Удалить категорию «${name}»? Игры (${inCat.length}) будут перенесены в «${FALLBACK}».`
      : `Удалить категорию «${name}»?`;
    if (!confirm(msg)) return;
    const moved = inCat.map(g => ({...g, category: FALLBACK}));
    try { await Promise.all(moved.map(dbPut)); } catch { return toast('Не удалось сохранить'); }
    moved.forEach(m => { games[games.findIndex(g => g.id === m.id)] = m; });
    userCats = userCats.filter(c => c.name !== name);
    if (cat === name) cat = 'all';
    syncCats(); saveCats(); renderAll(); renderCatMgr(); toast('Категория удалена');
  }

  $('catMgrBtn').onclick = () => { menu(false); renaming = null; $('newCat').value = ''; renderCatMgr(); $('catModal').classList.add('open'); };
  const closeCatMgr = () => { $('catModal').classList.remove('open'); renaming = null; };
  $('catClose').onclick = closeCatMgr;
  $('catModal').onclick = e => { if (e.target === $('catModal')) closeCatMgr(); };
  $('catList').onclick = e => {
    const row = e.target.closest('.catrow'); if (!row) return;
    const name = row.dataset.name;
    if (e.target.closest('[data-ren]')) { renaming = name; renderCatMgr(); }
    else if (e.target.closest('[data-cancel]')) { renaming = null; renderCatMgr(); }
    else if (e.target.closest('[data-ok]')) doRename(name, $('renInput').value);
    else if (e.target.closest('[data-rm]')) delCat(name);
  };
  $('catList').onkeydown = e => {
    if (e.target.id !== 'renInput') return;
    const name = e.target.closest('.catrow').dataset.name;
    if (e.key === 'Enter') doRename(name, e.target.value);
    if (e.key === 'Escape') { e.stopPropagation(); renaming = null; renderCatMgr(); }
  };
  const addCat = () => {
    const name = norm($('newCat').value); if (!name) return;
    if (reserved(name)) return toast('Это название занято');
    if (userCats.some(c => c.name.toLowerCase() === name.toLowerCase())) return toast('Такая категория уже есть');
    userCats.push({name, ic:'tag'}); saveCats(); $('newCat').value = '';
    renderAll(); renderCatMgr(); toast('Категория добавлена');
  };
  $('addCatBtn').onclick = addCat;
  $('newCat').onkeydown = e => { if (e.key === 'Enter') addCat(); };

  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('player').classList.contains('open')) stop();
    else { closeAdd(); closeCtx(); closeCatMgr(); closeProf(); $('setModal').classList.remove('open'); menu(false); }
  });

  /* ---------- Settings ---------- */
  $('settingsBtn').onclick = () => { menu(false); $('setCount').textContent = games.length; $('setModal').classList.add('open'); };
  $('setClose').onclick = () => $('setModal').classList.remove('open');
  $('setModal').onclick = e => { if (e.target === $('setModal')) $('setModal').classList.remove('open'); };
  $('clearAll').onclick = async () => {
    if (!games.length || !confirm('Удалить ВСЕ игры из библиотеки?')) return;
    await dbClear(); games = []; renderAll(); $('setCount').textContent = 0; toast('Библиотека очищена');
  };

  /* ---------- Профиль ---------- */
  const LSP = 'nexus-profile';
  let profile = {name:'Kartel'};
  try { const v = JSON.parse(localStorage.getItem(LSP)); if (v && v.name) profile = v; } catch {}
  const letter = () => (profile.name.trim().charAt(0) || '?').toUpperCase();
  const renderProfile = () => {
    $('avatar').textContent = $('avatarBig').textContent = letter();
    $('profName').textContent = $('setName').textContent = profile.name;
  };
  $('profileBtn').onclick = () => {
    const plays = games.reduce((n, g) => n + (g.plays || 0), 0);
    $('profStats').innerHTML = `Игр: <b>${games.length}</b><br>Запусков: <b>${plays}</b><br>В избранном: <b>${games.filter(g => g.fav).length}</b>`;
    $('pName').value = profile.name; $('pErr').textContent = ''; $('profModal').classList.add('open');
    setTimeout(() => $('pName').focus(), 50);
  };
  const closeProf = () => $('profModal').classList.remove('open');
  $('pCancel').onclick = closeProf;
  $('profModal').onclick = e => { if (e.target === $('profModal')) closeProf(); };
  const saveProf = () => {
    const name = norm($('pName').value);
    if (!name) return $('pErr').textContent = 'Введите имя';
    profile.name = name;
    try { localStorage.setItem(LSP, JSON.stringify(profile)); } catch {}
    renderProfile(); closeProf(); toast('Профиль сохранён');
  };
  $('pSave').onclick = saveProf;
  $('pName').onkeydown = e => { if (e.key === 'Enter') saveProf(); };
  $('avatarBig').style.pointerEvents = 'none';

  /* ---------- Init ---------- */
  (async () => {
    try { db = await openDB(); games = await dbAll(); }
    catch { toast('IndexedDB недоступна — игры не сохранятся'); }
    syncCats(); renderProfile(); renderAll();
    if (window.nexusReady) window.nexusReady();
    seedGames();
  })();

  /* ---------- PWA: встроенные игры + офлайн ---------- */
  const SEED_LS = 'nexus-seeded-v1';
  const SEED = [
    {id:'b-neon-puzzle', file:'neon-puzzle.html', title:'Neon Puzzle', category:'Головоломки', ic:'🧩', c:['#7c3aed','#ec4899']},
    {id:'b-water-sort',  file:'water-sort.html',  title:'Water Sort',  category:'Головоломки', ic:'🧪', c:['#06b6d4','#3b82f6']},
    {id:'b-sudoku',      file:'sudoku.html',      title:'Судоку',      category:'Головоломки', ic:'🔢', c:['#6366f1','#8b5cf6']},
    {id:'b-sapper',      file:'sapper.html',      title:'Сапёр',       category:'Головоломки', ic:'💣', c:['#f59e0b','#ef4444']},
    {id:'b-wordle',      file:'wordle.html',      title:'Wordle',      category:'Головоломки', ic:'🔤', c:['#10b981','#14b8a6']},
    {id:'b-tictactoe',   file:'tictactoe.html',   title:'Крестики-нолики', category:'Головоломки', ic:'❌', c:['#38e8ff','#4f7bff']},
    {id:'b-archers',     file:'archers.html',     title:'Дуэль лучников', category:'Аркады', ic:'🏹', c:['#f97316','#dc2626']},
    {id:'b-knife-hit',   file:'knife-hit.html',   title:'Knife Hit',   category:'Аркады', ic:'🔪', c:['#ef4444','#be185d']},
    {id:'b-neon-smash',  file:'neon-smash.html',  title:'Neon Smash',  category:'Аркады', ic:'⚡', c:['#00e5ff','#ff2e88']},
    {id:'b-car-ride',    file:'car-ride.html',    title:'Fatal Car Ride', category:'Гонки', ic:'🚗', c:['#84cc16','#16a34a']},
    {id:'b-sandbox',     file:'sandbox.html',     title:'Песочница',   category:'Утилиты', ic:'🧑‍💻', c:['#475569','#6366f1']},
    {id:'b-cheatsheet',  file:'cheatsheet.html',  title:'Шпаргалка',   category:'Утилиты', ic:'📝', c:['#a855f7','#6366f1']}
  ];
  const mkCover = (ic, c) => 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + c[0] + '"/><stop offset="1" stop-color="' + c[1] + '"/></linearGradient></defs>' +
    '<rect width="200" height="200" fill="url(#g)"/><text x="100" y="128" font-size="92" text-anchor="middle">' + ic + '</text></svg>');
  let seeding = false;
  async function seedGames() {
    if (seeding || !db) return;
    let done = []; try { done = JSON.parse(localStorage.getItem(SEED_LS)) || []; } catch {}
    const todo = SEED.filter(s => !done.includes(s.id));
    if (!todo.length) return;
    seeding = true; toast('Загружаю встроенные игры…');
    let fail = 0;
    for (const s of todo) {
      try {
        const r = await fetch(s.file, {headers:{'x-seed':'1'}});
        if (!r.ok) throw new Error('http');
        const html = await r.text();
        if (!games.some(g => g.id === s.id)) {
          const g = {id:s.id, title:s.title, category:s.category, html, cover:mkCover(s.ic, s.c),
                     added:Date.now() - SEED.indexOf(s), fav:false, plays:0};
          await dbPut(g); games.push(g);
        }
        done.push(s.id);
        try { localStorage.setItem(SEED_LS, JSON.stringify(done)); } catch {}
        syncCats(); renderAll();
      } catch { fail++; }
    }
    seeding = false;
    toast(fail ? 'Не все игры загрузились — откройте лаунчер с интернетом ещё раз' : 'Готово: все игры работают без интернета');
  }
  window.addEventListener('online', seedGames);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => navigator.serviceWorker.ready)
      .then(reg => { if (reg.active) reg.active.postMessage({type:'precache'}); })
      .catch(() => {});
  }

})();
</script>
</body>
</html>
