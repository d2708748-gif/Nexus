<!DOCTYPE html>
<html lang="ru" style="background:#07071a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07071a">
<meta name="color-scheme" content="dark">
<title>Nexus Wordle</title>
<style>
  :root {
    --bg: #07071a;
    --panel: #0e0e2b;
    --panel2: #14143a;
    --line: #2a2a58;
    --text: #e9e9ff;
    --muted: #8a8ab5;
    --violet: #a855ff;
    --blue: #27c8ff;
    --green: #2dffa8;
    --amber: #ffc933;
    --danger: #ff4d7d;
    --c-correct: #2dffa8;
    --c-present: #ffc933;
    --c-absent: #26264a;
    --tile: max(32px, min(15vw, 62px, calc((100vh - 395px) / 6)));
    --key-h: clamp(42px, 6.8vh, 54px);
  }
  @supports (height: 100dvh) {
    :root {
      --tile: max(32px, min(15vw, 62px, calc((100dvh - 395px) / 6)));
      --key-h: clamp(42px, 6.8dvh, 54px);
    }
  }
  /* режим контрастных цветов */
  body.hc { --c-correct: #ff8a3d; --c-present: #27c8ff; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background-color: var(--bg) !important; }
  body {
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    background-image:
      radial-gradient(800px 460px at 85% -10%, rgba(168, 85, 255, .22), transparent 60%),
      radial-gradient(700px 480px at -10% 110%, rgba(39, 200, 255, .16), transparent 60%);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(168, 85, 255, .07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168, 85, 255, .07) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(75% 60% at 50% 40%, #000, transparent);
            mask-image: radial-gradient(75% 60% at 50% 40%, #000, transparent);
  }
  button { font: inherit; color: inherit; }

  .app {
    position: relative; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
    max-width: 540px; margin: 0 auto;
  }

  /* ---------- Шапка (как в оригинале: слева — меню, по центру — название, справа — иконки) ---------- */
  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .hl { justify-self: start; } .hr { justify-self: end; display: flex; gap: 4px; }
  .exit {
    display: inline-flex; align-items: center; gap: 4px; height: 38px; padding: 0 12px 0 8px; cursor: pointer;
    font-weight: 700; font-size: 14px; color: var(--blue);
    background: rgba(17, 17, 47, .8); border: 1px solid rgba(39, 200, 255, .5); border-radius: 11px;
    transition: box-shadow .2s, border-color .2s, transform .1s;
  }
  .exit:hover, .exit:focus-visible { border-color: var(--blue); box-shadow: 0 0 16px rgba(39, 200, 255, .65); outline: 0; }
  .exit:active, .icon:active { transform: scale(.93); }
  .icon {
    width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; padding: 0;
    background: transparent; border: 1px solid transparent; border-radius: 11px; color: #cfc8ff;
    transition: color .2s, box-shadow .2s, border-color .2s, transform .1s;
  }
  .icon:hover, .icon:focus-visible { color: #fff; border-color: var(--violet); box-shadow: 0 0 14px rgba(168, 85, 255, .6); outline: 0; }
  svg.s { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .exit svg.s { width: 18px; height: 18px; stroke-width: 2.6; }

  .title h1 {
    margin: 0; font-size: clamp(22px, 6.4vw, 30px); font-weight: 900; letter-spacing: .16em; padding-left: .16em;
    background: linear-gradient(90deg, var(--violet), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 12px rgba(168, 85, 255, .6));
  }

  /* ---------- Полоса уровня ---------- */
  .lvl { display: flex; align-items: center; gap: 10px; padding: 9px 2px 0; font-size: 12px; color: var(--muted); }
  .badge {
    flex: none; padding: 3px 9px; border-radius: 8px; font-weight: 800; letter-spacing: .06em; color: #fff;
    background: linear-gradient(135deg, rgba(168, 85, 255, .55), rgba(39, 200, 255, .3));
    border: 1px solid rgba(168, 85, 255, .7); box-shadow: 0 0 12px rgba(168, 85, 255, .45);
  }
  .ltitle { flex: none; color: #cfc8ff; font-weight: 600; max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xp { flex: 1; height: 7px; border-radius: 7px; background: rgba(168, 85, 255, .18); overflow: hidden; border: 1px solid rgba(168, 85, 255, .25); }
  .xp i { display: block; height: 100%; width: 0; border-radius: 7px; transition: width .9s cubic-bezier(.2, .9, .3, 1);
          background: linear-gradient(90deg, var(--violet), var(--blue)); box-shadow: 0 0 10px var(--violet); }
  .xptxt { flex: none; font-variant-numeric: tabular-nums; }
  .lvl.pulse .badge { animation: pulse .9s ease; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 40% { transform: scale(1.25); box-shadow: 0 0 22px var(--blue); } }

  /* ---------- Поле ---------- */
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .board { display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: repeat(5, var(--tile)); gap: 6px; }
  .tile {
    width: var(--tile); height: var(--tile); display: grid; place-items: center;
    font-size: calc(var(--tile) * .55); font-weight: 800; text-transform: uppercase; color: #fff;
    background: rgba(17, 17, 47, .75); border: 2px solid var(--line); border-radius: 10px;
    transition: border-color .15s, box-shadow .15s;
  }
  .tile:hover { border-color: var(--violet); box-shadow: 0 0 14px rgba(168, 85, 255, .6); }
  .tile.filled { border-color: var(--blue); box-shadow: 0 0 14px rgba(39, 200, 255, .55), inset 0 0 10px rgba(39, 200, 255, .16); }
  .tile.pop { animation: pop .12s ease-out; }
  .tile[data-state="correct"] { background: var(--c-correct); border-color: var(--c-correct); color: #04140d; box-shadow: 0 0 16px var(--c-correct); }
  .tile[data-state="present"] { background: var(--c-present); border-color: var(--c-present); color: #1c1400; box-shadow: 0 0 16px var(--c-present); }
  .tile[data-state="absent"]  { background: var(--c-absent); border-color: #34346a; color: #9a9ac8; box-shadow: none; }
  .tile.flip { animation: flip .6s ease-in-out both; }
  .tile.win  { animation: bounce .8s ease both; }
  .row.shake { animation: shake .5s ease; }
  @keyframes pop    { 0% { transform: scale(.85); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes flip   { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  @keyframes shake  { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px); } 30% { transform: translateX(8px); }
                      45% { transform: translateX(-7px); } 60% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  @keyframes bounce { 0%,20% { transform: translateY(0); } 40% { transform: translateY(-18px); } 55% { transform: translateY(4px); }
                      70% { transform: translateY(-8px); } 85%,100% { transform: translateY(0); } }

  /* ---------- Клавиатура ---------- */
  .kb { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
  .kb-row { display: flex; gap: 5px; justify-content: center; }
  .key {
    flex: 1 1 0; min-width: 0; height: var(--key-h); padding: 0; cursor: pointer;
    font-weight: 700; font-size: clamp(14px, 4.4vw, 19px); text-transform: uppercase; color: var(--text);
    background: rgba(20, 20, 58, .9); border: 1px solid #30306a; border-radius: 9px;
    transition: border-color .15s, box-shadow .15s, background-color .25s, transform .08s;
  }
  .key:hover { border-color: var(--blue); box-shadow: 0 0 12px rgba(39, 200, 255, .55); }
  .key:active { transform: scale(.93); }
  .key.wide { flex: 1.7 1 0; font-size: clamp(11px, 3.1vw, 14px); letter-spacing: .03em; color: var(--violet); border-color: rgba(168, 85, 255, .55); }
  .key.wide:hover { border-color: var(--violet); box-shadow: 0 0 12px rgba(168, 85, 255, .6); }
  .key[data-state="correct"] { background: var(--c-correct); border-color: var(--c-correct); color: #04140d; box-shadow: 0 0 12px var(--c-correct); }
  .key[data-state="present"] { background: var(--c-present); border-color: var(--c-present); color: #1c1400; box-shadow: 0 0 12px var(--c-present); }
  .key[data-state="absent"]  { background: #15152f; border-color: #25254a; color: #5d5d8a; box-shadow: none; }

  /* ---------- Toast ---------- */
  .toasts { position: fixed; left: 0; right: 0; z-index: 200; top: calc(env(safe-area-inset-top, 0px) + 74px);
            display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  .toast {
    max-width: calc(100vw - 28px); padding: 12px 20px; border-radius: 16px; text-align: center;
    font-weight: 800; font-size: 17px; letter-spacing: .02em; color: #fff;
    background: rgba(12, 12, 36, .94); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1.5px solid var(--blue);
    box-shadow: 0 0 22px rgba(39, 200, 255, .55), inset 0 0 16px rgba(39, 200, 255, .12);
    animation: toastIn .35s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  .toast.win  { border-color: var(--green); font-size: 21px; text-shadow: 0 0 12px var(--green);
                box-shadow: 0 0 30px rgba(45, 255, 168, .65), inset 0 0 18px rgba(45, 255, 168, .15); }
  .toast.lose { border-color: var(--danger); text-shadow: 0 0 12px var(--danger);
                box-shadow: 0 0 30px rgba(255, 77, 125, .6), inset 0 0 18px rgba(255, 77, 125, .14); }
  .toast.level { border-color: var(--violet); text-shadow: 0 0 12px var(--violet);
                 box-shadow: 0 0 30px rgba(168, 85, 255, .7), inset 0 0 18px rgba(168, 85, 255, .18); }
  .toast.out { animation: toastOut .3s ease forwards; }
  @keyframes toastIn  { from { opacity: 0; transform: translateY(-24px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-16px) scale(.95); } }

  .spark { position: fixed; left: 50%; top: 40%; width: 8px; height: 8px; border-radius: 50%; z-index: 150; pointer-events: none;
           background: var(--c); box-shadow: 0 0 10px var(--c); animation: spark 1.1s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

  /* ---------- Модальные окна ---------- */
  .back { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px;
          background: rgba(4, 4, 16, .72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
          animation: fade .2s ease both; }
  .back.closing { animation: fadeOut .2s ease forwards; }
  .modal {
    position: relative; width: min(100%, 420px); max-height: calc(100% - 20px); overflow: auto;
    padding: 22px 20px 20px; border-radius: 20px;
    background: linear-gradient(180deg, #14143a, #0c0c2a);
    border: 1.5px solid rgba(168, 85, 255, .6);
    box-shadow: 0 0 40px rgba(168, 85, 255, .35), inset 0 0 30px rgba(39, 200, 255, .05);
    animation: rise .3s cubic-bezier(.2, 1.1, .4, 1) both;
  }
  .modal h2 { margin: 0 0 14px; text-align: center; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #fff;
              text-shadow: 0 0 12px var(--violet); }
  .modal h3 { margin: 18px 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer;
           background: transparent; border: 0; color: var(--muted); border-radius: 10px; }
  .close:hover { color: #fff; box-shadow: 0 0 12px rgba(168, 85, 255, .6); }
  @keyframes fade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes rise    { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }

  .modal p { margin: 0 0 10px; font-size: 14px; line-height: 1.5; color: #cfcdf0; }
  .ex { margin: 14px 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .ex .r { display: flex; gap: 5px; margin-bottom: 7px; }
  .ex .t { width: 38px; height: 38px; display: grid; place-items: center; font-weight: 800; font-size: 19px; border-radius: 8px;
           border: 2px solid var(--line); background: rgba(17, 17, 47, .75); color: #fff; }
  .ex .t.correct { background: var(--c-correct); border-color: var(--c-correct); color: #04140d; }
  .ex .t.present { background: var(--c-present); border-color: var(--c-present); color: #1c1400; }
  .ex .t.absent  { background: var(--c-absent); border-color: #34346a; color: #9a9ac8; }

  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-bottom: 4px; }
  .nums b { display: block; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(39, 200, 255, .5); }
  .nums span { font-size: 11px; color: var(--muted); line-height: 1.2; display: block; }
  .dist { display: grid; grid-template-columns: 14px 1fr; gap: 6px 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .bar { height: 22px; min-width: 24px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; border-radius: 5px;
         font-weight: 800; font-size: 12px; color: #fff; background: #26264a; transition: width .8s ease; }
  .bar.hit { background: var(--c-correct); color: #04140d; box-shadow: 0 0 12px var(--c-correct); }
  .lcard { margin-top: 4px; padding: 12px; border-radius: 14px; background: rgba(168, 85, 255, .1); border: 1px solid rgba(168, 85, 255, .4); }
  .lcard .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; font-weight: 700; }
  .gain { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #04140d; background: var(--green);
          box-shadow: 0 0 12px rgba(45, 255, 168, .6); animation: toastIn .5s .3s both; }
  .btns { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; height: 46px; cursor: pointer; border-radius: 12px; font-weight: 800; font-size: 15px; color: #fff;
         background: transparent; border: 1px solid var(--line); transition: box-shadow .2s, transform .1s, border-color .2s; }
  .btn:hover { border-color: var(--violet); box-shadow: 0 0 16px rgba(168, 85, 255, .55); }
  .btn:active { transform: scale(.96); }
  .btn.primary { border: 0; color: #07071a; background: linear-gradient(90deg, var(--violet), var(--blue)); box-shadow: 0 0 18px rgba(168, 85, 255, .55); }
  .btn.danger { color: var(--danger); border-color: rgba(255, 77, 125, .5); }
  .btn.danger:hover { border-color: var(--danger); box-shadow: 0 0 16px rgba(255, 77, 125, .5); }

  .set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .set small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
  .set b { font-size: 15px; }
  .sw { position: relative; flex: none; width: 46px; height: 26px; cursor: pointer; border-radius: 999px; padding: 0;
        background: #1a1a40; border: 1px solid var(--line); transition: background .2s, border-color .2s, box-shadow .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted);
               transition: transform .2s, background .2s; }
  .sw[aria-checked="true"] { border-color: var(--green); background: rgba(45, 255, 168, .15); box-shadow: 0 0 12px rgba(45, 255, 168, .35); }
  .sw[aria-checked="true"]::after { transform: translateX(20px); background: var(--green); box-shadow: 0 0 8px var(--green); }

  @media (prefers-reduced-motion: reduce) {
    .tile.flip, .tile.win, .row.shake, .tile.pop, .spark, .modal, .toast { animation-duration: .01s; }
  }
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="hl">
      <button class="exit" id="exit" type="button" aria-label="Выход в лаунчер">
        <svg class="s" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Выход
      </button>
    </div>
    <div class="title"><h1>WORDLE</h1></div>
    <div class="hr">
      <button class="icon" id="bHelp" type="button" aria-label="Правила">
        <svg class="s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.4-1 .9-1 1.6"/><path d="M12 17.2h.01"/></svg>
      </button>
      <button class="icon" id="bStats" type="button" aria-label="Статистика">
        <svg class="s" viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      </button>
      <button class="icon" id="bSet" type="button" aria-label="Настройки">
        <svg class="s" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div class="lvl" id="lvl">
    <span class="badge">LVL <span id="lvlN">1</span></span>
    <span class="ltitle" id="lvlT">Новичок</span>
    <div class="xp"><i id="xpBar"></i></div>
    <span class="xptxt" id="xpTxt">0/100</span>
  </div>

  <main><div class="board" id="board" aria-label="Игровое поле"></div></main>
  <div class="kb" id="kb" aria-label="Клавиатура"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* Куда возвращаться по «Выход». Пусто — на прошлую страницу (лаунчер). Или укажите адрес, например '../index.html' */
  const LAUNCHER_URL = '';

  /* ---------- Словарь: русские существительные из 5 букв ---------- */
  const WORDS = [
    'арбуз','банан','берег','билет','бочка','булка','ветер','вилка','волна','ворон',
    'газон','глина','голос','город','гроза','груша','дверь','дождь','доска','дрова',
    'дымка','завод','земля','зерно','книга','кошка','крыса','кулак','лампа','ласка',
    'лодка','ложка','маска','масло','мачта','мышка','народ','огонь','озеро','орган',
    'осень','пакет','палец','парта','песня','перец','пират','плечо','повар','порог',
    'почта','птица','пушка','радио','ручка','рыбак','салат','слива','слово','совет',
    'спина','стена','страх','судья','сумка','танец','трава','тропа','туман','улица',
    'успех','уголь','фрукт','чайка','школа','шарик','шапка','щегол','экран','юноша',
    'ягода','якорь','комод','карта','камин','канал','кисть','колос','корка','кроха',
    'мираж','метро','мотор','мороз','поезд','полка','сосна','ветка','лимон','багаж',
    'кабан','жираф','жилет','чашка','пирог','сахар','аллея','балет','банка','башня',
    'белка','лента','линза','мечта','нитка','парус','песок','пчела','тайна','акула',
    'ангел','астра','баран','бегун','бетон','блюдо','бокал','брюки','вагон','ведро',
    'венок','вечер','визит','вишня','вокал','выбор','вызов','герой','гость','дрель',
    'дуэль','жизнь','забор','замок','запах','заряд','зебра','игрок','касса','катер',
    'клоун','колба','кофта','кузов','купол','лавка','магия','марка','масса','мишка',

  ].filter((w, i, a) => w.length === 5 && a.indexOf(w) === i && w !== 'тарас');

  const ROWS = 6, COLS = 5, FLIP = 300;
  const KEYBOARD = ['йцукенгшщзхъ', 'фывапролджэ', 'ячсмитьбю'];
  const TITLES = ['Новичок', 'Скрипт-кидди', 'Нетраннер', 'Хакер', 'Кибер-ас', 'Легенда сети', 'Архитектор Nexus'];

  /* ---------- Сохранение ---------- */
  const LS = 'nexus-wordle-v2';
  const DEF = { sound: true, vibe: true, hard: false, hc: false, xp: 0, played: 0, wins: 0, streak: 0, best: 0, dist: [0, 0, 0, 0, 0, 0] };
  let P;
  function load() {
    try {
      const o = JSON.parse(localStorage.getItem(LS));
      P = Object.assign({}, DEF, o || {});
      if (!Array.isArray(P.dist) || P.dist.length !== 6) P.dist = DEF.dist.slice();
    } catch (e) { P = Object.assign({}, DEF, { dist: DEF.dist.slice() }); }
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(P)); } catch (e) {} }
  load();

  /* ---------- Уровни ---------- */
  const need = lvl => 100 + (lvl - 1) * 40;
  function levelInfo(xp) {
    let lvl = 1, rem = xp;
    while (rem >= need(lvl)) { rem -= need(lvl); lvl++; }
    return { lvl, rem, need: need(lvl), title: TITLES[Math.min(TITLES.length - 1, Math.floor((lvl - 1) / 2))] };
  }
  const $ = id => document.getElementById(id);
  function renderLevel(pulse) {
    const L = levelInfo(P.xp);
    $('lvlN').textContent = L.lvl;
    $('lvlT').textContent = L.title;
    $('xpTxt').textContent = L.rem + '/' + L.need;
    $('xpBar').style.width = Math.round(L.rem / L.need * 100) + '%';
    if (pulse) { const el = $('lvl'); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  }

  /* ---------- Звуки (синтез через Web Audio — внешних файлов нет) ---------- */
  let actx = null;
  function ac() {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, o = {}) {
    if (!P.sound) return;
    const c = ac(); if (!c) return;
    const { t = 0, dur = .12, type = 'sine', vol = .14, slide = 0 } = o;
    const osc = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + .03);
  }
  const N = { C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, E6: 1318.5 };
  const SND = {
    key:  () => tone(620, { dur: .05, type: 'triangle', vol: .09 }),
    del:  () => tone(330, { dur: .06, type: 'triangle', vol: .09 }),
    ui:   () => tone(760, { dur: .06, type: 'sine', vol: .09 }),
    err:  () => { tone(160, { dur: .16, type: 'sawtooth', vol: .1 }); tone(120, { t: .11, dur: .2, type: 'sawtooth', vol: .1 }); },
    tile: (state, i) => {
      if (state === 'correct') tone(N.C5 * (1 + i * .12), { dur: .16, type: 'triangle', vol: .13 });
      else if (state === 'present') tone(392, { dur: .13, type: 'triangle', vol: .11 });
      else tone(190, { dur: .1, type: 'square', vol: .06 });
    },
    win:  () => [N.C5, N.E5, N.G5, N.C6, N.E6].forEach((f, i) => tone(f, { t: i * .11, dur: .35, type: 'triangle', vol: .13 })),
    lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, { t: i * .18, dur: .3, type: 'sawtooth', vol: .09, slide: -30 })),
    level:() => [N.C5, N.E5, N.G5, N.A5, N.C6, N.E6].forEach((f, i) => { tone(f, { t: i * .09, dur: .4, type: 'square', vol: .07 }); tone(f * 2, { t: i * .09, dur: .3, type: 'sine', vol: .05 }); })
  };
  const buzz = ms => { if (P.vibe && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } };

  /* ---------- Построение поля и клавиатуры ---------- */
  const boardEl = $('board'), kbEl = $('kb'), toastsEl = $('toasts');
  const rowEls = [], tiles = [], keyEls = {};
  let answer = '', row = 0, col = 0, over = false, busy = false, bag = [], modalOpen = false;
  let guesses = [], results = [], lastFresh = null;

  for (let r = 0; r < ROWS; r++) {
    const rowEl = document.createElement('div'); rowEl.className = 'row';
    const line = [];
    for (let c = 0; c < COLS; c++) { const t = document.createElement('div'); t.className = 'tile'; rowEl.appendChild(t); line.push(t); }
    boardEl.appendChild(rowEl); rowEls.push(rowEl); tiles.push(line);
  }
  function makeKey(label, value, cls) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'key' + (cls ? ' ' + cls : ''); b.textContent = label; b.dataset.key = value;
    b.setAttribute('aria-label', value === 'enter' ? 'Ввод' : value === 'back' ? 'Стереть' : value);
    keyEls[value] = b; return b;
  }
  KEYBOARD.forEach((letters, i) => {
    const r = document.createElement('div'); r.className = 'kb-row';
    if (i === 2) r.appendChild(makeKey('ввод', 'enter', 'wide'));
    for (const ch of letters) r.appendChild(makeKey(ch, ch));
    if (i === 2) r.appendChild(makeKey('⌫', 'back', 'wide'));
    kbEl.appendChild(r);
  });
  kbEl.addEventListener('mousedown', e => e.preventDefault());
  kbEl.addEventListener('click', e => { const b = e.target.closest('.key'); if (b) { handleKey(b.dataset.key); b.blur(); } });

  /* ---------- Toast ---------- */
  function dismiss(el) { if (!el || el.classList.contains('out')) return; el.classList.add('out'); setTimeout(() => el.remove(), 320); }
  function toast(msg, opt = {}) {
    const { kind = 'info', ms = 1700 } = opt;
    const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
    toastsEl.appendChild(el); if (ms) setTimeout(() => dismiss(el), ms); return el;
  }

  /* ---------- Логика ---------- */
  function pickWord() {
    if (!bag.length) {
      bag = WORDS.slice();
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    }
    return bag.pop();
  }
  /* Повторяющиеся буквы: сначала точные совпадения, затем «жёлтые» — пока остаются неиспользованные такие буквы */
  function evaluate(guess, target) {
    const res = Array(COLS).fill('absent'), left = {};
    for (let i = 0; i < COLS; i++) { if (guess[i] === target[i]) res[i] = 'correct'; else left[target[i]] = (left[target[i]] || 0) + 1; }
    for (let i = 0; i < COLS; i++) { if (res[i] === 'correct') continue; if (left[guess[i]] > 0) { res[i] = 'present'; left[guess[i]]--; } }
    return res;
  }
  const RANK = { absent: 1, present: 2, correct: 3 };
  function paintKey(letter, state) {
    const k = keyEls[letter]; if (!k) return;
    const cur = k.dataset.state; if (!cur || RANK[state] > RANK[cur]) k.dataset.state = state;
  }
  /* Сложный режим: подсказки из прошлых попыток обязательны к использованию */
  function hardCheck(guess) {
    for (let r = 0; r < results.length; r++) {
      const pg = guesses[r], pr = results[r], cnt = {};
      for (let i = 0; i < COLS; i++) {
        if (pr[i] === 'correct' && guess[i] !== pg[i]) return (i + 1) + '-я буква должна быть «' + pg[i].toUpperCase() + '»';
        if (pr[i] !== 'absent') cnt[pg[i]] = (cnt[pg[i]] || 0) + 1;
      }
      for (const ch in cnt) {
        if (guess.split(ch).length - 1 < cnt[ch]) return 'Слово должно содержать «' + ch.toUpperCase() + '»';
      }
    }
    return '';
  }

  function addLetter(ch) {
    if (busy || over || col >= COLS) return;
    const t = tiles[row][col]; t.textContent = ch; t.classList.add('filled');
    t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
    col++; SND.key(); buzz(8);
  }
  function removeLetter() {
    if (busy || over || col === 0) return;
    col--; const t = tiles[row][col]; t.textContent = ''; t.classList.remove('filled', 'pop'); SND.del();
  }
  function shake(r) {
    const el = rowEls[r]; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
    SND.err(); buzz([30, 40, 30]);
  }

  function submit() {
    if (busy || over) return;
    if (col < COLS) { shake(row); toast('Не хватает букв'); return; }
    const r = row, guess = tiles[r].map(t => t.textContent.toLowerCase()).join('');
    if (P.hard) { const e = hardCheck(guess); if (e) { shake(r); toast(e, { ms: 2200 }); return; } }

    const res = evaluate(guess, answer);
    guesses.push(guess); results.push(res); busy = true;

    tiles[r].forEach((t, i) => {
      setTimeout(() => t.classList.add('flip'), i * FLIP);
      setTimeout(() => {
        t.dataset.state = res[i]; t.classList.remove('filled');
        t.setAttribute('aria-label', t.textContent + ': ' + ({ correct: 'на месте', present: 'есть в слове', absent: 'нет в слове' })[res[i]]);
        SND.tile(res[i], i);
      }, i * FLIP + FLIP);
    });

    setTimeout(() => {
      guess.split('').forEach((ch, i) => paintKey(ch, res[i]));
      busy = false; row++; col = 0;
      if (res.every(s => s === 'correct')) endGame(true, r + 1);
      else if (row >= ROWS) endGame(false, ROWS);
    }, (COLS - 1) * FLIP + FLIP * 2);
  }

  function endGame(win, attempts) {
    over = true;
    const before = levelInfo(P.xp).lvl;
    P.played++;
    let gain;
    if (win) {
      P.wins++; P.streak++; P.best = Math.max(P.best, P.streak); P.dist[attempts - 1]++;
      gain = 50 + (6 - attempts) * 10 + Math.min(P.streak - 1, 5) * 5;
    } else { P.streak = 0; gain = 10; }
    P.xp += gain; save();
    const after = levelInfo(P.xp);
    const leveled = after.lvl > before;
    lastFresh = { win, attempts, gain, leveled };

    if (win) {
      tiles[attempts - 1].forEach((t, i) => { t.classList.remove('flip'); t.style.animationDelay = i * 100 + 'ms'; t.classList.add('win'); });
      toast('Победа! 🎉', { kind: 'win', ms: 2400 }); SND.win(); buzz([40, 60, 80]); burst();
    } else {
      toast('Слово было: ' + answer.toUpperCase(), { kind: 'lose', ms: 2600 }); SND.lose(); buzz(200);
    }
    setTimeout(() => renderLevel(true), 500);
    if (leveled) setTimeout(() => { toast('Уровень ' + after.lvl + '! ' + after.title, { kind: 'level', ms: 2600 }); SND.level(); buzz([60, 40, 60, 40, 120]); burst(); }, win ? 1300 : 900);
    setTimeout(() => { if (over && !modalOpen) openStats(true); }, leveled ? 3000 : 2500);
  }

  function handleKey(k) { if (modalOpen) return; if (k === 'enter') submit(); else if (k === 'back') removeLetter(); else addLetter(k); }
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') { closeModal(); return; }
    if (modalOpen) return;
    if (e.key === 'Enter') { e.preventDefault(); if (over && !busy) newGame(); else handleKey('enter'); }
    else if (e.key === 'Backspace') { e.preventDefault(); handleKey('back'); }
    else if (/^[а-яё]$/i.test(e.key)) handleKey(e.key.toLowerCase().replace('ё', 'е'));
  });

  function burst() {
    const colors = ['#a855ff', '#27c8ff', '#2dffa8', '#ffc933'];
    for (let i = 0; i < 32; i++) {
      const s = document.createElement('i'); s.className = 'spark';
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 180;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      s.style.setProperty('--c', colors[i % colors.length]);
      document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
    }
  }

  function newGame() {
    closeModal(true);
    toastsEl.querySelectorAll('.toast').forEach(dismiss);
    tiles.flat().forEach(t => { t.textContent = ''; t.className = 'tile'; t.removeAttribute('data-state'); t.removeAttribute('aria-label'); t.style.animationDelay = ''; });
    Object.values(keyEls).forEach(k => k.removeAttribute('data-state'));
    row = 0; col = 0; over = false; busy = false; guesses = []; results = []; lastFresh = null;
    answer = pickWord();
  }

  /* ---------- Модальные окна ---------- */
  let backEl = null;
  function openModal(html, afterMount) {
    closeModal(true);
    backEl = document.createElement('div'); backEl.className = 'back';
    backEl.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<button class="close" type="button" aria-label="Закрыть"><svg class="s" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' + html + '</div>';
    backEl.addEventListener('mousedown', e => { if (e.target === backEl) closeModal(); });
    backEl.querySelector('.close').onclick = () => closeModal();
    document.body.appendChild(backEl); modalOpen = true; SND.ui();
    if (afterMount) afterMount(backEl);
  }
  function closeModal(instant) {
    if (!backEl) return;
    const el = backEl; backEl = null; modalOpen = false;
    if (instant) { el.remove(); return; }
    el.classList.add('closing'); setTimeout(() => el.remove(), 220);
  }

  function openHelp() {
    const ex = (word, idx, st, text) =>
      '<div class="ex"><div class="r">' + word.split('').map((ch, i) => '<div class="t ' + (i === idx ? st : '') + '">' + ch + '</div>').join('') + '</div><p>' + text + '</p></div>';
    openModal(
      '<h2>Как играть</h2>' +
      '<p>Угадайте слово из <b>5 букв</b> за <b>6 попыток</b>. После каждой попытки плитки меняют цвет.</p>' +
      ex('ВЕТЕР', 0, 'correct', 'Буква <b>В</b> есть в слове и стоит на своём месте.') +
      ex('ЛОДКА', 1, 'present', 'Буква <b>О</b> есть в слове, но стоит не здесь.') +
      ex('ЗЕМЛЯ', 4, 'absent', 'Буквы <b>Я</b> в слове нет.') +
      '<p>За победы вы получаете опыт и растёте в уровнях: чем меньше попыток и длиннее серия — тем больше XP.</p>'
    );
  }

  function openStats(fresh) {
    const wr = P.played ? Math.round(P.wins / P.played * 100) : 0, max = Math.max(1, ...P.dist), L = levelInfo(P.xp);
    const hit = fresh && lastFresh && lastFresh.win ? lastFresh.attempts - 1 : -1;
    const bars = P.dist.map((n, i) =>
      '<span>' + (i + 1) + '</span><div class="bar' + (i === hit ? ' hit' : '') + '" data-w="' + Math.max(8, Math.round(n / max * 100)) + '" style="width:8%">' + n + '</div>').join('');
    const finished = over && lastFresh;
    openModal(
      '<h2>Статистика</h2>' +
      '<div class="nums"><div><b>' + P.played + '</b><span>Сыграно</span></div><div><b>' + wr + '</b><span>% побед</span></div>' +
      '<div><b>' + P.streak + '</b><span>Серия</span></div><div><b>' + P.best + '</b><span>Лучшая серия</span></div></div>' +
      '<h3>Распределение попыток</h3><div class="dist">' + bars + '</div>' +
      '<h3>Уровень</h3><div class="lcard"><div class="top"><span>LVL ' + L.lvl + ' · ' + L.title + '</span>' +
      (finished ? '<span class="gain">+' + lastFresh.gain + ' XP</span>' : '<span style="color:var(--muted)">' + L.rem + '/' + L.need + '</span>') + '</div>' +
      '<div class="xp"><i style="width:' + Math.round(L.rem / L.need * 100) + '%"></i></div></div>' +
      '<div class="btns">' + (finished ? '<button class="btn" id="mShare" type="button">Поделиться</button>' : '') +
      '<button class="btn primary" id="mNew" type="button">' + (over ? 'Играть снова' : 'Новая игра') + '</button></div>',
      m => {
        requestAnimationFrame(() => requestAnimationFrame(() => m.querySelectorAll('.bar').forEach(b => b.style.width = b.dataset.w + '%')));
        m.querySelector('#mNew').onclick = () => newGame();
        const sh = m.querySelector('#mShare'); if (sh) sh.onclick = share;
      });
  }

  function copyText(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
    return new Promise((res, rej) => {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); }
      ta.remove();
    });
  }
  function share() {
    const map = { correct: '🟩', present: '🟨', absent: '⬛' };
    const won = lastFresh && lastFresh.win;
    const txt = 'Nexus Wordle ' + (won ? results.length : 'X') + '/6\n' + results.map(r => r.map(s => map[s]).join('')).join('\n');
    if (navigator.share) { navigator.share({ text: txt }).catch(() => {}); return; }
    copyText(txt).then(() => toast('Результат скопирован', { kind: 'win' })).catch(() => toast('Не удалось скопировать'));
  }

  function openSettings() {
    const row = (id, name, desc, on) =>
      '<div class="set"><div><b>' + name + '</b><small>' + desc + '</small></div><button class="sw" type="button" role="switch" data-id="' + id + '" aria-checked="' + on + '" aria-label="' + name + '"></button></div>';
    openModal(
      '<h2>Настройки</h2>' +
      row('sound', 'Звук', 'Эффекты и мелодии', P.sound) +
      row('vibe', 'Вибрация', 'Отклик при вводе и в конце игры', P.vibe) +
      row('hard', 'Сложный режим', 'Найденные подсказки нужно использовать', P.hard) +
      row('hc', 'Контрастные цвета', 'Оранжевый и голубой вместо зелёного и жёлтого', P.hc) +
      '<div class="btns"><button class="btn primary" id="sNew" type="button">Новая игра</button>' +
      '<button class="btn danger" id="sReset" type="button">Сбросить прогресс</button></div>',
      m => {
        m.querySelectorAll('.sw').forEach(sw => sw.onclick = () => {
          const id = sw.dataset.id;
          if (id === 'hard' && !P.hard && row > 0 && !over) { toast('Сложный режим включают в начале игры'); return; }
          P[id] = !P[id]; sw.setAttribute('aria-checked', P[id]); save();
          if (id === 'hc') document.body.classList.toggle('hc', P.hc);
          SND.ui(); if (id === 'vibe') buzz(40);
        });
        m.querySelector('#sNew').onclick = () => newGame();
        const rs = m.querySelector('#sReset'); let armed = false, tm;
        rs.onclick = () => {
          if (!armed) { armed = true; rs.textContent = 'Точно сбросить?'; tm = setTimeout(() => { armed = false; rs.textContent = 'Сбросить прогресс'; }, 3000); return; }
          clearTimeout(tm);
          const keep = { sound: P.sound, vibe: P.vibe, hard: P.hard, hc: P.hc };
          P = Object.assign({}, DEF, keep, { dist: DEF.dist.slice() }); save(); renderLevel(); closeModal(); toast('Прогресс сброшен');
        };
      });
  }

  $('bHelp').onclick = openHelp;
  $('bStats').onclick = () => openStats(false);
  $('bSet').onclick = openSettings;
  $('exit').onclick = () => {
    if (LAUNCHER_URL) location.href = LAUNCHER_URL;
    else if (history.length > 1) history.back();
    else { try { window.close(); } catch (e) {} location.href = './'; }
  };
  // браузеры разрешают звук только после первого касания
  document.addEventListener('pointerdown', () => { if (P.sound) ac(); }, { once: true });

  document.body.classList.toggle('hc', P.hc);
  renderLevel();
  newGame();
  if (!P.played && !P.xp) setTimeout(openHelp, 500);   // первый запуск — показываем правила
})();
</script>
</body>
</html>
