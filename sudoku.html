<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sudoku</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
/* ================= Основа: ночное «северное сияние», цвет меняется с каждым уровнем ================= */
:root{
  --h:265;
  --a:hsl(var(--h) 90% 62%);
  --a2:hsl(calc(var(--h) + 55) 90% 60%);
  --aS:hsl(var(--h) 100% 82%);
  --glass:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.14);
  --font:"Manrope","Nunito","Segoe UI",system-ui,sans-serif;
  --disp:"Unbounded","Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:var(--font);user-select:none;-webkit-user-select:none;background:#0a0a18}
body{
  background:
    radial-gradient(60% 42% at 12% 8%,hsl(var(--h) 85% 52% / .42),transparent 70%),
    radial-gradient(52% 40% at 95% 28%,hsl(calc(var(--h) + 60) 85% 52% / .30),transparent 70%),
    radial-gradient(70% 50% at 45% 105%,hsl(calc(var(--h) - 55) 80% 48% / .34),transparent 70%),
    hsl(var(--h) 45% 7%);
  background-attachment:fixed;
}
body::before{ /* мягкие звёзды */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 38% 62%,#fff,transparent),radial-gradient(1px 1px at 88% 74%,#fff,transparent),radial-gradient(1.2px 1.2px at 22% 86%,#fff,transparent),radial-gradient(1px 1px at 60% 40%,#fff,transparent);
}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(30px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.screen.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h1,h2{font-family:var(--disp);font-weight:600;margin:0;text-align:center;letter-spacing:2px}

/* ================= Кнопки ================= */
.b3{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;min-width:54px;height:52px;padding:0 14px;border-radius:16px;color:#fff;
  font:800 20px var(--font);cursor:pointer;border:1px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .12s,box-shadow .12s,background .2s}
.b3:active{transform:scale(.94)}
.b3.green{border-color:transparent;background:linear-gradient(135deg,#3be8b0,#1aa7d9);box-shadow:0 8px 22px rgba(26,200,200,.35),inset 0 1px 0 rgba(255,255,255,.45);color:#04302f}
.b3.gold{border-color:transparent;background:linear-gradient(135deg,#ffc371,#ff7a59);box-shadow:0 8px 22px rgba(255,140,80,.35),inset 0 1px 0 rgba(255,255,255,.45);color:#3d1500}
.b3.red{border-color:transparent;background:linear-gradient(135deg,#ff6b9a,#e0325a);box-shadow:0 8px 22px rgba(240,60,100,.38),inset 0 1px 0 rgba(255,255,255,.4)}
.b3.hero{border-color:transparent;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 10px 30px hsl(var(--h) 90% 55% / .5),inset 0 1px 0 rgba(255,255,255,.5)}
.b3:disabled{filter:grayscale(.8) brightness(.7);pointer-events:none}
.b3 b{font-weight:800}
.head{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.head h1{font-size:34px;background:linear-gradient(90deg,#fff,var(--aS) 50%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px hsl(var(--h) 90% 60% / .55))}
.chip{display:flex;align-items:center;gap:6px;padding:0 14px;height:38px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font:800 16px var(--font);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip small{font:700 13px var(--font);opacity:.75}
.lab{margin:26px 0 0;font:700 13px var(--font);letter-spacing:3px;text-transform:uppercase;opacity:.65}
#cont{margin-top:14px;min-width:260px;height:56px;font-size:18px}
#lvl{margin-top:26px;width:100%;max-width:340px;height:92px;flex-direction:column;gap:2px;font-size:30px;border-radius:24px}
#lvl small{font:700 13px var(--font);opacity:.85;letter-spacing:1px}
#diffs{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:14px}
#diffs .b3{height:58px;font-size:20px;justify-content:space-between;padding:0 22px}
#diffs small{font:700 13px var(--font);opacity:.8}
#wins{margin-top:22px;font:700 14px var(--font);opacity:.6;letter-spacing:1px}
.bar{width:100%;max-width:460px;display:flex;align-items:center;gap:8px;flex:none;margin-top:34px}.sp{flex:1}
.info{display:flex;gap:8px;margin-top:12px;flex:none}
.mid{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}

/* ================= Поле ================= */
#grid{--bs:min(calc(100vw - 28px),460px,calc(100vh - 390px));--bs:min(calc(100vw - 28px),460px,calc(100dvh - 390px));
  width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);padding:5px;border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);
  box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 60px hsl(var(--h) 90% 55% / .22),inset 0 1px 0 rgba(255,255,255,.25);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .2s}
.cell{position:relative;display:flex;align-items:center;justify-content:center;background:rgba(10,10,32,.55);
  border:0 solid rgba(255,255,255,.1);border-width:0 1px 1px 0;font:700 calc(var(--bs)/9*.58) var(--font);color:var(--aS);cursor:pointer;overflow:hidden;transition:background .15s}
.cell.c3{border-right:2px solid hsl(var(--h) 90% 75% / .55)}
.cell.r3{border-bottom:2px solid hsl(var(--h) 90% 75% / .55)}
.cell:nth-child(9n){border-right-width:0}.cell:nth-child(n+73){border-bottom-width:0}
.cell:nth-child(1){border-top-left-radius:17px}.cell:nth-child(9){border-top-right-radius:17px}.cell:nth-child(73){border-bottom-left-radius:17px}.cell:nth-child(81){border-bottom-right-radius:17px}
.cell.g{color:#fff;font-weight:800}
.cell.hl{background:rgba(255,255,255,.1)}
.cell.same{background:hsl(var(--h) 90% 60% / .32)}
.cell.sel{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 18px hsl(var(--h) 90% 60% / .7);z-index:1}
.cell.err{color:#ff7a90;background:rgba(255,60,90,.22)}
.cell.err.sel{background:linear-gradient(135deg,#ff5a7a,#c92a50);color:#fff}
.nt{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);font:700 calc(var(--bs)/9*.24) var(--font);color:rgba(255,255,255,.6);line-height:1}
.nt i{font-style:normal;display:flex;align-items:center;justify-content:center}
.tools{display:flex;gap:8px;width:100%;max-width:460px;flex:none;margin-top:12px}.tools .b3{flex:1;padding:0}.tools .b3 b{font-size:18px}
#pad{display:flex;gap:5px;width:100%;max-width:460px;flex:none;margin-top:10px}
.num{flex:1;min-width:0;height:58px;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:800 26px/1 var(--font);color:#fff;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;transition:transform .1s,background .15s}
.num small{font:700 11px var(--font);opacity:.55;margin-top:4px}
.num:active{transform:scale(.92);background:linear-gradient(135deg,var(--a),var(--a2))}
.num:disabled{opacity:.25;pointer-events:none}
svg.st{width:12px;height:12px;fill:rgba(255,255,255,.2);stroke:none}

/* ================= Окна победы и поражения ================= */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,5,18,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:30;padding:20px}
.ov.on{display:flex}
.card{position:relative;width:100%;max-width:340px;padding:48px 20px 22px;text-align:center;border-radius:28px;
  background:linear-gradient(160deg,hsl(var(--h) 45% 20% / .95),hsl(calc(var(--h) + 40) 50% 12% / .95));border:1px solid rgba(255,255,255,.25);
  box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 60px hsl(var(--h) 90% 55% / .3),inset 0 1px 0 rgba(255,255,255,.3);animation:rise .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:scale(.7);opacity:0}}
.ribbon{position:absolute;left:50%;top:-24px;transform:translateX(-50%);padding:9px 26px;border-radius:99px;white-space:nowrap;font:600 17px var(--disp);letter-spacing:1px;color:#3d1500;
  background:linear-gradient(135deg,#ffd27a,#ff8a5c);box-shadow:0 10px 26px rgba(255,140,80,.45)}
#lose .ribbon{background:linear-gradient(135deg,#ff6b9a,#e0325a);color:#fff;box-shadow:0 10px 26px rgba(240,60,100,.45)}
#wstars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
#wstars svg{width:64px;height:64px;transform:scale(0);animation:pop .55s forwards;fill:rgba(255,255,255,.14);stroke:none}
#wstars svg.on{fill:#ffcf3a;filter:drop-shadow(0 0 14px #ffb300)}
@keyframes pop{60%{transform:scale(1.3)}100%{transform:scale(1)}}
.card p{margin:6px 0 18px;font-size:16px;font-weight:600;opacity:.9}
.card .row{display:flex;gap:12px;justify-content:center}.card .b3{font-size:18px;flex:1;max-width:140px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
</style>
</head>
<body>
<section class="screen on" id="sMenu">
  <div class="head"><div style="width:54px"></div><h1>SUDOKU</h1><button class="b3 snd" aria-label="Звук" style="min-width:54px;padding:0"></button></div>
  <button class="b3 hero" id="lvl"></button>
  <button class="b3 green" id="cont"></button>
  <div class="lab">Свободная игра</div>
  <div id="diffs"></div>
  <div id="wins"></div>
</section>
<section class="screen" id="sGame">
  <div class="bar"><button class="b3" id="menu" aria-label="Меню"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="sp"></div><button class="b3 snd" aria-label="Звук" style="min-width:54px;padding:0"></button></div>
  <div class="info"><div class="chip" id="df"></div><div class="chip" title="Ошибки"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px;fill:#ff5470;stroke:none"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.800-8 11-8 11z"/></svg><span id="mi"></span></div><div class="chip" id="tm"></div></div>
  <div class="mid"><div id="grid"></div></div>
  <div class="tools">
    <button class="b3" id="undo" aria-label="Отмена"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12H9"/></svg></button>
    <button class="b3 nosnd" id="erase" aria-label="Стереть"><svg class="i" viewBox="0 0 24 24"><path d="M4 15l8-9 8 6-6 7H8z"/><path d="M10 19h10"/></svg></button>
    <button class="b3" id="notes" aria-label="Заметки"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg></button>
    <button class="b3" id="hint" aria-label="Подсказка"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg><b id="hc"></b></button>
  </div>
  <div id="pad"></div>
</section>
<div class="ov" id="win"><div class="card"><div class="ribbon">ПОБЕДА!</div><div id="wstars"></div><p id="wtext"></p>
  <div class="row"><button class="b3" id="wlist">Меню</button><button class="b3 green" id="wnext">Ещё</button></div></div></div>
<div class="ov" id="lose"><div class="card"><div class="ribbon">НЕ ВЫШЛО</div><p id="ltext" style="margin-top:14px"></p>
  <div class="row"><button class="b3" id="llist">Меню</button><button class="b3 red" id="lretry">Заново</button></div></div></div>
<canvas id="fx"></canvas>

/* Решатель: считает решения (до lim) методом перебора с выбором клетки с минимумом кандидатов */
function solve(g, lim, rnd){
  const r = Array(9).fill(0), c = Array(9).fill(0), b = Array(9).fill(0);
  for(let i = 0; i < 81; i++) if(g[i]){ const m = 1 << g[i]; r[i / 9 | 0] |= m; c[i % 9] |= m; b[BX[i]] |= m; }
  let n = 0;
  (function go(){
    let bi = -1, bm = 0, bc = 10;
    for(let i = 0; i < 81; i++) if(!g[i]){
      const m = ~(r[i / 9 | 0] | c[i % 9] | b[BX[i]]) & 1022; let k = 0; for(let x = m; x; x &= x - 1) k++;
      if(k < bc){ bc = k; bi = i; bm = m; if(k < 2) break; }
    }
    if(bi < 0){ if(++n === 1) SOL = g.slice(); return; }
    const R = bi / 9 | 0, C = bi % 9, B = BX[bi];
    for(const d of rnd ? shuf([1,2,3,4,5,6,7,8,9]) : [1,2,3,4,5,6,7,8,9]){
      if(n >= lim) return; const m = 1 << d; if(!(bm & m)) continue;
      g[bi] = d; r[R] |= m; c[C] |= m; b[B] |= m; go(); g[bi] = 0; r[R] &= ~m; c[C] &= ~m; b[B] &= ~m;
    }
  })();
  return n;
}
/* Генерация: полная сетка → убираем клетки, пока решение остаётся единственным */
function make(d, clues){
  solve(Array(81).fill(0), 1, true);
  const sol = SOL, puz = sol.slice(); let left = 81;
  for(const i of shuf([...Array(81).keys()])){
    if(left <= (clues || DIFF[d][1])) break;
    const v = puz[i]; puz[i] = 0;
    if(solve(puz.slice(), 2) !== 1) puz[i] = v; else left--;
  }
  return { d, puz, sol, val: puz.slice(), notes: Array(81).fill(0), mist: 0, hints: 0, time: 0, over: false };
}
const $ = s => document.querySelector(s), grid = $('#grid'), pad = $('#pad');
const MAXERR = 3, MAXHINT = 3, fmt = t => (t / 60 | 0) + ':' + String(t % 60).padStart(2, '0');
let S = { game: null, best: {}, wins: 0, level: 1 }, G = null, sel = -1, notesOn = false, UN = [], muted = false;
try { Object.assign(S, JSON.parse(localStorage.getItem('sudoku') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('sudoku', JSON.stringify(S)); } catch (e) {} };

/* ---------- ЗВУКИ: click / erase / error / win — ваши mp3 ---------- */
const SND = {}; for(const k in AUD){ SND[k] = new Audio(AUD[k]); SND[k].preload = 'auto'; }
const play = (n, v = 1) => { if(muted) return; const a = SND[n].cloneNode(); a.volume = v; a.play().catch(() => {}); };
const SPK = ['<svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/></svg>', '<svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>'];
const setSnd = () => document.querySelectorAll('.snd').forEach(b => b.innerHTML = SPK[muted ? 1 : 0]);
document.querySelectorAll('.snd').forEach(b => b.onclick = () => { muted = !muted; setSnd(); play('click'); });
document.addEventListener('click', e => { const b = e.target.closest('button'); if(b && !b.matches('.nosnd,.snd')) play('click'); }, true);

/* ---------- поле и кнопки ---------- */
const BASE = Array.from({ length: 81 }, (_, i) => 'cell' + (i % 9 % 3 === 2 && i % 9 < 8 ? ' c3' : '') + ((i / 9 | 0) % 3 === 2 && i < 72 ? ' r3' : ''));
for(let i = 0; i < 81; i++){ const c = document.createElement('div'); c.dataset.i = i; grid.append(c); }
grid.onclick = e => { const c = e.target.closest('[data-i]'); if(c){ sel = +c.dataset.i; play('click', .7); draw(); } };
for(let d = 1; d <= 9; d++){ const b = document.createElement('button'); b.className = 'num nosnd'; b.innerHTML = d + '<small></small>'; b.onclick = () => put(d); pad.append(b); }
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
const STAR = on => `<svg class="st${on ? ' on' : ''}" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>`;

function draw(){
  const v = G.val, sv = sel >= 0 ? v[sel] : 0, near = sel >= 0 ? PEERS[sel] : [];
  for(let i = 0; i < 81; i++){
    const c = grid.children[i], x = v[i];
    let cl = BASE[i];
    if(G.puz[i]) cl += ' g'; else if(x && x !== G.sol[i]) cl += ' err';
    if(i === sel) cl += ' sel'; else if(sv && x === sv) cl += ' same'; else if(near.includes(i)) cl += ' hl';
    const h = x ? x : G.notes[i] ? '<b class="nt">' + [1,2,3,4,5,6,7,8,9].map(d => '<i>' + (G.notes[i] & 1 << d ? d : '') + '</i>').join('') + '</b>' : '';
    c.className = cl; if(c._h !== h){ c.innerHTML = h; c._h = h; }
  }
  [...pad.children].forEach((b, k) => { const left = 9 - v.filter((x, i) => x === k + 1 && G.sol[i] === k + 1).length; b.disabled = left <= 0; b.lastChild.textContent = left; });
  $('#mi').textContent = G.mist + '/' + MAXERR; $('#tm').textContent = fmt(G.time); $('#df').textContent = G.lvl ? 'Уровень ' + G.lvl : DIFF[G.d][0];
  $('#hc').textContent = MAXHINT - G.hints; $('#hint').disabled = G.hints >= MAXHINT; $('#notes').classList.toggle('green', notesOn); $('#undo').disabled = !UN.length;
}
const snap = () => { UN.push(JSON.stringify([G.val, G.notes])); if(UN.length > 60) UN.shift(); };
function clearPeers(i, n){ PEERS[i].forEach(p => G.notes[p] &= ~(1 << n)); }
function after(){
  draw(); persist();
  if(G.mist >= MAXERR) return lose();
  if(G.val.every((x, i) => x === G.sol[i])) win();
}
function put(n){
  if(G.over || sel < 0 || G.puz[sel] || G.val[sel] === G.sol[sel]) return;
  if(notesOn && G.val[sel]) return;
  snap();
  if(notesOn){ G.notes[sel] ^= 1 << n; play('click', .7); }
  else {
    G.val[sel] = n; G.notes[sel] = 0;
    if(n !== G.sol[sel]){ G.mist++; play('err'); } else { clearPeers(sel, n); play('click'); }
  }
  after();
}
$('#erase').onclick = () => {
  if(G.over || sel < 0 || G.puz[sel] || G.val[sel] === G.sol[sel] || (!G.val[sel] && !G.notes[sel])) return;
  snap(); G.val[sel] = 0; G.notes[sel] = 0; play('erase'); after();
};
$('#undo').onclick = () => { if(G.over || !UN.length) return; [G.val, G.notes] = JSON.parse(UN.pop()); draw(); persist(); };
$('#notes').onclick = () => { notesOn = !notesOn; draw(); };
$('#hint').onclick = () => {
  if(G.over || G.hints >= MAXHINT) return;
  let i = sel;
  if(i < 0 || G.val[i] === G.sol[i]){ const c = [...Array(81).keys()].filter(k => G.val[k] !== G.sol[k]); if(!c.length) return; i = c[Math.random() * c.length | 0]; }
  snap(); sel = i; G.val[i] = G.sol[i]; G.notes[i] = 0; clearPeers(i, G.sol[i]); G.hints++; after();
};

/* ---------- меню, игра, победа, поражение ---------- */
function drawMenu(){
  $('#cont').style.display = S.game ? '' : 'none';
  if(S.game) $('#cont').textContent = 'Продолжить · ' + (S.game.lvl ? 'Уровень ' + S.game.lvl : DIFF[S.game.d][0]) + ' ' + fmt(S.game.time);
  $('#lvl').innerHTML = 'Уровень ' + S.level + '<small>КАЖДЫЙ УРОВЕНЬ — НОВАЯ ГОЛОВОЛОМКА</small>';
  $('#diffs').innerHTML = '';
  Object.keys(DIFF).forEach((d, k) => {
    const b = document.createElement('button'); b.className = 'b3 ' + ['green', '', 'gold', 'red'][k];
    b.innerHTML = '<span>' + DIFF[d][0] + '</span><small>' + (S.best[d] ? 'рекорд ' + fmt(S.best[d]) : '') + '</small>'; b.onclick = () => start(d); $('#diffs').append(b);
  });
  $('#wins').textContent = 'Побед: ' + S.wins;
}
function open(){ document.documentElement.style.setProperty('--h', G.hue == null ? 265 : G.hue); sel = -1; UN = []; $('#win').classList.remove('on'); $('#lose').classList.remove('on'); show('sGame'); draw(); }
const lvClues = n => Math.max(24, Math.round(46 - (n - 1) * 1.15));
const lvTier = n => n <= 6 ? 'easy' : n <= 12 ? 'med' : n <= 18 ? 'hard' : 'pro';
function begin(mk){ show('sGame'); grid.style.opacity = .3; setTimeout(() => { G = mk(); G.hue = Math.random() * 360 | 0; S.game = G; persist(); grid.style.opacity = ''; open(); }, 30); }
function start(d){ begin(() => make(d)); }
function startLevel(n){ begin(() => Object.assign(make(lvTier(n), lvClues(n)), { lvl: n })); }
$('#lvl').onclick = () => startLevel(S.level);
$('#cont').onclick = () => { G = S.game; open(); };
const toMenu = () => { $('#win').classList.remove('on'); $('#lose').classList.remove('on'); drawMenu(); show('sMenu'); };
$('#menu').onclick = $('#wlist').onclick = $('#llist').onclick = () => { if(G) persist(); toMenu(); };
$('#wnext').onclick = () => G.lvl ? startLevel(S.level) : start(G.d);
$('#lretry').onclick = () => { Object.assign(G, { val: G.puz.slice(), notes: Array(81).fill(0), mist: 0, hints: 0, time: 0, over: false }); S.game = G; persist(); open(); };
function confetti(){
  const c = $('#fx'), g = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; const K = ['#ff4f78', '#43cfff', '#6fe04f', '#ffd93d', '#ff9638', '#a66bff'];
  const P = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: Math.random() * 2 - 1, vy: 2.5 + Math.random() * 4, r: 3 + Math.random() * 5, a: Math.random() * 6, va: Math.random() * .3 - .15, c: K[Math.random() * 6 | 0] }));
  let f = 0; (function an(){ g.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += p.va; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); }); if(++f < 210) requestAnimationFrame(an); else g.clearRect(0, 0, c.width, c.height); })();
}
function win(){
  G.over = true; S.game = null; S.wins++; if(G.lvl) S.level = Math.max(S.level, G.lvl + 1); if(!S.best[G.d] || G.time < S.best[G.d]) S.best[G.d] = G.time; persist(); play('win');
  const st = !G.mist && !G.hints ? 3 : G.mist + G.hints <= 2 ? 2 : 1;
  $('#wstars').innerHTML = [0, 1, 2].map(k => STAR(k < st).replace('<svg', `<svg style="animation-delay:${.35 + k * .25}s"`)).join('');
  $('#wtext').textContent = (G.lvl ? 'Уровень ' + G.lvl : DIFF[G.d][0]) + ' · время ' + fmt(G.time) + ' · ошибок ' + G.mist;
  setTimeout(() => { $('#win').classList.add('on'); confetti(); }, 450);
}
function lose(){ G.over = true; S.game = null; persist(); $('#ltext').textContent = 'Три ошибки — попробуй ещё раз'; setTimeout(() => $('#lose').classList.add('on'), 500); }
setInterval(() => { if(G && !G.over && $('#sGame').classList.contains('on')){ G.time++; $('#tm').textContent = fmt(G.time); if(G.time % 5 === 0) persist(); } }, 1000);
document.addEventListener('visibilitychange', () => { if(G && !G.over && S.game) persist(); });
G = S.game; setSnd(); drawMenu();
})();
</script>
</body>
</html>
