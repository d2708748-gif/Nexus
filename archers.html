<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дуэль лучников</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc83d;--navy:#08142e;--font:"Russo One","Arial Black",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#05102a;color:#fff;font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
b[data-ic]{display:flex}
/* ---- общие элементы ---- */
.pl{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 8px;border-radius:12px;background:rgba(8,20,50,.7);border:1px solid rgba(120,160,255,.25);font-size:18px}
.pl em{font-style:normal}
.ib{width:46px;height:46px;border-radius:14px;border:1px solid rgba(120,160,255,.35);background:rgba(40,60,140,.75);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib.big{width:74px;height:74px;border-radius:18px;background:linear-gradient(#4a4fe0,#2b2fa8);box-shadow:0 5px 0 #171a6a}
.ib.big svg.i{width:36px;height:36px}
.btn{padding:14px 36px;border:0;border-radius:20px;font:22px var(--font);color:#fff;cursor:pointer;background:linear-gradient(#8dff6a,#35c93a);box-shadow:0 6px 0 #1f8a2a,0 12px 26px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,80,0,.5)}
.btn:active,.ib:active{transform:translateY(3px)}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#hud #hHome{position:absolute;left:calc(10px + env(safe-area-inset-left));top:8px}
.bars{position:absolute;left:calc(66px + env(safe-area-inset-left));top:8px;display:flex;flex-direction:column;gap:6px;width:min(240px,32vw);pointer-events:none}
.bar{display:flex;align-items:center;gap:6px}
.bar .tr{flex:1;height:12px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.bar .tr i{display:block;height:100%;width:100%;transition:width .15s}
.bar span{font-size:12px;min-width:30px}
.stats{position:absolute;right:calc(10px + env(safe-area-inset-right));top:8px;display:flex;gap:8px;pointer-events:none}
#tri{position:absolute;left:calc(10px + env(safe-area-inset-left));top:46%;width:70px;padding:6px 4px;border-radius:14px;border:1px solid rgba(120,160,255,.4);background:rgba(10,40,70,.8);color:#fff;font:13px var(--font);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#tri svg.i{width:34px;height:34px;color:#ffc27a}
#tri small{display:flex;align-items:center;gap:3px;font-size:13px}
#tri small svg.i{width:14px;height:14px}
#tri:disabled{opacity:.45}
#tri.on{box-shadow:0 0 16px #4ef;border-color:#4ef}
.sel{display:flex;gap:6px}
.sb{position:relative;flex:1;min-width:0;height:54px;border-radius:12px;border:1px solid rgba(150,180,255,.25);background:rgba(255,255,255,.06);color:#fff;font:10px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer;gap:2px;transition:.15s}
.sb.on{background:linear-gradient(160deg,rgba(60,190,255,.35),rgba(40,90,200,.35));border-color:#6fe3ff;box-shadow:0 0 16px rgba(90,220,255,.55)}
.sb.lk{opacity:.7}
.sb svg.i{width:24px;height:24px}.sb small{font-size:11px;display:flex;align-items:center;gap:2px}.sb small svg.i{width:12px;height:12px}
.sb .lb{letter-spacing:.3px}
#hud #sel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom))}
#hud .sb{width:52px;flex:none;height:50px;background:rgba(10,30,70,.75);backdrop-filter:blur(4px)}
#hud .lb{display:none}
/* ---- меню и экран поражения ---- */
.ov{position:fixed;inset:0;display:flex;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left))}
.glass{background:linear-gradient(160deg,rgba(28,48,112,.8),rgba(8,16,46,.88));border:1px solid rgba(150,180,255,.22);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.09);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#menu{align-items:stretch;justify-content:space-between;gap:10px;background:linear-gradient(90deg,rgba(2,6,20,.55),rgba(2,6,20,0) 34%,rgba(2,6,20,0) 66%,rgba(2,6,20,.55))}
.shop{width:min(272px,37vw);padding:10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:2px}
.hd h2,.card h2{margin:0;font:17px var(--font);letter-spacing:.5px}
.hd .pl{font-size:15px;padding:3px 10px 3px 6px}
.srow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.ibx{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;flex:none}
.srow .mid{flex:1;font-size:12px;min-width:0}
.pips{display:flex;gap:2px;margin-top:4px}
.pips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.pips i.on{background:linear-gradient(90deg,#ffd75e,#ff9d2e);box-shadow:0 0 6px rgba(255,180,60,.5)}
.buy{display:flex;align-items:center;gap:4px;min-width:66px;justify-content:center;padding:7px 8px;border:0;border-radius:10px;font:13px var(--font);color:#2a1a00;background:linear-gradient(#ffe27a,#f2a81d);box-shadow:0 3px 0 #a86a0c;cursor:pointer}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #a86a0c}
.buy svg.i{width:15px;height:15px}
.buy:disabled{filter:grayscale(.9) brightness(.65);box-shadow:none}
.side{width:min(272px,37vw);display:flex;flex-direction:column;justify-content:center;gap:8px}
.logo{margin:0;text-align:center;font:clamp(20px,6vh,30px)/1.05 var(--font);background:linear-gradient(#fff3b8,#ffb52e 60%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.loc{display:flex;align-items:center;gap:6px;padding:6px}
.loc .ar{width:34px;height:40px;border-radius:10px;border:1px solid rgba(150,180,255,.3);background:rgba(255,255,255,.07);color:#fff;font:20px var(--font);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none}
.loc .ar:active{background:rgba(255,255,255,.18)}
.loc .tx{flex:1;text-align:center;min-width:0}
.loc .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .ds{font-size:10.5px;color:#9fb6ff;margin-top:2px}
.dots{display:flex;gap:4px;justify-content:center;margin-top:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22)}
.dots i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
#sel2{padding:6px}
.stars{display:flex;gap:8px}.stars svg{width:46px;height:46px}
.skulls{display:flex;gap:3px;justify-content:center;margin-top:5px}.skulls svg{width:15px;height:15px}.skulls .off{opacity:.22}
.dots i{width:7px!important;height:7px!important}.dots i.cur{background:#fff;box-shadow:0 0 6px #fff}
.btn.play{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 0;font-size:20px;letter-spacing:.5px}
.btn.play svg.i{width:22px;height:22px}
#over,#lw{align-items:center;justify-content:center;background:rgba(3,8,24,.7)}
.card{padding:22px 34px;border-radius:22px;background:linear-gradient(#10224f,#08142e);border:1px solid rgba(120,160,255,.35);display:flex;flex-direction:column;align-items:center;gap:12px}
.card h2{font-size:34px;color:#ff4d6d;text-shadow:0 0 22px rgba(255,60,90,.6)}
.card .stl{display:flex;gap:10px}
.card .row{display:flex;gap:16px;margin-top:6px}
#rot{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#05102a;text-align:center;font-size:20px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- HUD боя -->
<div id="hud" hidden>
  <button class="ib" id="hHome" aria-label="Меню"><b data-ic="home"></b></button>
  <div class="bars">
    <div class="bar"><b data-ic="heart"></b><div class="tr"><i id="hpF" style="background:#34e07a"></i></div><span id="hpT"></span></div>
    <div class="bar"><b data-ic="bolt"></b><div class="tr"><i id="chF" style="background:#e040c8"></i></div></div>
  </div>
  <div class="stats">
    <span class="pl"><b data-ic="flag"></b><em id="lvT">1</em></span>
    <span class="pl"><b data-ic="skull"></b><em id="kT">0</em></span>
    <span class="pl"><b data-ic="target"></b><em id="hT">0</em></span>
    <span class="pl"><b data-ic="coin"></b><em id="cT">0</em></span>
  </div>
  <div class="sel" id="sel"></div>
  <button id="tri"><b data-ic="arrows"></b><span id="triT">x3</span><small><b data-ic="coin"></b>500</small></button>
</div>

<!-- Меню: улучшения слева, локация / стрелы / старт справа -->
<div class="ov" id="menu">
  <div class="shop glass">
    <div class="hd"><h2>Улучшения</h2><span class="pl"><b data-ic="coin"></b><em id="mC"></em></span></div>
    <div id="rows"></div>
  </div>
  <div class="side">
    <h1 class="logo">Дуэль<br>лучников</h1>
    <div class="loc glass">
      <div class="tx"><div class="nm" id="lvN"></div><div class="ds" id="lvD"></div><div class="skulls" id="lvS"></div><div class="dots" id="lvDots"></div></div>
    </div>
    <div class="sel glass" id="sel2"></div>
    <button class="btn play" id="bPlay"><b data-ic="play"></b>Играть</button>
  </div>
</div>

<!-- Экран поражения -->
<div class="ov" id="over" hidden>
  <div class="card">
    <h2>Поражение</h2>
    <div class="stl">
      <span class="pl"><b data-ic="skull"></b><em id="oK"></em></span>
      <span class="pl"><b data-ic="target"></b><em id="oH"></em></span>
      <span class="pl"><b data-ic="coin"></b><em id="oC"></em></span>
    </div>
    <div class="row"><button class="ib big" id="oHome" aria-label="Меню"><b data-ic="home"></b></button><button class="ib big" id="oRetry" aria-label="Заново"><b data-ic="redo"></b></button></div>
  </div>
</div>

<!-- Уровень пройден -->
<div class="ov" id="lw" hidden>
  <div class="card">
    <h2 style="color:#7dffb0;text-shadow:0 0 22px rgba(80,255,150,.5)">Уровень пройден</h2>
    <div class="stars" id="lwS"></div>
    <div class="stl"><span class="pl"><b data-ic="skull"></b><em id="lwK"></em></span><span class="pl"><b data-ic="coin"></b><em id="lwC"></em></span></div>
    <div class="row"><button class="ib big" id="lwHome" aria-label="Меню"><b data-ic="home"></b></button><button class="ib big" id="lwNext" aria-label="Дальше"><b data-ic="play"></b></button></div>
  </div>
</div>

<div id="rot"><svg class="i" viewBox="0 0 24 24" style="width:64px;height:64px"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M20 8a9 9 0 01-3 11"/></svg>Поверните телефон горизонтально</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), cv = $('cv'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const WW = 1280, WH = 600, G = 1100, AK = .55;   // AK — замедление полёта стрел (траектория та же, летят дольше)               // размеры мира и гравитация (px/с²)

/* ===================== Иконки (рисованные SVG) ===================== */
const IC = {
  coin: '<circle cx="12" cy="12" r="9" fill="#ffc83d" stroke="#b9831a"/><circle cx="12" cy="12" r="5.5" stroke="#b9831a"/>',
  heart: '<path d="M12 21s-8-5.2-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.8-8 11-8 11z" fill="#ff4d6d" stroke="none"/>',
  bolt: '<path d="M13 2L5 14h6l-1 8 8-12h-6z" fill="#e040c8" stroke="none"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="#25c78a" stroke="none"/>',
  target: '<circle cx="12" cy="12" r="9" fill="#ff5d73" stroke="none"/><circle cx="12" cy="12" r="5.5" fill="#fff" stroke="none"/><circle cx="12" cy="12" r="2.5" fill="#ff5d73" stroke="none"/>',
  skull: '<path d="M12 3a8 8 0 00-5 14v3h10v-3a8 8 0 00-5-14z" fill="#eaf0ff" stroke="none"/><circle cx="9" cy="12" r="2" fill="#0a1430" stroke="none"/><circle cx="15" cy="12" r="2" fill="#0a1430" stroke="none"/>',
  arrows: '<path d="M12 21V5M12 5l-3 3M12 5l3 3M6 20l2-12M6 8L3 11M6 8l3 2M18 20l-2-12M18 8l-3 2M18 8l3 3"/>',
  home: '<path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z" fill="#fff" stroke="none"/>',
  star: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.4 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z" fill="#ffc83d" stroke="#b9831a" stroke-width="1.2"/>',
  starOff: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.4 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z" fill="rgba(255,255,255,.1)" stroke="#6b7aa8" stroke-width="1.2"/>',
  flag: '<path d="M6 21V4" stroke="#6ef"/><path d="M6 4h12l-3 4.5 3 4.5H6z" fill="#6ef" stroke="none"/>',
  play: '<path d="M7 4l13 8-13 8z" fill="#fff" stroke="none"/>',
  fire: '<path d="M12 2c1 4 6 6 6 12a6 6 0 01-12 0c0-3 2-4 3-7 1 1 1 2 2 3 1-2 1-5 1-8z" fill="#ff8a1f" stroke="#ffd23f" stroke-width="1.2"/>',
  zap: '<path d="M13 2L5 14h6l-1 8 8-12h-6z" fill="#4ee" stroke="none"/>',
  bomb: '<circle cx="11" cy="14" r="7" fill="#2a2f45" stroke="#9aa7d9"/><path d="M15 8l3-3M18 5l2-1" stroke="#ffc83d"/>',
  norm: '<path d="M3 12h15M18 12l-4-4M18 12l-4 4" stroke="#ffb35c"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2" fill="#ffc83d" stroke="none"/><path d="M8 11V8a4 4 0 018 0v3" stroke="#ffc83d"/>',
  redo: '<path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5" stroke-width="3"/>'
};
const ico = n => '<svg class="i" viewBox="0 0 24 24">' + IC[n] + '</svg>';
document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = ico(e.dataset.ic));

/* ===================== Сохранение и улучшения ===================== */
const D = {coins: 500, tk: 0, arrow: 'norm', lvl: 1, stars: {}, up: {dmg: 0, hp: 0, pow: 0, arm: 0}};
try{ Object.assign(D, JSON.parse(localStorage.getItem('archers') || '{}')); }catch(e){}
D.up = Object.assign({dmg: 0, hp: 0, pow: 0, arm: 0}, D.up);
const save = () => { try{ localStorage.setItem('archers', JSON.stringify(D)); }catch(e){} };
const UPS = [{k: 'dmg', n: 'Урон стрелы', ic: 'target'}, {k: 'hp', n: 'Здоровье', ic: 'heart'}, {k: 'pow', n: 'Сила руки', ic: 'bolt'}, {k: 'arm', n: 'Броня', ic: 'shield'}];
/* характеристики игрока с учётом уровней улучшений */
const stats = () => ({dmg: 20 + D.up.dmg * 5, hp: 100 + D.up.hp * 20, v: 1000 + D.up.pow * 35, reload: 1.5 - D.up.pow * .05, armor: D.up.arm * .03});

/* типы стрел: открываются по числу убитых ботов (need), spd — скорость, dm — урон, rl — перезарядка */
const ARN = {norm: 'Обычная', fire: 'Огонь', elec: 'Ток', bomb: 'Бомба'};
const ARW = {norm: {ic: 'norm', need: 0, spd: 1, dm: 1, rl: 1}, fire: {ic: 'fire', need: 22, spd: 1, dm: 1, rl: 1.2}, elec: {ic: 'zap', need: 42, spd: 1.15, dm: 1.3, rl: 1.3}, bomb: {ic: 'bomb', need: 122, spd: .85, dm: 1, rl: 2}};
function buildSel(){
  if(!ARW[D.arrow] || D.tk < ARW[D.arrow].need) D.arrow = 'norm';
  ['sel', 'sel2'].forEach(id => { const el = document.getElementById(id); if(!el) return; el.innerHTML = '';
    Object.keys(ARW).forEach(k => { const a = ARW[k], lk = D.tk < a.need, b = document.createElement('button');
      b.className = 'sb' + (lk ? ' lk' : '') + (D.arrow === k ? ' on' : '');
      b.innerHTML = lk ? ico('lock') + '<small>' + ico('skull') + a.need + '</small>' : ico(a.ic) + '<span class="lb">' + ARN[k] + '</span>';
      b.onclick = () => { if(lk) return; D.arrow = k; save(); buildSel(); }; el.append(b); }); });
}

/* ===================== Локации ===================== */
/* px/py — позиция игрока; bx/by — диапазон позиции бота (даёт дистанцию и перепад высот); iw — ширина островов; obs — преграда между лучниками */
const LOCS = [
  {n: 'Закат в пустыне', px: 400, py: 450, bx: [820, 900], by: [440, 470], iw: 320,
    th: {sky: ['#2a1450', '#c2493a'], st: .5, orbs: [{x: .5, y: .62, r: .13, c: '#ffcf7a', g: '255,170,80'}], hills: ['rgba(150,60,50,.8)', 'rgba(90,30,40,.95)'], prop: 'cacti', pc: 'rgba(40,12,30,.95)', fx: 'fly', fc: '#ffd9a0', isl: ['#9a5240', '#3a1428', '#d48a60']}},
  {n: 'Лунная ночь', px: 300, py: 450, bx: [930, 1030], by: [390, 480], iw: 300,
    th: {sky: ['#0d2250', '#050f28'], st: 1, orbs: [{x: .86, y: .2, r: .07, c: '#f6efc0', g: '255,240,170'}], hills: ['rgba(8,24,64,.75)', 'rgba(5,15,42,.9)'], prop: 'pines', pc: 'rgba(4,12,34,.95)', fx: 'fly', fc: '#d6ff7a', isl: ['#22458c', '#091a44', '#3b66c0']}},
  {n: 'Тропический остров', px: 330, py: 430, bx: [880, 960], by: [450, 500], iw: 280,
    th: {sky: ['#1a1650', '#2a9d9a'], st: .6, orbs: [{x: .3, y: .55, r: .09, c: '#ffd27a', g: '255,200,100'}], hills: ['rgba(10,70,80,.7)', 'rgba(6,45,60,.9)'], prop: 'palms', pc: 'rgba(4,28,40,.95)', sea: 'rgba(20,130,150,.55)', fx: 'fly', fc: '#fff3a0', isl: ['#1f7a7a', '#07323a', '#3fc7a0']}},
  {n: 'Ледяные горы', px: 260, py: 450, bx: [940, 1010], by: [420, 470], iw: 230,
    th: {sky: ['#0a2a52', '#16487a'], st: .8, orbs: [{x: .18, y: .2, r: .05, c: '#e6f4ff', g: '170,210,255'}], hills: ['rgba(150,190,230,.3)', 'rgba(90,130,180,.5)'], prop: 'peaks', pc: '', fx: 'snow', fc: '#fff', isl: ['#7fb2e0', '#2a5a8c', '#d8f0ff']}},
  {n: 'Неоновый город', px: 220, py: 460, bx: [880, 940], by: [330, 360], iw: 240,
    th: {sky: ['#1a0a40', '#4a0a62'], st: .6, orbs: [{x: .8, y: .2, r: .06, c: '#ffd0f0', g: '255,120,220'}], hills: ['rgba(20,8,50,.6)', 'rgba(10,4,34,.7)'], prop: 'city', pc: 'rgba(8,4,28,.96)', fx: 'fly', fc: '#6ef', isl: ['#3a2a8c', '#120a40', '#8a5aff']}},

let AC = null, NB = null;
function au(){

    NB = AC.createBuffer(1, AC.sampleRate * .4, AC.sampleRate); const d = NB.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  if(AC.state === 'suspended') AC.resume(); return AC;
}
const env = (g, t, p, d) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(p, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d); };
function tone(ty, f0, f1, d, p, dl = 0){ const t = AC.currentTime + dl, o = AC.createOscillator(), g = AC.createGain(); o.type = ty;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d); env(g, t, p, d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); }
function nz(ty, f0, f1, d, p){ const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NB; f.type = ty;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d); env(g, t, p, d); s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + d + .02); }

function loadMp3(){
  if(!AC || loadMp3.done) return; loadMp3.done = true;
  Object.keys(MP3).forEach(k => { try{

  }catch(e){} });
}
function playBuf(k, vol){ const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = BUF[k]; g.gain.value = vol; s.connect(g).connect(AC.destination); s.start(); }

/* ===================== Состояние ===================== */
let CW, CH, DPR, state = 'menu', t = 0, run = 0;
let player, bot, arrows = [], sticks = [], parts = [], pops = [];
let round = 1, kills = 0, heads = 0, earned = 0, tripleT = 0, drag = null;
let stars = [], flies = [], rings = [], zaps = [], lvl = 1, wave = 1, waves = 3;
const dummyStats = {hp: 100};

function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2); CW = innerWidth; CH = innerHeight;
  cv.width = CW * DPR; cv.height = CH * DPR;
  stars = Array.from({length: 60}, () => ({x: Math.random(), y: Math.random() * .6, p: rnd(0, TAU)}));
  flies = Array.from({length: 36}, () => ({x: Math.random(), y: rnd(.2, .9), p: rnd(0, TAU), s: rnd(.4, 1)}));
}
addEventListener('resize', resize); resize();
/* Мир масштабируется под экран; в меню он уменьшен и прижат вправо (слева магазин) */
function view(){
  let sc = Math.min(CW / WW, CH / WH); if(state === 'menu') sc *= 1.1;
  return {sc, ox: (CW - WW * sc) / 2, oy: (CH - WH * sc) / 2};
}

/* ===================== Персонажи ===================== */
function mkFig(x, y, col, bow, hp, isBot){
  return {x, y, col, bow, hp, max: hp, isBot, dead: false, flinch: 0, dx: 0, dy: 0, idy: 0, vx: 0, vy: 0, rot: 0, spin: 0, born: 0,
    bob: rnd(0, 6), aimA: isBot ? Math.atan2(-.3, -.95) : -.3, draw: 0, reload: 0, cd: 1.4, shootT: 0, shot: null, stuck: []};
}
const baseY = f => f.y + f.idy;
const shoulder = f => ({x: f.x - (f.isBot ? -1 : 1) * f.flinch * 10, y: baseY(f) - 96});

function drawFig(f){
  const c = ctx, sd = f.isBot ? -1 : 1, lean = -f.flinch * 12 * sd, bob = Math.sin(t * 2 + f.bob) * 1.5;
  c.save(); c.translate(f.x, f.y + f.dy);
  if(f.dead){ c.translate(f.dx, 0); c.translate(0, -55); c.rotate(f.rot); c.translate(0, 55); }
  c.globalAlpha = Math.min(1, f.born);
  c.lineCap = c.lineJoin = 'round'; c.strokeStyle = c.fillStyle = f.col; c.shadowColor = f.col; c.shadowBlur = 14;
  const hip = -52 + bob, shx = lean * .8, shy = -96 + bob;
  c.lineWidth = 10; c.beginPath();                                   // ноги и туловище
  c.moveTo(-17, 0); c.lineTo(0, hip); c.lineTo(17, 0); c.moveTo(0, hip); c.lineTo(shx, shy); c.stroke();
  c.beginPath(); c.arc(shx + lean * .4, shy - 20, 15, 0, TAU); c.fill();   // голова
  c.shadowBlur = 0;
  const d = {x: Math.cos(f.aimA), y: Math.sin(f.aimA)}, pp = {x: -d.y, y: d.x};
  const hand = {x: shx + d.x * 38, y: shy + d.y * 38}, pull = 8 + f.draw * 28, nock = {x: hand.x - d.x * pull, y: hand.y - d.y * pull};
  c.lineWidth = 8; c.beginPath(); c.moveTo(shx, shy); c.lineTo(hand.x, hand.y); c.moveTo(shx, shy); c.lineTo(nock.x, nock.y); c.stroke();   // руки
  const t1 = {x: hand.x + pp.x * 44 - d.x * 6, y: hand.y + pp.y * 44 - d.y * 6}, t2 = {x: hand.x - pp.x * 44 - d.x * 6, y: hand.y - pp.y * 44 - d.y * 6};
  c.strokeStyle = f.bow; c.lineWidth = 4; c.beginPath(); c.moveTo(t1.x, t1.y);                  // лук
  c.quadraticCurveTo(hand.x + d.x * 26, hand.y + d.y * 26, t2.x, t2.y); c.stroke();
  c.strokeStyle = '#dfe8ff'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(t1.x, t1.y); c.lineTo(nock.x, nock.y); c.lineTo(t2.x, t2.y); c.stroke();   // тетива
  if(f.draw > .02 && !f.dead){                                                                    // стрела на тетиве
    c.strokeStyle = '#e8d9b0'; c.lineWidth = 3; c.beginPath(); c.moveTo(nock.x, nock.y); c.lineTo(hand.x + d.x * 14, hand.y + d.y * 14); c.stroke(); }
  if(f.stun > 0 && !f.dead){                                      // удар током: «рентген» со скелетом и разрядами
    c.save(); c.globalAlpha = (.65 + .35 * Math.sin(t * 40)) * Math.min(1, f.born); c.shadowColor = '#6ef'; c.shadowBlur = 12; c.lineCap = c.lineJoin = 'round';
    c.strokeStyle = 'rgba(8,26,56,.92)'; c.lineWidth = 11; c.beginPath(); c.moveTo(-17, 0); c.lineTo(0, hip); c.lineTo(17, 0); c.moveTo(0, hip); c.lineTo(shx, shy); c.stroke();
    c.strokeStyle = '#e8fbff'; c.lineWidth = 3; c.beginPath(); c.moveTo(-17, 0); c.lineTo(0, hip); c.lineTo(17, 0); c.moveTo(0, hip); c.lineTo(shx, shy); c.stroke();
    c.lineWidth = 2.5; for(let k = 0; k < 4; k++){ const q = .3 + k * .2, yy = hip + (shy - hip) * q, ww = 11 - k * 1.5; c.beginPath(); c.moveTo(shx * q - ww, yy); c.lineTo(shx * q + ww, yy); c.stroke(); }
    const hx = shx + lean * .4, hy = shy - 20; c.fillStyle = 'rgba(8,26,56,.95)'; c.beginPath(); c.arc(hx, hy, 15, 0, TAU); c.fill(); c.lineWidth = 2.5; c.stroke();
    c.fillStyle = '#e8fbff'; c.beginPath(); c.arc(hx - 5, hy - 2, 3.5, 0, TAU); c.arc(hx + 5, hy - 2, 3.5, 0, TAU); c.fill(); c.fillRect(hx - 5, hy + 6, 10, 3);
    c.strokeStyle = '#6ef'; c.lineWidth = 2; for(let k = 0; k < 4; k++) bolt(c, rnd(-34, 34), rnd(-140, 0), rnd(-44, 44), rnd(-140, 0), 5, 10);
    c.restore(); }
  f.stuck.forEach(s => { c.save(); c.translate(s.x, s.y); c.rotate(s.a); c.strokeStyle = '#c9a25a'; c.lineWidth = 3; c.beginPath(); c.moveTo(-28, 0); c.lineTo(0, 0); c.stroke();
    c.strokeStyle = '#d9534f'; c.beginPath(); c.moveTo(-28, 0); c.lineTo(-22, -4); c.moveTo(-28, 0); c.lineTo(-22, 4); c.stroke(); c.restore(); });
  c.restore();
}
function drawIsland(f){

/* ===================== Стрельба ===================== */
const dirOf = (vx, vy) => Math.atan2(vy, vx);
function fire(owner, x, y, vx, vy, dmg, ty){
  ty = ty || 'norm'; arrows.push({x, y, vx, vy, own: owner, dmg, ty}); sfx(ty === 'fire' ? 'fire' : ty === 'elec' ? 'zap' : ty === 'bomb' ? 'bombshot' : 'shot');
}
/* Выстрел игрока: тянем палец назад — стрела летит в противоположную сторону */
function playerShoot(ang, power){
  const s = stats(), p = player, sh = shoulder(p), A = ARW[D.arrow], v = s.v * (.5 + .5 * power) * A.spd;
  const shots = tripleT > 0 ? [-.08, 0, .08] : [0];
  shots.forEach(o => fire('p', sh.x + Math.cos(ang) * 40, sh.y + Math.sin(ang) * 40, Math.cos(ang + o) * v, Math.sin(ang + o) * v, s.dmg * A.dm, D.arrow));
  p.reload = p.rmax = s.reload * A.rl; p.draw = 0; p.flinch = .4;
}
/* Бот целится баллистикой: решает уравнение дуги и добавляет ошибку, которая падает с раундом */
function botAim(){
  const b = bot, p = player, sx = b.x - 14, sy = baseY(b) - 96, tx = p.x, ty = baseY(p) - 58;
  const X = sx - tx, Y = sy - ty, vmin = Math.sqrt(G * (Y + Math.hypot(X, Y))), v = Math.min(1800, Math.max(900 + round * 25, vmin * 1.12)), disc = v ** 4 - G * (G * X * X + 2 * Y * v * v);
  let th = disc > 0 ? Math.atan2(v * v + (obs ? 1 : -1) * Math.sqrt(disc), G * X) : .8;   // с преградой бот стреляет навесом
  const sg = Math.max(.065, .19 - round * .0065); th += rnd(-sg, sg);
  const vv = v * (1 + rnd(-sg, sg));
  b.shot = {vx: -Math.cos(th) * vv, vy: -Math.sin(th) * vv, x: sx, y: sy}; b.aimA = dirOf(b.shot.vx, b.shot.vy);
}
function botThink(dt){
  const b = bot; if(!b || b.dead || b.born < 1 || player.dead) return;
  if(b.stun > 0){ b.shootT = 0; b.draw = 0; b.cd = Math.max(b.cd, .6); return; }
  if(b.shootT > 0){
    b.shootT -= dt; b.draw = 1 - b.shootT / .6;
    if(b.shootT <= 0){ const s = b.shot, n = Math.hypot(s.vx, s.vy);
      fire('b', s.x + s.vx / n * 40, s.y + s.vy / n * 40, s.vx, s.vy, 0); b.draw = 0; b.flinch = .3; b.cd = Math.max(2, 3.4 - round * .1) + rnd(0, .8); }
  } else if((b.cd -= dt) <= 0){ botAim(); b.shootT = .6; }
}

/* ===================== Попадания ===================== */
function hitTest(f, px, py){
  if(f.dead) return 0; const by = baseY(f);
  if(Math.hypot(px - f.x, py - (by - 116)) < 14) return 2;               // голова
  if(Math.abs(px - f.x) < 14 && py > by - 100 && py < by + 2) return 1;  // тело
  return 0;
}
function burst(x, y, col, n){ for(let i = 0; i < n; i++) parts.push({x, y, vx: rnd(-220, 220), vy: rnd(-300, 60), l: rnd(.4, .8), c: col, s: rnd(2, 5)}); }
function explode(x, y){
  sfx('boom'); burst(x, y, '#ff9b3d', 26); burst(x, y, '#ffd23f', 16); rings.push({x, y, r: 10, l: .5});
  const f = bot; if(f && !f.dead){ const d = Math.hypot(x - f.x, y - (baseY(f) - 60)); if(d < 130) damage(f, stats().dmg * 3 * (1 - d / 160), false, x, y, null); }
}
function dot(f, amt){ amt = Math.round(amt); f.hp -= amt; pops.push({x: f.x, y: baseY(f) - 130, txt: '-' + amt, c: '#ff9b3d', l: .8, big: false}); if(f.hp <= 0 && state === 'play') kill(f, false); }
function damage(f, amount, head, px, py, ang){
  amount = head ? Math.ceil(f.hp) : Math.round(amount); f.hp -= amount; f.flinch = 1;
  if(ang !== null && f.stuck.length < 5) f.stuck.push({x: px - f.x, y: py - f.y - f.dy, a: ang});
  burst(px, py, f.col, 10); sfx(head ? 'head' : 'hit');
  pops.push({x: px, y: py - 20, txt: head ? 'ХЕДШОТ!' : '-' + amount, c: head ? '#ffd23f' : '#fff', l: 1.2, big: head});
  if(f.isBot && head) heads++;
  if(f.hp <= 0) kill(f, head);
}
function kill(f, head){
  f.hp = 0; f.dead = true; f.vx = (f.isBot ? 1 : -1) * rnd(150, 300); f.vy = -rnd(400, 600); f.spin = rnd(-6, 6); sfx('die'); burst(f.x, baseY(f) - 90, f.col, 24);
  const r = run;
  if(f.isBot){                                      // победа в раунде: награда, лечение, новый противник
    state = 'win'; kills++; const reward = 250 + round * 50 + (head ? 100 : 0);
    D.coins += reward; earned += reward; D.tk = (D.tk || 0) + 1; save(); buildSel(); sfx('coin');
    pops.push({x: f.x, y: baseY(f) - 150, txt: '+' + reward, c: '#ffc83d', l: 1.6, big: true});
    if(wave < waves) setTimeout(() => { if(r !== run) return; wave++; round = (lvl - 1) * 2 + wave; player.hp = Math.min(player.max, player.hp + player.max * .3); spawnBot(); state = 'play'; }, 1600);
    else setTimeout(() => { if(r !== run) return; levelDone(); }, 1500);
  } else {                                          // поражение
    state = 'over'; save();
    setTimeout(() => { if(r !== run) return; $('oK').textContent = kills; $('oH').textContent = heads; $('oC').textContent = earned; $('hud').hidden = true; $('over').hidden = false; }, 1100);
  }
}

function update(dt){

    if(!f) return;
    f.idy = Math.sin(t * 1.2 + f.bob) * 3; f.flinch *= Math.exp(-dt * 8); f.born = Math.min(1, f.born + dt * 1.5);
    if(f.dead){ f.vy += 1400 * dt; f.dx += f.vx * dt; f.dy += f.vy * dt; f.rot += f.spin * dt; } else f.dy = f.idy;
  });

    if(f.burn > 0){ f.burn -= dt; f.bt = (f.bt || 0) + dt; parts.push({x: f.x + rnd(-12, 12), y: baseY(f) - rnd(10, 110), vx: rnd(-20, 20), vy: rnd(-80, -30), g: -120, l: .4, c: Math.random() < .5 ? '#ff8a1f' : '#ffd23f', s: rnd(3, 6)});
      if(f.bt >= .5){ f.bt -= .5; dot(f, stats().dmg * .3); } }
    if(f.stun > 0){ f.stun -= dt; if(Math.random() < .6) parts.push({x: f.x + rnd(-30, 30), y: baseY(f) - rnd(0, 130), vx: rnd(-90, 90), vy: rnd(-90, 90), g: 0, l: .15, c: '#6ef', s: rnd(2, 4)}); } });

    if(drag){ drag.ea = drag.ang + (Math.sin(t * 6.3) * .022 + Math.sin(t * 2.3) * .02) * (.5 + drag.pow); player.aimA = drag.ea; player.draw = player.reload > 0 ? 0 : drag.pow; }

    else if(a.ty === 'elec') parts.push({x: a.x + rnd(-8, 8), y: a.y + rnd(-8, 8), vx: 0, vy: 0, g: 0, l: .12, c: '#6ef', s: rnd(1.5, 3)});
    else if(a.ty === 'bomb') parts.push({x: a.x, y: a.y, vx: rnd(-20, 20), vy: rnd(-30, 0), g: -20, l: .4, c: 'rgba(150,160,190,.7)', s: rnd(3, 6)});
    for(let k = 0; k < 2 && !gone; k++){
      const h = dt * AK / 2; a.x += a.vx * h; a.y += a.vy * h; a.vy += G * h * (a.ty === 'elec' ? .35 : 1);
      const ht = tg ? hitTest(tg, a.x, a.y) : 0;
      if(ht){
        const ang = dirOf(a.vx, a.vy);
        const dmg = a.own === 'p' ? a.dmg * (ht === 2 ? 2 : 1) * rnd(.9, 1.1) : (8 + round * 1.6) * (1 - stats().armor) * (ht === 2 ? 1.8 : 1);
        if(a.ty === 'bomb') explode(a.x, a.y);

          if(!tg.dead && a.ty === 'fire') tg.burn = 3;

        if(a.ty === 'bomb') explode(a.x, a.y); else { sticks.push({x: a.x, y: a.y, a: dirOf(a.vx, a.vy), l: 1.6, own: a.own}); sfx('stick'); } gone = true;
      } else if([player, bot].some(f => f && Math.abs(a.x - f.x) < (f.iw || 300) / 2 && a.y >= baseY(f) && a.y < baseY(f) + 20)){
        if(a.ty === 'bomb') explode(a.x, a.y); else { sticks.push({x: a.x, y: a.y, a: dirOf(a.vx, a.vy), l: 1.6, own: a.own}); sfx('stick'); } gone = true;

    for(let j = i + 1; j < arrows.length; j++){ const b = arrows[j]; if(b.fall || a.own === b.own) continue;

        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; sfx('clash'); burst(mx, my, '#ffe9a8', 10);

  if(th.st){ c.fillStyle = '#dfe6ff'; stars.forEach(s => { c.globalAlpha = Math.min(1, th.st * (.3 + .3 * Math.sin(t + s.p))); c.beginPath(); c.arc(s.x * w, s.y * h, 1.2, 0, TAU); c.fill(); }); c.globalAlpha = 1; }
  th.orbs.forEach(o => { const mx = w * o.x, my = h * o.y, mr = h * o.r, mg = c.createRadialGradient(mx, my, mr * .5, mx, my, mr * 3.2);
    mg.addColorStop(0, 'rgba(' + o.g + ',.35)'); mg.addColorStop(1, 'rgba(' + o.g + ',0)'); c.fillStyle = mg; c.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    c.fillStyle = o.c; c.beginPath(); c.arc(mx, my, mr, 0, TAU); c.fill();
    if(o.ring){ c.strokeStyle = o.ring; c.lineWidth = mr * .12; c.beginPath(); c.ellipse(mx, my, mr * 1.7, mr * .45, -.35, 0, TAU); c.stroke(); } });
  th.hills.forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.moveTo(0, h); for(let x = 0; x <= w; x += 20) c.lineTo(x, h * ([.72, .82][i] + [.06, .05][i] * Math.sin(x / w * 5 + i * 2))); c.lineTo(w, h); c.fill(); });
  c.fillStyle = c.strokeStyle = th.pc || '#000'; PROPS[th.prop](c, w, h, h * .84, th);
  if(th.sea){ c.fillStyle = th.sea; c.beginPath(); c.moveTo(0, h); for(let x = 0; x <= w; x += 20) c.lineTo(x, h * .9 + Math.sin(x / 40 + t * 2) * 3); c.lineTo(w, h); c.fill(); }
  flies.forEach(f => {
    if(th.fx === 'snow'){ c.globalAlpha = .8 * f.s; c.fillStyle = '#fff'; c.beginPath(); c.arc((f.x * w + Math.sin(t + f.p) * 20 + w) % w, (f.y * h + t * 40 * f.s) % h, 2, 0, TAU); c.fill(); }
    else if(th.fx === 'ember'){ c.globalAlpha = .7 * f.s; c.fillStyle = th.fc; c.beginPath(); c.arc((f.x * w + Math.sin(t + f.p) * 18 + w) % w, h - (f.y * h + t * 50 * f.s) % h, 2, 0, TAU); c.fill(); }
    else { c.globalAlpha = .35 + .35 * Math.sin(t * 2 + f.p); c.fillStyle = th.fc; c.beginPath(); c.arc(f.x * w + Math.sin(t * .5 * f.s + f.p) * 24, f.y * h + Math.cos(t * .4 + f.p) * 16, 2, 0, TAU); c.fill(); } });
  c.globalAlpha = 1;
}
function drawObs(o){
  const c = ctx, th = LOC().th, x = o.x, w = o.w, top = o.top, bt = o.bot, g = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, th.isl[1]); g.addColorStop(.5, th.isl[0]); g.addColorStop(1, th.isl[1]); c.fillStyle = g;
  c.beginPath(); c.moveTo(x - w / 2, bt); c.lineTo(x - w / 2, top + 16); c.lineTo(x - w * .2, top); c.lineTo(x + w * .12, top + 9); c.lineTo(x + w / 2, top + 18); c.lineTo(x + w / 2, bt);
  if(bt < WH) c.lineTo(x + w * .1, bt + 22);   // парящий камень оканчивается острием
  c.closePath(); c.fill(); c.fillStyle = th.isl[2]; c.beginPath(); c.moveTo(x - w / 2, top + 16); c.lineTo(x - w * .2, top); c.lineTo(x + w * .12, top + 9); c.lineTo(x + w / 2, top + 18); c.lineTo(x + w / 2, top + 24); c.lineTo(x - w / 2, top + 22); c.fill();
}
function bolt(c, x1, y1, x2, y2, n, amp){ c.beginPath(); c.moveTo(x1, y1); for(let i = 1; i < n; i++){ const k = i / n; c.lineTo(x1 + (x2 - x1) * k + rnd(-amp, amp), y1 + (y2 - y1) * k + rnd(-amp, amp)); } c.lineTo(x2, y2); c.stroke(); }
function drawArrow(x, y, a, col, al = 1, ty){
  const c = ctx; c.save(); c.translate(x, y); c.rotate(a); c.globalAlpha = al;
  if(ty === 'fire' || ty === 'elec'){ c.shadowColor = ty === 'fire' ? '#ff8a1f' : '#4ee'; c.shadowBlur = 16; }
  c.strokeStyle = col; c.lineWidth = 3.5; c.lineCap = 'round'; c.beginPath(); c.moveTo(-32, 0); c.lineTo(0, 0); c.stroke();
  c.fillStyle = ty === 'fire' ? '#ff9b3d' : ty === 'elec' ? '#6ef' : '#e9eefc'; c.beginPath(); c.moveTo(7, 0); c.lineTo(-3, -5); c.lineTo(-3, 5); c.fill();
  c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.moveTo(-32, 0); c.lineTo(-38, -5); c.moveTo(-32, 0); c.lineTo(-38, 5); c.moveTo(-26, 0); c.lineTo(-32, -5); c.moveTo(-26, 0); c.lineTo(-32, 5); c.stroke();
  if(ty === 'elec'){ c.shadowColor = '#4ee'; c.shadowBlur = 10; c.strokeStyle = '#bff'; c.lineWidth = 1.8; for(let k = 0; k < 4; k++){ const bx = -rnd(0, 34), sg2 = Math.random() < .5 ? -1 : 1; bolt(c, bx, 0, bx + rnd(-10, 10), sg2 * rnd(14, 30), 3, 5); } }
  if(ty === 'bomb'){ c.fillStyle = '#20263c'; c.strokeStyle = '#9aa7d9'; c.lineWidth = 2; c.beginPath(); c.arc(6, 0, 9, 0, TAU); c.fill(); c.stroke(); c.fillStyle = '#ffc83d'; c.beginPath(); c.arc(8, -10, 2.5 + Math.sin(t * 30), 0, TAU); c.fill(); }
  c.restore();
}
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawBg();
  const v = view(); ctx.save(); ctx.translate(v.ox, v.oy); ctx.scale(v.sc, v.sc);
  if(obs) drawObs(obs);
  [player, bot].forEach(f => f && drawIsland(f));
  [player, bot].forEach(f => f && drawFig(f));
  if(bot && !bot.dead && state !== 'menu'){                                   // полоса здоровья бота под островом
    const w = 200, x = bot.x - w / 2, y = baseY(bot) + 126; ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - 2, y - 2, w + 4, 14);
    ctx.fillStyle = '#3df08a'; ctx.fillRect(x, y, w * Math.max(0, bot.hp / bot.max), 10); }
  sticks.forEach(s => drawArrow(s.x, s.y, s.a, s.own === 'p' ? '#ff9b3d' : '#3df08a', Math.min(1, s.l)));
  arrows.forEach(a => drawArrow(a.x, a.y, a.fall ? a.rot : dirOf(a.vx, a.vy), a.own === 'p' ? '#ff9b3d' : '#3df08a', a.fall ? Math.min(1, a.fl) : 1, a.ty));
  rings.forEach(r => { ctx.globalAlpha = clamp(r.l * 2, 0, 1); ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke(); });
  ctx.globalAlpha = 1;
  if(drag && state === 'play' && player.reload <= 0){                         // пунктир траектории
    const s = stats(), sh = shoulder(player), an = drag.ea === undefined ? drag.ang : drag.ea, sp = s.v * (.5 + .5 * drag.pow) * ARW[D.arrow].spd; let x = sh.x + Math.cos(an) * 40, y = sh.y + Math.sin(an) * 40, vx = Math.cos(an) * sp, vy = Math.sin(an) * sp;
    for(let i = 0; i < 8; i++){ for(let k = 0; k < 3; k++){ x += vx * .016; y += vy * .016; vy += G * (D.arrow === 'elec' ? .35 : 1) * .016; }
      ctx.globalAlpha = 1 - i / 10; ctx.fillStyle = '#e8f0ff'; ctx.beginPath(); ctx.arc(x, y, 3.5 - i * .06, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1; }
  zaps.forEach(z => { ctx.globalAlpha = clamp(z.l * 4, 0, 1); ctx.shadowColor = '#4ee'; ctx.shadowBlur = 18; ctx.strokeStyle = '#eaffff'; ctx.lineWidth = 4; const tx = z.x + rnd(-25, 25); bolt(ctx, tx, -40, z.x, z.y, 8, 22); ctx.lineWidth = 2; ctx.strokeStyle = '#6ef'; bolt(ctx, tx, -40, z.x, z.y, 8, 22); ctx.shadowBlur = 0; });
  ctx.globalAlpha = 1;
  parts.forEach(p => { ctx.globalAlpha = clamp(p.l * 2, 0, 1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.textAlign = 'center';
  pops.forEach(p => { ctx.globalAlpha = clamp(p.l * 1.5, 0, 1); ctx.font = (p.big ? 34 : 24) + 'px "Russo One",sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(p.txt, p.x, p.y); ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y); });
  ctx.restore();
}
let last = performance.now();
function frame(now){ const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(frame); }

/* ===================== Управление ===================== */
const toWorld = e => { const v = view(); return {x: (e.clientX - v.ox) / v.sc, y: (e.clientY - v.oy) / v.sc}; };
/* оттягиваем палец от точки касания: направление выстрела противоположно, сила — длина оттяжки */
function pull(e){
  const w = toWorld(e), dx = drag.x0 - w.x, dy = drag.y0 - w.y;
  drag.ang = clamp(Math.atan2(dy, Math.max(dx, 1)), -1.5, .35); drag.pow = clamp(Math.hypot(dx, dy) / 170, 0, 1);
}
addEventListener('pointerdown', e => {
  au(); if(e.target.closest('button') || state !== 'play' || player.dead) return;
  const w = toWorld(e); drag = {x0: w.x, y0: w.y, ang: -.3, pow: 0, id: e.pointerId};
});
addEventListener('pointermove', e => { if(drag && e.pointerId === drag.id) pull(e); });
const release = e => {
  if(!drag || e.pointerId !== drag.id) return;
  pull(e); const d = drag; drag = null;
  if(state === 'play' && player.reload <= 0 && d.pow > .18) playerShoot(d.ea === undefined ? d.ang : d.ea, d.pow);
};
addEventListener('pointerup', release); addEventListener('pointercancel', () => { drag = null; });
$('lwNext').onclick = startGame; $('lwHome').onclick = toMenu;
$('bPlay').onclick = startGame; $('oRetry').onclick = startGame;
$('hHome').onclick = $('oHome').onclick = toMenu;
$('tri').onclick = () => { if(state === 'play' && tripleT <= 0 && D.coins >= 500){ D.coins -= 500; tripleT = 15; save(); sfx('coin'); } };

toMenu();
requestAnimationFrame(frame);
})();
</script>
