<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сапёр</title>
<style>
:root{--m:#c9c4ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(700px 520px at 0% 0%,#7c2df0 0%,transparent 70%),radial-gradient(650px 520px at 100% 100%,#ff3d9a 0%,transparent 70%),radial-gradient(600px 500px at 100% 0%,#1e6bff 0%,transparent 65%),#1a0b4a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;overflow:hidden;user-select:none}
.app{width:100%;max-width:480px;height:100%;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);overflow-y:auto}
.screen.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.ic{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.dim{opacity:.25}.ic.big{width:100px;height:100px;stroke-width:1.6}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;padding:16px;border-radius:22px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#a855f7,#3b82f6);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 7px 0 rgba(30,10,90,.55),0 12px 24px rgba(60,30,200,.5)}
.btn.pink{background:linear-gradient(135deg,#ff4d8d,#ff9a3c);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 7px 0 rgba(120,20,60,.55),0 12px 24px rgba(255,60,120,.45)}
.btn:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 rgba(30,10,90,.55)}
.top,.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.ib{width:46px;height:46px;border-radius:15px;background:rgba(10,0,50,.4);border:1.5px solid rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.ib .ic{width:24px;height:24px}
.pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:rgba(10,0,50,.45);border:1.5px solid rgba(255,255,255,.25);font-weight:900;font-size:18px}
.pill .ic{color:#ffd54a}.pill.bad{animation:shake .4s;border-color:#ff5f7a}
h1{font-size:40px;font-weight:900;text-align:center;text-shadow:0 4px 18px rgba(20,0,80,.5)}
h1 span{background:linear-gradient(90deg,#5ff0ff,#ff7ab4,#ffc46b);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{align-self:flex-start;color:var(--m);font-size:15px;margin-top:6px}
.sub{color:var(--m);font-size:15px;text-align:center}
#list,#slist{width:100%;display:flex;flex-direction:column;gap:10px}
.mc,.it{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:20px;text-align:left;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:1.5px solid rgba(255,255,255,.25);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 5px 0 rgba(20,0,80,.35)}
.mc:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(20,0,80,.35)}
.mi{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;flex:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.mi .ic{width:28px;height:28px}
.mt{flex:1;min-width:0}.mt b{display:block;font-size:17px}.mt small{display:block;color:var(--m);font-size:13px;margin-top:2px}
.mb{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:#ffd54a;text-align:right}
.pips{display:flex;gap:5px;margin-top:6px}.pips i{width:16px;height:6px;border-radius:9px;background:rgba(255,255,255,.2)}.pips i.on{background:#5dffb0}
.buy{display:flex;align-items:center;gap:5px;padding:10px 13px;border-radius:14px;font-weight:900;background:linear-gradient(135deg,#ffd54a,#ff9a3c);color:#3a1a00;box-shadow:0 4px 0 rgba(120,60,0,.6)}
.buy:active{transform:translateY(3px)}.buy:disabled{background:rgba(255,255,255,.15);color:var(--m);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.st{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 4px;border-radius:14px;background:rgba(10,0,50,.4);border:1.5px solid rgba(255,255,255,.2);font-weight:900;font-size:16px;min-height:42px}
#lv .ic{color:#ff5fa2}.sh{display:flex;align-items:center;gap:2px;color:#5dffb0}
.st>.ic{width:19px;height:19px}.st.c .ic{color:#ffd54a}.st.k .ic{color:#ff7ab4}
.bw{flex:1;display:grid;place-items:center;width:100%;min-height:0}
#board{display:grid;grid-template-columns:repeat(var(--c),var(--cs));gap:3px;padding:8px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.3);box-shadow:0 18px 40px rgba(10,0,60,.5);animation:bin .4s}
@keyframes bin{from{transform:scale(.85);opacity:0}}
.cell{width:var(--cs);height:var(--cs);border-radius:calc(var(--cs)*.26);padding:0;display:grid;place-items:center;touch-action:manipulation;position:relative}
.cell.a{background:linear-gradient(160deg,#a47aff,#6d4ae0)}.cell.b{background:linear-gradient(160deg,#8d5cf7,#5a3bd0)}
.cell:not(.op){box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 rgba(20,0,80,.5)}
.cell.op{background:rgba(10,0,50,.5);box-shadow:inset 0 2px 5px rgba(0,0,0,.4);animation:opn .32s var(--d,0ms) backwards}
@keyframes opn{from{transform:scale(.3) rotate(-25deg);opacity:0}}
.cell b{font-size:calc(var(--cs)*.6);font-weight:900;text-shadow:0 0 8px currentColor}
.cell .ic{width:62%;height:62%}
.cell.fl{color:#ff5fa2}.cell.fl .ic{animation:drop .25s;fill:currentColor}
@keyframes drop{from{transform:translateY(-70%) scale(1.5);opacity:0}}
.cell.sv{box-shadow:0 0 0 2px #5dffb0,0 0 14px #5dffb0}
.cell.mn{color:#fff}.cell.bm{background:radial-gradient(#ffe14a,#ff4d2e 60%,#8a0f3a)!important;animation:opn .3s var(--d,0ms) backwards,pulse .5s .3s}
@keyframes pulse{50%{transform:scale(1.25)}}
.cell.hl{animation:hl .45s 2}@keyframes hl{50%{box-shadow:0 0 0 3px #ffe14a,0 0 20px #ffe14a;transform:scale(1.12)}}
.bar{display:flex;justify-content:center;gap:10px;width:100%}
.tb{position:relative;width:76px;padding:9px 0 7px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1.5px solid rgba(255,255,255,.25);box-shadow:0 4px 0 rgba(20,0,80,.4)}
.tb .ic{width:26px;height:26px}.tb:active{transform:translateY(3px)}
.tb.on{background:linear-gradient(135deg,#ffd54a,#ff9a3c);color:#3a1a00}
.cnt{position:absolute;top:-7px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:#ff3d7f;display:grid;place-items:center;font-size:12px;padding:0 5px}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(26,11,74,.93);z-index:5;padding:20px}
.ov.on{display:flex;animation:fade .3s}
.rc{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.rc h2{font-size:38px;font-weight:900}.rc .big{color:#ff7ab4}.rc.win .big{color:#ffd54a;animation:pop .6s}
.rr{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:900;color:#ffd54a}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:rgba(10,0,50,.9);border:1.5px solid rgba(255,255,255,.3);font-weight:800;font-size:15px;opacity:0;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{animation:tst 1.8s}@keyframes tst{10%,80%{opacity:1}}
.fx{position:fixed;display:flex;align-items:center;gap:2px;font-weight:900;color:#ffd54a;pointer-events:none;z-index:20;animation:up .9s forwards;text-shadow:0 2px 6px #000}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.conf{position:fixed;top:-20px;width:10px;height:15px;border-radius:2px;animation:fall linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.app.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
#flash{position:fixed;inset:0;background:#ff3d3d;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:fl .5s}@keyframes fl{0%{opacity:.55}100%{opacity:0}}
.bet{display:none;align-items:center;gap:10px;width:100%;padding:7px 12px;border-radius:16px;background:rgba(10,0,50,.45);border:1.5px solid rgba(255,213,74,.55)}
.bet.on{display:flex}
.bet .cw{width:46px;height:46px;display:grid;place-items:center;flex:none}
.bet .cw .ic{width:var(--sz,28px);height:var(--sz,28px);color:#ffd54a;transition:.45s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 8px #ffd54a)}
.bet .cw.bump{animation:bump .4s}@keyframes bump{50%{transform:scale(1.25)}}
.bet .tx{flex:1;font-weight:900;font-size:16px;min-width:0}.bet .tx small{display:block;color:var(--m);font-size:12px;font-weight:700}
.bet .co{padding:10px 14px;border-radius:13px;font-weight:900;background:linear-gradient(135deg,#5dffb0,#22b8cf);color:#032a22;box-shadow:0 4px 0 rgba(0,70,60,.6)}
.bet .co:active{transform:translateY(3px)}.bet .co:disabled{opacity:.35;box-shadow:none}
.bet.burn{border-color:#ff6a2e}.bet.burn .cw .ic{width:40px;height:40px}
.fl2{color:#ff6a2e!important;filter:drop-shadow(0 0 10px #ff4d2e)!important;animation:flick .3s infinite alternate}
.rc .big.fl2{color:#ff6a2e}
@keyframes flick{to{transform:scale(1.12) rotate(4deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:flex;align-items:center;gap:4px;padding:12px 16px;border-radius:14px;font-weight:900;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25)}
.chip .ic{color:#ffd54a}.chip.on{background:linear-gradient(135deg,#ffd54a,#ff9a3c);color:#3a1a00}.chip.on .ic{color:#3a1a00}.chip:disabled{opacity:.3}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

<section class="screen on" id="menu">
  <div class="mh"><div class="pill"><svg class="ic"><use href="#i-coin"/></svg><span id="cn">0</span></div><span style="flex:1"></span><button class="ib" id="shopb" aria-label="Магазин"><svg class="ic"><use href="#i-bag"/></svg></button><button class="ib mu" aria-label="Звук"></button></div>

<script>
const $=s=>document.querySelector(s);
const ico=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const fmt=s=>{s=Math.max(0,Math.floor(s));return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const today=()=>new Date().toISOString().slice(0,10);
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ---------- save ---------- */
let S={coins:0,up:{shield:0,pack:0,magnet:0,clock:0},stock:{hint:0,radar:0,blast:0},best:{},daily:'',muted:false};
try{const d=JSON.parse(localStorage.getItem('sapper1')||'{}');S={...S,...d,up:{...S.up,...d.up},stock:{...S.stock,...d.stock}}}catch(e){}
const save=()=>{try{localStorage.setItem('sapper1',JSON.stringify(S))}catch(e){}};

/* ---------- sound ---------- */
let AC,M,DL,NB;
function initAudio(){
  if(AC){if(AC.state=='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const comp=AC.createDynamicsCompressor();M=AC.createGain();M.gain.value=.9;M.connect(comp);comp.connect(AC.destination);
  DL=AC.createDelay(1);DL.delayTime.value=.19;
  const fb=AC.createGain();fb.gain.value=.34;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
  DL.connect(lp);lp.connect(fb);fb.connect(DL);
  const wet=AC.createGain();wet.gain.value=.45;lp.connect(wet);wet.connect(M);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const ok=()=>AC&&!S.muted,T=()=>AC.currentTime+.01;
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function note(f,t,o={}){
  const{type='sine',vol:v=.2,a=.005,dec=.4,send=.3,slide=0}=o;
  const os=AC.createOscillator(),g=AC.createGain(),s=AC.createGain();
  os.type=type;os.frequency.setValueAtTime(f,t);if(slide)os.frequency.exponentialRampToValueAtTime(slide,t+a+dec);
  env(g,t,a,v,dec);s.gain.value=send;os.connect(g);g.connect(M);g.connect(s);s.connect(DL);os.start(t);os.stop(t+a+dec+.05);
}
const bell=(f,t,v=.2,d=.9)=>[[1,1],[2.01,.35],[3.02,.18],[4.2,.08]].forEach(([m,a],i)=>note(f*m,t,{vol:v*a,dec:d/(1+i*.6),send:.45}));
const marimba=(f,t,v=.28)=>{note(f,t,{vol:v,dec:.35,send:.25});note(f*4,t,{vol:v*.25,dec:.08,send:0})};
function noise(t,a,dec,vol,type,f0,f1){
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+a+dec);
  const g=AC.createGain();env(g,t,a,vol,dec);s.connect(fl);fl.connect(g);g.connect(M);s.start(t);s.stop(t+a+dec+.05);
}

/* ---------- game setup ---------- */
function start(id,lv,prev,stake){
  initAudio();
  const M=MODES.find(x=>x.id==id);let r=M.r,c=M.c,m=M.m;
  if(M.end){c=Math.min(12,8+(lv>>1));r=Math.min(14,8+lv);m=Math.min(Math.round(r*c*.15)+lv,Math.floor(r*c*.25))}
  if(g)clearInterval(g.tm);
  g={id,M,r,c,m,lv,stake:prev?prev.stake:(stake||0),lost:0,pv:0,cells:Array.from({length:r*c},()=>({})),first:1,over:0,
    lives:prev?prev.lives:(M.lives||1),shield:prev?prev.shield:S.up.shield,
    free:prev?prev.free:{hint:S.up.pack,radar:S.up.pack,blast:S.up.pack},
    run:prev?prev.run:0,left:m,opened:0,armed:null,t0:0,el:0,lt:0,tm:null,
    tmax:M.t?M.t+10*S.up.clock:0,rng:M.seed?mul(hash(today())):Math.random};
  const B=$('#board');B.innerHTML='';el=[];
  for(let i=0;i<r*c;i++){const b=document.createElement('button');b.dataset.i=i;B.appendChild(b);el.push(b);draw(i)}
  B.style.animation='none';void B.offsetWidth;B.style.animation='';
  $('#gname').textContent=M.n+(M.end?' · поле '+(lv+1):'');
  $('#tim').textContent=fmt(g.tmax);$('#res').classList.remove('on');
  const bt=$('#bet');bt.className='bet'+(g.stake?' on':'');
  bt.innerHTML=g.stake?`<span class="cw">${ico('coin')}</span><span class="tx"><span id="bt1"></span><small id="bt2"></small></span><button class="co" id="cash">Забрать</button>`:'';
  if(!prev&&g.stake){S.coins-=g.stake;save()}
  fit();hud();show('game');
}
function fit(){
  if(!g)return;
  const w=Math.min(innerWidth,480)-46,h=innerHeight-310-(g.stake?54:0);
  const cs=Math.max(22,Math.min(50,Math.floor(Math.min((w-(g.c-1)*3)/g.c,(h-(g.r-1)*3)/g.r))));
  const B=$('#board');B.style.setProperty('--cs',cs+'px');B.style.setProperty('--c',g.c);
}
addEventListener('resize',fit);
const nb=i=>{const{r,c}=g,x=i%c,y=(i/c)|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(X>=0&&X<c&&Y>=0&&Y<r)o.push(Y*c+X)}return o};
function place(i){
  const{r,c}=g,x0=i%c,y0=(i/c)|0,pool=[];
  for(let k=0;k<r*c;k++)if(Math.abs(k%c-x0)>1||Math.abs((k/c|0)-y0)>1)pool.push(k);
  for(let k=pool.length-1;k>0;k--){const j=Math.floor(g.rng()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]]}
  g.m=Math.min(g.m,pool.length);g.left=g.m;
  pool.slice(0,g.m).forEach(k=>g.cells[k].mine=1);
  const safe=pool.slice(g.m);
  safe.slice(0,Math.ceil(g.m/5)).forEach(k=>g.cells[k].coin=1);
  g.cells.forEach((x,k)=>{x.n=nb(k).filter(j=>g.cells[j].mine).length});
  hud();
}
function draw(i,d){
  const x=g.cells[i],e=el[i];let cl='cell '+(((i%g.c)+(i/g.c|0))%2?'a':'b'),h='';
  if(x.open){cl+=' op';if(x.mine){cl+=' mn'+(x.boom?' bm':'');h=ico('mine')}else if(x.n)h=`<b style="color:${NC[x.n]}">${x.n}</b>`}
  else if(x.flag){cl+=' fl'+(x.saved?' sv':'');h=ico('flag')}
  e.className=cl;e.innerHTML=h;if(d!=null)e.style.setProperty('--d',d+'ms');
}
function hud(){
  $('#lft').textContent=g.left;$('#rn').textContent=g.run;
  let h='';if((g.M.lives||1)>1)for(let i=0;i<g.M.lives;i++)h+=ico('heart',i<g.lives?'':'dim');
  if(g.shield)h+=`<span class="sh">${ico('shield')}${g.shield}</span>`;
  $('#lv').innerHTML=h||ico('heart','dim');
  ['hint','radar','blast'].forEach(k=>$('#b-'+k+' .cnt').textContent=g.free[k]+S.stock[k]);

const B=$('#board');let lp=null,lpd=0;

function tap(i){
  if(g.over)return;const x=g.cells[i];
  if(g.armed=='blast'){if(g.first){return}blast(i);return}
  if(flagMode)return toggleFlag(i);
  if(x.open&&x.n>0)return chord(i);
  open(i);
}
function toggleFlag(i){
  const x=g.cells[i];if(g.over||x.open||x.saved)return;
  x.flag=x.flag?0:1;g.left+=x.flag?-1:1;draw(i);hud();x.flag?SND.flag():SND.unflag();vib(12);
}
function chord(i){
  const x=g.cells[i],ns=nb(i);
  if(ns.filter(j=>g.cells[j].flag).length!=x.n)return;
  ns.forEach(j=>open(j));
}

/* ---------- core ---------- */
function open(i){
  const x=g.cells[i];if(x.open||x.flag||g.over)return;
  if(g.first){place(i);g.first=0;g.t0=Date.now();timer()}
  if(x.mine)return hit(i);
  const q=[i],seen=new Set([i]);let k=0,cnt=0;
  while(k<q.length){
    const j=q[k],y=g.cells[j];k++;
    if(y.open||(y.flag&&j!=i))continue;
    cnt++;y.open=1;g.opened++;const d=Math.min(k*14,700);draw(j,d);
    if(y.coin){y.coin=0;g.run+=5;setTimeout(()=>{fx(j,'+5',1);SND.coin()},d)}
    if(!y.n)for(const z of nb(j))if(!seen.has(z)&&!g.cells[z].mine){seen.add(z);q.push(z)}
  }
  cnt>1?SND.casc(cnt):SND.open(x.n);hud();checkWin();
}
function hit(i){
  const x=g.cells[i];
  if(g.shield>0){g.shield--;x.flag=1;x.saved=1;g.left--;draw(i,0);SND.shield();vib(40);toast('Щит спас от мины');hud();return}
  x.open=1;x.boom=1;g.left--;draw(i,0);SND.boom();shake();g.lives--;hud();
  if(g.lives<=0)end(0);
}
function checkWin(){
  if(g.over||g.opened<g.r*g.c-g.m)return;
  if(g.M.end){
    g.over=1;clearInterval(g.tm);
    const rw=Math.round((g.M.rw+10*g.lv)*(1+.15*S.up.magnet));g.run+=rw;hud();
    SND.win();toast('Поле пройдено  +'+rw);confetti(24);
    setTimeout(()=>{if(g&&!g.dead&&g.over&&g.M.end)start(g.id,g.lv+1,g)},1500);
  }else end(1);
}
function timer(){
  clearInterval(g.tm);
  g.tm=setInterval(()=>{
    g.el=(Date.now()-g.t0)/1000;
    if(g.tmax){const l=g.tmax-g.el;if(l<=0){$('#tim').textContent='0:00';end(0,1);return}
      $('#tim').textContent=fmt(Math.ceil(l));if(l<10&&Math.ceil(l)!=g.lt){g.lt=Math.ceil(l);SND.tick()}}
    else $('#tim').textContent=fmt(g.el);
  },200);
}
function end(w,tm){
  if(g.over&&w)return;g.over=1;clearInterval(g.tm);
  if(g.t0)g.el=(Date.now()-g.t0)/1000;
  let k=0,payout=0;
  if(g.stake){if(w)payout=betVal();else g.lost=1}
  if(w!==2)g.cells.forEach((x,i)=>{
    if(!x.mine||x.open||x.saved)return;
    if(w){x.flag=1;draw(i)}else if(!x.flag){x.open=1;draw(i,300+(k++)*40)}
  });
  let rw=0,rec=0;const mg=1+.15*S.up.magnet;
  if(w===1){
    rw=Math.round(g.M.rw*mg);
    if(g.M.seed&&S.daily!=today()){rw*=2;S.daily=today()}
    if(!S.best[g.id]||g.el<S.best[g.id]){S.best[g.id]=g.el;rec=1}
  }else if(!w&&!g.M.end)rw=Math.round(g.M.rw*.25*(g.opened/(g.r*g.c-g.m||1))*mg);
  rw+=g.run;S.coins+=rw+payout;save();hud();
  if(w===1){SND.win();confetti(40)}
  else if(w===2){SND.coin();setTimeout(SND.buy,150)}
  else{setTimeout(SND.lose,tm?0:700);if(g.stake)setTimeout(SND.burn,tm?0:300)}
  setTimeout(()=>{
    const bl=g.stake?(w?`<p class="rr" style="font-size:24px">Ставка ${g.stake} → ${payout}${ico('coin')}</p>`:`<p class="rr" style="font-size:24px;color:#ff8a4a">${ico('flame')}Ставка сгорела −${g.stake}</p>`):'';
    const ic=w?'trophy':(g.stake?'flame':'mine');
    $('#res').innerHTML=`<div class="rc ${w?'win':''}">${ico(ic,'big'+(ic=='flame'?' fl2':''))}<h2>${w===1?'Победа!':w===2?'Ставка забрана':tm?'Время вышло':'Взрыв!'}</h2><p class="rr">+${rw}${ico('coin')}</p>${bl}<p class="sub">${g.M.end?'Полей пройдено: '+g.lv:'Время: '+fmt(g.el)+(rec?'. Новый рекорд!':'')}</p><button class="btn" id="rep">Ещё раз</button><button class="btn pink" id="rhome">В меню</button></div>`;
    $('#res').classList.add('on');
  },w?1000:1000+k*40+500);
}
$('#res').onclick=e=>{const b=e.target.closest('button');if(!b)return;SND.ui();b.id=='rep'?askStake(g.id):menu()};
$('#gback').onclick=()=>{SND.ui();menu()};
function confetti(n){
  const cols=['#a855f7','#38e8ff','#ff5fa2','#5dffb0','#ffe14a'];
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='conf';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];

    document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}

/* ---------- bonuses ---------- */
const spend=k=>{if(g.free[k]>0)g.free[k]--;else{S.stock[k]--;save()}hud()};
function useB(k){
  if(g.over)return;
  if(g.first){toast('Сначала сделай первый ход');SND.err();return}
  if(g.free[k]+S.stock[k]<1){toast('Бонус закончился. Купи в магазине');SND.err();return}
  if(k=='blast'){g.armed=g.armed?null:'blast';hud();if(g.armed)toast('Выбери центр области');return}
  if(k=='hint'){
    const c=[],pr=[];g.cells.forEach((x,i)=>{if(!x.mine&&!x.open&&!x.flag){c.push(i);if(nb(i).some(j=>g.cells[j].open))pr.push(i)}});
    const L=pr.length?pr:c;if(!L.length)return;
    const i=L[Math.floor(Math.random()*L.length)];spend(k);SND.power();el[i].classList.add('hl');
    setTimeout(()=>{if(!g.over)open(i)},500);
  }else{
    const c=[];g.cells.forEach((x,i)=>{if(x.mine&&!x.open&&!x.saved)c.push(i)});
    if(!c.length)return;const i=c[Math.floor(Math.random()*c.length)],x=g.cells[i];
    spend(k);SND.power();if(!x.flag)g.left--;x.flag=1;x.saved=1;draw(i);hud();
  }
}
function blast(i){
  spend('blast');g.armed=null;SND.power();hud();
  [i,...nb(i)].forEach((j,n)=>setTimeout(()=>{
    if(g.over)return;const x=g.cells[j];
    if(x.mine){if(!x.flag)g.left--;x.flag=1;x.saved=1;draw(j);hud()}
    else if(!x.open&&!x.flag)open(j);
  },n*70));
}
['hint','radar','blast'].forEach(k=>$('#b-'+k).onclick=()=>useB(k));

/* ---------- stake ---------- */
let sk=0;
function betVal(){
  const sf=g.r*g.c-g.m||1,p=Math.min(1,g.opened/sf),mx=MX[g.id];
  return Math.round(g.stake*(g.M.end?1+.5*g.lv+.5*p:1+(mx-1)*p));
}
function betUI(){
  if(!g.stake)return;const cw=$('#bet .cw');if(!cw)return;
  if(g.lost){$('#bet').classList.add('burn');cw.innerHTML=ico('flame','fl2');$('#bt1').textContent='Ставка сгорела';$('#bt2').textContent='−'+g.stake;$('#cash').disabled=true;return}
  const v=betVal(),m=v/g.stake;
  cw.style.setProperty('--sz',Math.min(44,26+(m-1)*18)+'px');
  $('#bt1').textContent=g.stake+' → '+v;$('#bt2').textContent='множитель ×'+m.toFixed(2);
  $('#cash').disabled=!!(g.first||g.over||v<=g.stake);
  if(v>g.pv){cw.classList.remove('bump');void cw.offsetWidth;cw.classList.add('bump')}g.pv=v;
}
$('#bet').onclick=e=>{const b=e.target.closest('#cash');if(b&&!b.disabled&&!g.over&&!g.first)end(2)};
function askStake(id){
  const M=MODES.find(x=>x.id==id),o=$('#stk');
  if(sk>S.coins)sk=0;
  o.innerHTML=`<div class="rc"><h2>${M.n}</h2><p class="sub">Выиграешь: ставка вырастет ${M.end?'с каждым полем':'до ×'+MX[id]}. Проиграешь: ставка сгорит.</p><div class="chips">${[0,10,25,50,100,250].map(v=>`<button class="chip ${v==sk?'on':''}" data-v="${v}" ${v>S.coins?'disabled':''}>${v?v+ico('coin'):'Без ставки'}</button>`).join('')}</div><p class="rr" style="font-size:22px">${sk?(M.end?'Растёт с каждым полем':'Победа: '+Math.round(sk*MX[id])+ico('coin'))+'&nbsp; '+ico('flame')+'−'+sk:'Играем без ставки'}</p><button class="btn" id="go">Играть</button><button class="btn pink" id="no">Назад</button></div>`;
  o.classList.add('on');
  o.onclick=e=>{
    const c=e.target.closest('.chip');if(c){if(!c.disabled){sk=+c.dataset.v;SND.ui();askStake(id)}return}
    const b=e.target.closest('button');if(!b)return;SND.ui();o.classList.remove('on');
    if(b.id=='go')start(id,0,null,sk);
  };
}

menu();
</script>
</body>
</html>
